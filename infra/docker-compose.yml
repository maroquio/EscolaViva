name: escolaviva

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: escolaviva
      POSTGRES_USER: escolaviva
      POSTGRES_PASSWORD: escolaviva_dev
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escolaviva -d escolaviva"]
      interval: 5s
      timeout: 3s
      retries: 12

  test_database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: escolaviva_teste
      POSTGRES_USER: escolaviva
      POSTGRES_PASSWORD: escolaviva_dev
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    ports:
      - "${TEST_DB_PORT:-5432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escolaviva -d escolaviva_teste"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://escolaviva:escolaviva_dev@database:5432/escolaviva
      PORT: "3000"
      FRONT_PATH: /app/front
    ports:
      - "3000:3000"

volumes:
  database_data:
