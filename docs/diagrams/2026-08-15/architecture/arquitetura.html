  <style>
    :root { color-scheme: dark; --page:#0f0f1a; --panel:#0f172a; --border:#334155; --text:#e2e8f0; --muted:#94a3b8; --accent:#a855f7; }
    html[data-theme="light"] { color-scheme:light; --page:#f8fafc; --panel:#fff; --border:#cbd5e1; --text:#0f172a; --muted:#475569; --accent:#7c3aed; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:linear-gradient(135deg,var(--page),#1a1a2e); color:var(--text); font-family:'SF Mono','Fira Code',ui-monospace,monospace; }
    body { display:grid; grid-template-rows:auto 1fr; }
    .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 14px; background:color-mix(in srgb,var(--panel) 92%,transparent); border-bottom:1px solid var(--border); z-index:2; }
    .title { margin-right:auto; font-size:13px; font-weight:700; }
    button,select { min-height:34px; padding:6px 10px; color:var(--text); background:var(--panel); border:1px solid var(--border); border-radius:8px; font:inherit; cursor:pointer; }
    button:hover,button:focus-visible,select:focus-visible { border-color:var(--accent); outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent); outline-offset:1px; }
    #stage { position:relative; overflow:hidden; touch-action:none; cursor:grab; }
    #stage.dragging { cursor:grabbing; }
    /* Sem `will-change:transform` e sem `filter:` — as duas rasterizam o SVG antes do zoom.
       `will-change` promove #canvas a camada de composicao propria: o Chrome rasteriza a camada
       uma vez, no tamanho em que ela estava, e a GPU passa a escalar o bitmap em vez de reler o
       vetor. `filter:drop-shadow()` obriga o elemento a virar bitmap antes de o filtro rodar, e
       sozinha ja bastaria para pixelar. A sombra volta como `box-shadow`, que se aplica a CAIXA
       do elemento em vez do conteudo pintado e por isso nao força rasterizacao. */
    #canvas { width:100%; height:100%; display:grid; place-items:center; transform-origin:0 0; }
    #canvas svg { max-width:calc(100vw - 40px); max-height:calc(100vh - 92px); width:auto; height:auto; box-shadow:0 22px 60px rgba(0,0,0,.28); user-select:none; }
    #status { min-width:76px; color:var(--muted); font-size:12px; text-align:center; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; transition:none!important; } }
  </style>

  <text x="36" y="44" font-size="22" fill="#111827" font-weight="600" text-anchor="start">EscolaViva — Arquitetura da aplicação</text>
  <text x="36" y="70" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">Monolito modular · quatro bounded contexts · dependência sempre apontando para dentro · fronteiras verificadas por ferramenta, não por combinado</text>
  <rect x="68" y="104" width="1096" height="92" rx="8" ry="8" fill="#111827" stroke="#374151" stroke-width="1.4" />
  <text x="90" y="132" font-size="14" fill="#f9fafb" font-weight="600" text-anchor="start">src/main.ts — raiz de composição</text>
  <text x="90" y="154" font-size="11" fill="#cbd5e1" font-weight="400" text-anchor="start">O primeiro import é config: valida o ambiente e lança. Processo que sobe sem DATABASE_URL descobre isso no meio de uma matrícula.</text>
  <text x="90" y="172" font-size="11" fill="#cbd5e1" font-weight="400" text-anchor="start">Bun.serve({ fetch: app.fetch })   ·   iniciarAgendador([expurgoDeSessoes]) — o único ponto fora da web que chama um módulo direto</text>
  <text x="90" y="188" font-size="11" fill="#94a3b8" font-weight="400" text-anchor="start">SIGTERM/SIGINT: para de aceitar → drena o que está em curso → fecha o pool. Nesta ordem, para a fila não crescer enquanto drena.</text>
  <rect x="52" y="212" width="1128" height="188" rx="12" ry="12" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,5" data-graph-role="container" />
  <text x="68" y="236" font-size="12.5" fill="#475569" font-weight="600" text-anchor="start">Interface (delivery) — src/web/ : HTTP entra, HTML sai. Nenhuma regra de negócio mora aqui.</text>
  <rect x="68" y="258" width="344" height="124" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.4" />
  <text x="84" y="280" font-size="12.5" fill="#2563eb" font-weight="600" text-anchor="start">src/web/app.ts</text>
  <text x="84" y="300" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start">Hono. A ordem da cadeia é a semântica:</text>
  <text x="84" y="316" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start">erros → correlação → cache → sessão → rotas</text>
  <text x="84" y="332" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="start">onError repete o middleware de erros porque o</text>
  <text x="84" y="348" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="start">Hono não deixa a exceção subir até o next().</text>
  <text x="84" y="364" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="start">Serve /publico com allowlist de nome de arquivo.</text>
  <rect x="444" y="258" width="344" height="124" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.4" />
  <text x="460" y="280" font-size="12.5" fill="#2563eb" font-weight="600" text-anchor="start">src/web/rotas/</text>
  <text x="460" y="300" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start">7 routers montados por prefixo: login, conta,</text>
  <text x="460" y="316" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start">rede, secretaria, professor, responsavel,</text>
  <text x="460" y="332" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="start">comunicados. mapa.ts dá ROTAS tipadas — o</text>
  <text x="460" y="348" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="start">compilador cobra os :params, o .eta não.</text>
  <text x="460" y="364" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="start">Idempotência só nos grupos que escrevem.</text>
  <rect x="820" y="258" width="344" height="124" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.4" />
  <text x="836" y="280" font-size="12.5" fill="#2563eb" font-weight="600" text-anchor="start">src/web/render.ts + templates/</text>
  <text x="836" y="300" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start">Eta com autoEscape: interpolar dado de usuário</text>
  <text x="836" y="316" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start">é seguro por padrão, e "~" vira decisão visível.</text>
  <text x="836" y="332" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="start">45 arquivos .eta. Uma função monta toda página e</text>
  <text x="836" y="348" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="start">injeta sessão, chave de idempotência, ROTAS e</text>
  <text x="836" y="364" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="start">o nome versionado do CSS. POST-Redirect-GET.</text>

  <rect x="1226" y="378" width="4" height="91" rx="2" fill="#7c3aed" />
  <text x="1240" y="390" font-size="11" fill="#7c3aed" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">sem-atalho-entre-modulos</text>
  <text x="1240" y="408" font-size="10" fill="#6b7280" font-weight="400" text-anchor="start">Um módulo só enxerga outro pelo index.ts. Caminho interno é</text>
  <text x="1240" y="423" font-size="10" fill="#6b7280" font-weight="400" text-anchor="start">privado. É o que faz a pergunta "o que mais mexe nisso?" ter</text>
  <text x="1240" y="438" font-size="10" fill="#6b7280" font-weight="400" text-anchor="start">resposta: quando cobranca/ for extraído no E14, a lista de</text>
  <text x="1240" y="453" font-size="10" fill="#6b7280" font-weight="400" text-anchor="start">dependentes é exatamente quem importa o index — sem a regra,</text>
  <text x="1240" y="468" font-size="10" fill="#6b7280" font-weight="400" text-anchor="start">a extração vira reescrita.</text>
  <rect x="1226" y="487" width="4" height="61" rx="2" fill="#16a34a" />

  <text x="1240" y="517" font-size="10" fill="#6b7280" font-weight="400" text-anchor="start">O domínio não sabe que existe banco, HTTP, log, agendador ou</text>
  <text x="1240" y="532" font-size="10" fill="#6b7280" font-weight="400" text-anchor="start">biblioteca de terceiro. Só alcança ports/, resultado.ts e</text>

  <text x="1240" y="578" font-size="11" fill="#475569" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">shared-nao-conhece-dominio</text>
  <text x="1240" y="596" font-size="10" fill="#6b7280" font-weight="400" text-anchor="start">A dependência é sempre de fora para dentro: shared/ não importa</text>
  <text x="1240" y="611" font-size="10" fill="#6b7280" font-weight="400" text-anchor="start">nenhum contexto. Por isso shared/http/sessao.ts declara a forma</text>

  <text x="1226" y="708" font-size="10.5" fill="#111827" font-weight="600" text-anchor="start">Unit of Work</text>
  <text x="1226" y="722" font-size="10" fill="#6b7280" font-weight="400" text-anchor="start">unidadeDeTrabalho() é o único ponto de commit da aplicação. O INSERT</text>
  <text x="1226" y="735" font-size="10" fill="#6b7280" font-weight="400" text-anchor="start">na outbox, quando existir, entra ali e em nenhum outro lugar.</text>
  <text x="1226" y="753" font-size="10.5" fill="#111827" font-weight="600" text-anchor="start">Réplica antes da réplica</text>
  <text x="1226" y="767" font-size="10" fill="#6b7280" font-weight="400" text-anchor="start">leitura() e escrita() já são funções distintas, com um pool só por baixo.</text>
  <text x="1226" y="780" font-size="10" fill="#6b7280" font-weight="400" text-anchor="start">Trocar pela réplica no E08 não toca em nenhum repositório.</text>
  <text x="1226" y="798" font-size="10.5" fill="#111827" font-weight="600" text-anchor="start">A chave vem da aplicação</text>
  <text x="1226" y="812" font-size="10" fill="#6b7280" font-weight="400" text-anchor="start">idGeneratorUuid gera o UUID: pai e filho na mesma transação, sem ida e</text>
  <text x="1226" y="825" font-size="10" fill="#6b7280" font-weight="400" text-anchor="start">volta ao banco para descobrir o id do pai.</text>
  <text x="1226" y="843" font-size="10.5" fill="#111827" font-weight="600" text-anchor="start">O portão</text>
  <text x="1226" y="857" font-size="10" fill="#6b7280" font-weight="400" text-anchor="start">bun run verificar = typecheck → check (depcruise) → magic (literais sem</text>
  <text x="1226" y="870" font-size="10" fill="#6b7280" font-weight="400" text-anchor="start">dono) → test. Nenhum dos quatro é opcional.</text>

</svg></div>
    <p class="sr-only">Keyboard shortcuts: plus and minus zoom, zero resets, T toggles theme, S exports.</p>
  </main>
  <script>
  (() => {
    'use strict';
    const metadata = {"slug": "escolaviva-arquitetura"};
    const stage = document.getElementById('stage');
    const canvas = document.getElementById('canvas');
    const svg = canvas.querySelector('svg');
    const status = document.getElementById('status');
    const scaleSelect = document.getElementById('scale');
    const formatSelect = document.getElementById('format');
    let view = { x:0, y:0, scale:1 };
    let drag = null;
    const clamp = value => Math.max(.2, Math.min(8, value));
    const render = () => {
      canvas.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.scale})`;
      status.textContent = `${Math.round(view.scale * 100)}%`;
    };
    const zoom = (factor, originX=stage.clientWidth/2, originY=stage.clientHeight/2) => {
      const next = clamp(view.scale * factor);
      const ratio = next / view.scale;
      view.x = originX - (originX - view.x) * ratio;
      view.y = originY - (originY - view.y) * ratio;
      view.scale = next; render();
    };
    const reset = () => { view = {x:0,y:0,scale:1}; render(); };
    stage.addEventListener('wheel', event => { event.preventDefault(); const rect=stage.getBoundingClientRect(); zoom(event.deltaY < 0 ? 1.12 : .89, event.clientX-rect.left, event.clientY-rect.top); }, {passive:false});
    stage.addEventListener('pointerdown', event => { drag={id:event.pointerId,x:event.clientX,y:event.clientY,vx:view.x,vy:view.y}; stage.setPointerCapture(event.pointerId); stage.classList.add('dragging'); });
    stage.addEventListener('pointermove', event => { if(!drag||drag.id!==event.pointerId)return; view.x=drag.vx+event.clientX-drag.x; view.y=drag.vy+event.clientY-drag.y; render(); });
    const endDrag = () => { drag=null; stage.classList.remove('dragging'); };
    stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);
    const source = () => new XMLSerializer().serializeToString(svg);
    const saveBlob = (blob, extension) => { const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${(metadata.slug||'fireworks-tech-graph')}.${extension}`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); };
    const copySource = async () => {
      const value=source();
      try { await navigator.clipboard.writeText(value); status.textContent='Copied'; return; } catch {}
      const area=document.createElement('textarea'); area.value=value; area.setAttribute('readonly',''); area.style.position='fixed'; area.style.opacity='0'; document.body.appendChild(area); area.select();
      status.textContent=document.execCommand('copy')?'Copied':'Copy failed'; area.remove();
    };
    const exportDiagram = async () => {
      const format = formatSelect.value.toLowerCase();
      if(format==='svg') { saveBlob(new Blob([source()],{type:'image/svg+xml;charset=utf-8'}),'svg'); return; }
      const scale = Math.max(1,Math.min(4,Number(scaleSelect.value)||2));
      const box = svg.viewBox.baseVal; const width=box.width||svg.clientWidth; const height=box.height||svg.clientHeight;
      const image = new Image(); const url=URL.createObjectURL(new Blob([source()],{type:'image/svg+xml'}));
      await new Promise((resolve,reject)=>{ image.onload=resolve; image.onerror=reject; image.src=url; });
      const raster=document.createElement('canvas'); raster.width=Math.round(width*scale); raster.height=Math.round(height*scale);
      const ctx=raster.getContext('2d'); if(format==='jpeg'){ctx.fillStyle='#ffffff';ctx.fillRect(0,0,raster.width,raster.height);} ctx.drawImage(image,0,0,raster.width,raster.height); URL.revokeObjectURL(url);
      const mime=format==='jpeg'?'image/jpeg':format==='webp'?'image/webp':'image/png';
      const blob=await new Promise(resolve=>raster.toBlob(resolve,mime,.94)); if(blob) saveBlob(blob,format==='jpeg'?'jpg':format);
    };
    document.querySelector('.toolbar').addEventListener('click', async event => {
      const action=event.target.closest('[data-action]')?.dataset.action; if(!action)return;
      if(action==='zoom-in')zoom(1.2); else if(action==='zoom-out')zoom(.83); else if(action==='reset')reset();
      else if(action==='theme')document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';
      else if(action==='download')await exportDiagram();
      else if(action==='copy') await copySource();
    });
    document.addEventListener('keydown', event => {
      if(event.target.matches('select'))return;
      if(event.key==='+'||event.key==='=')zoom(1.2); else if(event.key==='-')zoom(.83); else if(event.key==='0'||event.key.toLowerCase()==='r')reset();
      else if(event.key.toLowerCase()==='t')document.querySelector('[data-action=theme]').click(); else if(event.key.toLowerCase()==='s'){event.preventDefault();exportDiagram();}
    });
    render();
  })();
  </script>
</body>
