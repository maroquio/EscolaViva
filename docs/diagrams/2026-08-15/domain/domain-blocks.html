    /* No `will-change:transform` and no `filter:` — both rasterise the SVG before the zoom.
       `will-change` promotes #canvas to its own compositing layer: Chrome rasterises the layer
       once, at whatever size it had, and the GPU then scales the bitmap instead of re-reading the
       vector. `filter:drop-shadow()` forces the element to become a bitmap before the filter runs,
       and on its own would already be enough to pixelate it. The shadow comes back as
       `box-shadow`, which applies to the element's BOX rather than the painted content and so does
       not force rasterisation. */
    #canvas { width:100%; height:100%; display:grid; place-items:center; transform-origin:0 0; }
    #canvas svg { max-width:calc(100vw - 40px); max-height:calc(100vh - 92px); width:auto; height:auto; box-shadow:0 22px 60px rgba(0,0,0,.28); user-select:none; }
    #status { min-width:76px; color:var(--muted); font-size:12px; text-align:center; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; transition:none!important; } }

  <text x="58" y="627" font-size="8.6" fill="#115e59" font-weight="400" text-anchor="start">normalizeCpf · isValidCpf (check digits)</text>
  <text x="58" y="640" font-size="8.6" fill="#115e59" font-weight="400" text-anchor="start">formatCpf · generateCpf</text>
  <text x="58" y="653" font-size="8.6" fill="#115e59" font-weight="400" text-anchor="start">It lives in shared/ because the rule is the SAME for</text>
  <text x="58" y="666" font-size="8.6" fill="#115e59" font-weight="400" text-anchor="start">identity and academics. Duplicating it would be worse.</text>
  <text x="414" y="596" font-size="10.5" fill="#0f766e" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">shared/result.ts</text>
  <text x="414" y="614" font-size="8.6" fill="#115e59" font-weight="400" text-anchor="start">Result&lt;T&gt; = { ok: true, valor } | { ok: false, erros }</text>
  <text x="414" y="627" font-size="8.6" fill="#115e59" font-weight="400" text-anchor="start">success() · failure() · fieldFailure() · schemaErrors()</text>
  <text x="414" y="640" font-size="8.6" fill="#115e59" font-weight="400" text-anchor="start">An expected failure is a VALUE, not an exception. Used in</text>
  <text x="414" y="653" font-size="8.6" fill="#115e59" font-weight="400" text-anchor="start">18 use cases. The domain does not use it: a predicate</text>
  <text x="414" y="666" font-size="8.6" fill="#115e59" font-weight="400" text-anchor="start">returns a boolean; the application builds the error.</text>
  <text x="770" y="596" font-size="10.5" fill="#0f766e" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">shared/ports/</text>
  <text x="770" y="614" font-size="8.6" fill="#115e59" font-weight="400" text-anchor="start">Clock { now(): Date }</text>
  <text x="770" y="627" font-size="8.6" fill="#115e59" font-weight="400" text-anchor="start">IdGenerator { next(): string }</text>
  <text x="770" y="640" font-size="8.6" fill="#115e59" font-weight="400" text-anchor="start">The domain never reads the real clock nor generates an id.</text>
  <text x="770" y="653" font-size="8.6" fill="#115e59" font-weight="400" text-anchor="start">It is what makes "expired?" and "which term is</text>
  <text x="770" y="666" font-size="8.6" fill="#115e59" font-weight="400" text-anchor="start">today?" testable without waiting for time to pass.</text>
  <rect x="1140" y="546" width="620" height="172" rx="10" ry="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.3" data-graph-role="container" />
  <text x="1154" y="570" font-size="11.5" fill="#92400e" font-weight="600" text-anchor="start">The rule that draws this boundary — config/.dependency-cruiser.js</text>
  <text x="1154" y="590" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">{ name: 'pure-domain', severity: 'error',</text>
  <text x="1154" y="603" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">  from: { path: '^src/[^/]+/domain/' },</text>
  <text x="1154" y="616" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">  to:   { path: ['^src/shared/(?:db|http|log|jobs)/', 'node_modules'] } }</text>
  <text x="1154" y="629" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="1154" y="642" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">The domain may not reach a database, HTTP, log, scheduler or ANY</text>
  <text x="1154" y="655" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">third-party library — zod included. What is left is ports/, result.ts</text>
  <text x="1154" y="668" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">and document/. Not a convention: `bun run check` breaks the build.</text>
  <text x="1154" y="681" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="1154" y="694" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">That is why zod appears in 20 use cases and in zero file under</text>
  <text x="1154" y="707" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">domain/: validating input shape is the edge's job, not the rule's.</text>
  <rect x="40" y="748" width="420" height="370" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container" />
  <text x="54" y="772" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">The style: anaemic record + pure function</text>
  <text x="54" y="792" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">No entity is a class. They are all type X = { ... },</text>
  <text x="54" y="805" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">and behaviour lives in an exported function that takes</text>
  <text x="54" y="818" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">the record:</text>
  <text x="54" y="831" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="54" y="844" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">  canTransfer(enrollment)   and not   enrollment.canTransfer()</text>
  <text x="54" y="857" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">  isNetworkActive(network)    and not   network.isActive()</text>
  <text x="54" y="870" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="54" y="883" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Accepted consequence: there is no encapsulation. Nothing</text>
  <text x="54" y="896" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">stops building an Enrollment with an inconsistent status —</text>
  <text x="54" y="909" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">the guarantee comes from the database CHECK and the predicate</text>
  <text x="54" y="922" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">the use case calls, not from the constructor.</text>
  <text x="54" y="935" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="54" y="948" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">In exchange: every rule is a pure function, testable without</text>
  <text x="54" y="961" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">building an object, without mocks and without a database. The</text>
  <text x="54" y="974" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">17 files under domain/ import NOTHING beyond their own module's</text>
  <text x="54" y="987" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">constants and the shared kernel.</text>
  <text x="54" y="1000" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="54" y="1013" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">It is tactical DDD in a functional style. Calling it an</text>
  <text x="54" y="1026" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">"anaemic model" is only a criticism when the rule leaks into</text>
  <text x="54" y="1039" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">the service — here it does not: it is in domain/, checked.</text>
  <rect x="480" y="748" width="420" height="370" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container" />
  <text x="494" y="772" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">Where failure comes out — three channels, never mixed</text>
  <text x="494" y="792" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">1. PREDICATE (domain/) — returns a boolean.</text>
  <text x="494" y="805" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">   isValidGradeValue(11) → false. It does not throw, does not</text>
  <text x="494" y="818" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">   format a message, does not know what a form field is.</text>
  <text x="494" y="831" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="494" y="844" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">2. Result&lt;T&gt; (application/) — the EXPECTED failure becomes a value.</text>
  <text x="494" y="857" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">   fieldFailure(campo, codigo, mensagem). 18 use cases.</text>
  <text x="494" y="870" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">   A grade out of range, a duplicate enrollment, a term already</text>
  <text x="494" y="883" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">   closed: none of that is an exception, it is a response.</text>
  <text x="494" y="896" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="494" y="909" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">3. throw (web/routes/) — 4 classes in shared/http/errors.ts:</text>
  <text x="494" y="922" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">   Unauthorized (3 uses) · NotFound (12) ·</text>
  <text x="494" y="935" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">   BusinessRuleViolation (3) · Forbidden (0 uses, declared and</text>
  <text x="494" y="948" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">   never thrown).</text>
  <text x="494" y="961" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="494" y="974" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">And two exceptions in the domain itself: toRole() and</text>
  <text x="494" y="987" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">toNetworkStatus(). They only fire if the DATABASE returns</text>
  <text x="494" y="1000" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">a value outside the set — corruption, not a user error.</text>
  <text x="494" y="1013" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">For that case, failing loudly beats carrying on with a</text>
  <text x="494" y="1026" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">role nobody knows how to interpret.</text>
  <rect x="920" y="748" width="420" height="370" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container" />
  <text x="934" y="772" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">What this domain does NOT have</text>
  <text x="934" y="792" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">AGGREGATE ROOT as an object. There is no class holding</text>
  <text x="934" y="805" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">children and refusing an invalid change. The aggregate's</text>
  <text x="934" y="818" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">boundary is the module's index.ts plus the repository: whoever</text>
  <text x="934" y="831" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">is outside only sees what the facade publishes.</text>
  <text x="934" y="844" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="934" y="857" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">DOMAIN EVENTS. Zero. No event is created, published or</text>
  <text x="934" y="870" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">consumed anywhere under src/. unitOfWork was written as the</text>
  <text x="934" y="883" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">only commit point precisely so that the outbox, when it</text>
  <text x="934" y="896" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">exists, goes in there and nowhere else — but it does not</text>
  <text x="934" y="909" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">exist yet.</text>
  <text x="934" y="922" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="934" y="935" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">REPOSITORY IN THE DOMAIN LAYER. There is no repository</text>
  <text x="934" y="948" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">interface under domain/. The repositories live in infra/ and</text>
  <text x="934" y="961" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">take the transaction's `sql` as a parameter. Dependency</text>
  <text x="934" y="974" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">inversion exists only for Clock and IdGenerator.</text>
  <text x="934" y="987" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="934" y="1000" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">SPECIFICATION, POLICY, SAGA. None of those patterns shows</text>
  <text x="934" y="1013" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">up — and nothing in the code pretends they do.</text>
  <rect x="1360" y="748" width="400" height="370" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container" />
  <text x="1374" y="772" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">Contexts: who depends on whom</text>
  <text x="1374" y="792" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">communication ─┐</text>
  <text x="1374" y="805" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">assessment ───┼─▶ academics ─▶ identity</text>
  <text x="1374" y="818" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">             └─▶ identity</text>
  <text x="1374" y="831" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="1374" y="844" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">identity is the leaf: it knows nobody.</text>
  <text x="1374" y="857" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="1374" y="870" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">PUBLISHED LANGUAGE — the crossing is always through index.ts.</text>
  <text x="1374" y="883" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">domain/, application/ and infra/ are private, and depcruise</text>
  <text x="1374" y="896" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">rejects the shortcut.</text>
  <text x="1374" y="909" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="1374" y="922" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">NO ANTI-CORRUPTION LAYER. academics imports ROLE from</text>
  <text x="1374" y="935" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">identity and uses the type as is; assessment consumes</text>
  <text x="1374" y="948" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Enrollment and ClassGroupSubject from academics untranslated.</text>
  <text x="1374" y="961" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">It is a Conformist relationship over published language, not an ACL.</text>
  <text x="1374" y="974" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Cheap now, and it is the bill Stage 14 will pay.</text>
  <text x="1374" y="987" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="1374" y="1000" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">THE INVERSION THE DATABASE IMPOSES: app_user.guardian_id</text>
  <text x="1374" y="1013" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">points from identity to academics — the opposite direction</text>
  <text x="1374" y="1026" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">to the code. See the ER diagram.</text>
  <text x="40" y="1150" font-size="9.5" fill="#111827" font-weight="600" text-anchor="start">Marker colour:</text>
  <circle cx="150" cy="1146" r="4" fill="#2563eb" />
  <text x="160" y="1150" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Entity</text>
  <circle cx="238" cy="1146" r="4" fill="#0d9488" />
  <text x="248" y="1150" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Value object</text>
  <circle cx="368" cy="1146" r="4" fill="#16a34a" />
  <text x="378" y="1150" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Invariant</text>
  <circle cx="468" cy="1146" r="4" fill="#7c3aed" />
  <text x="478" y="1150" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Domain service</text>
  <circle cx="616" cy="1146" r="4" fill="#ea580c" />
  <text x="626" y="1150" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Factory / constructor</text>
  <text x="36" y="1170" font-size="9.5" fill="#9ca3af" font-weight="400" text-anchor="start" font-style="italic">Read from src/*/domain/, src/shared/ and config/.dependency-cruiser.js. State of Stage 01.</text>
</svg></div>
    <p class="sr-only">Keyboard shortcuts: plus and minus zoom, zero resets, T toggles theme, S exports.</p>
  </main>
  <script>
  (() => {
    'use strict';
    const metadata = {"slug": "escolaviva-domain-blocks"};
    const stage = document.getElementById('stage');
    const canvas = document.getElementById('canvas');
    const svg = canvas.querySelector('svg');
    const status = document.getElementById('status');
    const scaleSelect = document.getElementById('scale');
    const formatSelect = document.getElementById('format');
    let view = { x:0, y:0, scale:1 };
    let drag = null;
    const clamp = value => Math.max(.2, Math.min(8, value));
    const render = () => {
      canvas.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.scale})`;
      status.textContent = `${Math.round(view.scale * 100)}%`;
    };
    const zoom = (factor, originX=stage.clientWidth/2, originY=stage.clientHeight/2) => {
      const next = clamp(view.scale * factor);
      const ratio = next / view.scale;
      view.x = originX - (originX - view.x) * ratio;
      view.y = originY - (originY - view.y) * ratio;
      view.scale = next; render();
    };
    const reset = () => { view = {x:0,y:0,scale:1}; render(); };
    stage.addEventListener('wheel', event => { event.preventDefault(); const rect=stage.getBoundingClientRect(); zoom(event.deltaY < 0 ? 1.12 : .89, event.clientX-rect.left, event.clientY-rect.top); }, {passive:false});
    stage.addEventListener('pointerdown', event => { drag={id:event.pointerId,x:event.clientX,y:event.clientY,vx:view.x,vy:view.y}; stage.setPointerCapture(event.pointerId); stage.classList.add('dragging'); });
    stage.addEventListener('pointermove', event => { if(!drag||drag.id!==event.pointerId)return; view.x=drag.vx+event.clientX-drag.x; view.y=drag.vy+event.clientY-drag.y; render(); });
    const endDrag = () => { drag=null; stage.classList.remove('dragging'); };
    stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);
    const source = () => new XMLSerializer().serializeToString(svg);
    const saveBlob = (blob, extension) => { const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${(metadata.slug||'fireworks-tech-graph')}.${extension}`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); };
    const copySource = async () => {
      const value=source();
      try { await navigator.clipboard.writeText(value); status.textContent='Copied'; return; } catch {}
      const area=document.createElement('textarea'); area.value=value; area.setAttribute('readonly',''); area.style.position='fixed'; area.style.opacity='0'; document.body.appendChild(area); area.select();
      status.textContent=document.execCommand('copy')?'Copied':'Copy failed'; area.remove();
    };
    const exportDiagram = async () => {
      const format = formatSelect.value.toLowerCase();
      if(format==='svg') { saveBlob(new Blob([source()],{type:'image/svg+xml;charset=utf-8'}),'svg'); return; }
      const scale = Math.max(1,Math.min(4,Number(scaleSelect.value)||2));
      const box = svg.viewBox.baseVal; const width=box.width||svg.clientWidth; const height=box.height||svg.clientHeight;
      const image = new Image(); const url=URL.createObjectURL(new Blob([source()],{type:'image/svg+xml'}));
      await new Promise((resolve,reject)=>{ image.onload=resolve; image.onerror=reject; image.src=url; });
      const raster=document.createElement('canvas'); raster.width=Math.round(width*scale); raster.height=Math.round(height*scale);
      const ctx=raster.getContext('2d'); if(format==='jpeg'){ctx.fillStyle='#ffffff';ctx.fillRect(0,0,raster.width,raster.height);} ctx.drawImage(image,0,0,raster.width,raster.height); URL.revokeObjectURL(url);
      const mime=format==='jpeg'?'image/jpeg':format==='webp'?'image/webp':'image/png';
      const blob=await new Promise(resolve=>raster.toBlob(resolve,mime,.94)); if(blob) saveBlob(blob,format==='jpeg'?'jpg':format);
    };
    document.querySelector('.toolbar').addEventListener('click', async event => {
      const action=event.target.closest('[data-action]')?.dataset.action; if(!action)return;
      if(action==='zoom-in')zoom(1.2); else if(action==='zoom-out')zoom(.83); else if(action==='reset')reset();
      else if(action==='theme')document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';
      else if(action==='download')await exportDiagram();
      else if(action==='copy') await copySource();
    });
    document.addEventListener('keydown', event => {
      if(event.target.matches('select'))return;
      if(event.key==='+'||event.key==='=')zoom(1.2); else if(event.key==='-')zoom(.83); else if(event.key==='0'||event.key.toLowerCase()==='r')reset();
      else if(event.key.toLowerCase()==='t')document.querySelector('[data-action=theme]').click(); else if(event.key.toLowerCase()==='s'){event.preventDefault();exportDiagram();}
    });
    render();
  })();
  </script>
</body>
</html>
