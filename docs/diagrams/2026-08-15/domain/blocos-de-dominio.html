    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:linear-gradient(135deg,var(--page),#1a1a2e); color:var(--text); font-family:'SF Mono','Fira Code',ui-monospace,monospace; }

    .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 14px; background:color-mix(in srgb,var(--panel) 92%,transparent); border-bottom:1px solid var(--border); z-index:2; }

    button,select { min-height:34px; padding:6px 10px; color:var(--text); background:var(--panel); border:1px solid var(--border); border-radius:8px; font:inherit; cursor:pointer; }
    button:hover,button:focus-visible,select:focus-visible { border-color:var(--accent); outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent); outline-offset:1px; }
    #stage { position:relative; overflow:hidden; touch-action:none; cursor:grab; }
    #stage.dragging { cursor:grabbing; }
    /* Sem `will-change:transform` e sem `filter:` — as duas rasterizam o SVG antes do zoom.
       `will-change` promove #canvas a camada de composicao propria: o Chrome rasteriza a camada
       uma vez, no tamanho em que ela estava, e a GPU passa a escalar o bitmap em vez de reler o
       vetor. `filter:drop-shadow()` obriga o elemento a virar bitmap antes de o filtro rodar, e
       sozinha ja bastaria para pixelar. A sombra volta como `box-shadow`, que se aplica a CAIXA
       do elemento em vez do conteudo pintado e por isso nao força rasterizacao. */
    #canvas { width:100%; height:100%; display:grid; place-items:center; transform-origin:0 0; }
    #canvas svg { max-width:calc(100vw - 40px); max-height:calc(100vh - 92px); width:auto; height:auto; box-shadow:0 22px 60px rgba(0,0,0,.28); user-select:none; }
    #status { min-width:76px; color:var(--muted); font-size:12px; text-align:center; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; transition:none!important; } }

  <text x="1392" y="324" font-size="8.6" fill="#6b7280" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">taxaDeLeitura(destinatarios, leituras)</text>
  <text x="1392" y="337" font-size="8.6" fill="#6b7280" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">comAutor(armazenado, autorNome)  ← monta a visão de leitura</text>
  <rect x="40" y="546" width="1080" height="172" rx="12" ry="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6" data-graph-role="container" />
  <text x="58" y="570" font-size="12" fill="#0d9488" font-weight="600" text-anchor="start">Shared kernel — as três únicas coisas que o domínio tem permissão de alcançar</text>
  <text x="58" y="596" font-size="10.5" fill="#0f766e" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">shared/documento/ — CPF</text>
  <text x="58" y="614" font-size="8.6" fill="#115e59" font-weight="400" text-anchor="start">O único objeto de valor com aritmética própria:</text>
  <text x="58" y="627" font-size="8.6" fill="#115e59" font-weight="400" text-anchor="start">normalizarCpf · cpfValido (dígitos verificadores)</text>
  <text x="58" y="640" font-size="8.6" fill="#115e59" font-weight="400" text-anchor="start">formatarCpf · gerarCpf</text>
  <text x="58" y="653" font-size="8.6" fill="#115e59" font-weight="400" text-anchor="start">Vive em shared/ porque a regra é a MESMA para</text>
  <text x="58" y="666" font-size="8.6" fill="#115e59" font-weight="400" text-anchor="start">identidade e academico. Duplicá-la seria pior.</text>
  <text x="414" y="596" font-size="10.5" fill="#0f766e" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">shared/resultado.ts</text>
  <text x="414" y="614" font-size="8.6" fill="#115e59" font-weight="400" text-anchor="start">Resultado&lt;T&gt; = { ok: true, valor } | { ok: false, erros }</text>
  <text x="414" y="627" font-size="8.6" fill="#115e59" font-weight="400" text-anchor="start">sucesso() · falha() · falhaDeCampo() · errosDeSchema()</text>
  <text x="414" y="640" font-size="8.6" fill="#115e59" font-weight="400" text-anchor="start">A falha esperada é VALOR, não exceção. Usado em</text>
  <text x="414" y="653" font-size="8.6" fill="#115e59" font-weight="400" text-anchor="start">18 casos de uso. O domínio não o usa: predicado</text>
  <text x="414" y="666" font-size="8.6" fill="#115e59" font-weight="400" text-anchor="start">devolve boolean, quem monta o erro é a aplicação.</text>
  <text x="770" y="596" font-size="10.5" fill="#0f766e" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">shared/ports/</text>
  <text x="770" y="614" font-size="8.6" fill="#115e59" font-weight="400" text-anchor="start">Clock { agora(): Date }</text>
  <text x="770" y="627" font-size="8.6" fill="#115e59" font-weight="400" text-anchor="start">IdGenerator { novo(): string }</text>
  <text x="770" y="640" font-size="8.6" fill="#115e59" font-weight="400" text-anchor="start">O domínio nunca lê o relógio real nem gera id.</text>
  <text x="770" y="653" font-size="8.6" fill="#115e59" font-weight="400" text-anchor="start">É o que torna "expirou?" e "de que bimestre é</text>
  <text x="770" y="666" font-size="8.6" fill="#115e59" font-weight="400" text-anchor="start">hoje?" testáveis sem esperar o tempo passar.</text>
  <rect x="1140" y="546" width="620" height="172" rx="10" ry="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.3" data-graph-role="container" />
  <text x="1154" y="570" font-size="11.5" fill="#92400e" font-weight="600" text-anchor="start">A regra que desenha esta fronteira — config/.dependency-cruiser.js</text>
  <text x="1154" y="590" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">{ name: 'dominio-puro', severity: 'error',</text>
  <text x="1154" y="603" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">  from: { path: '^src/[^/]+/dominio/' },</text>
  <text x="1154" y="616" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">  to:   { path: ['^src/shared/(?:db|http|log|jobs)/', 'node_modules'] } }</text>
  <text x="1154" y="629" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="1154" y="642" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">O domínio não pode alcançar banco, HTTP, log, agendador nem NENHUMA</text>
  <text x="1154" y="655" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">biblioteca de terceiro — zod incluído. Sobram ports/, resultado.ts e</text>
  <text x="1154" y="668" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">documento/. Não é convenção: `bun run check` quebra o build.</text>
  <text x="1154" y="681" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="1154" y="694" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">É por isso que zod aparece em 20 casos de uso e em zero arquivo de</text>
  <text x="1154" y="707" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">dominio/: validar forma de entrada é trabalho da borda, não da regra.</text>
  <rect x="40" y="748" width="420" height="370" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container" />
  <text x="54" y="772" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">O estilo: registro anêmico + função pura</text>
  <text x="54" y="792" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Nenhuma entidade é classe. Todas são type X = { ... },</text>
  <text x="54" y="805" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">e o comportamento vive em função exportada que recebe</text>
  <text x="54" y="818" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">o registro:</text>
  <text x="54" y="831" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="54" y="844" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">  podeTransferir(matricula)   e não   matricula.podeTransferir()</text>
  <text x="54" y="857" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">  redeAtiva(rede)             e não   rede.estaAtiva()</text>
  <text x="54" y="870" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="54" y="883" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Consequência assumida: não há encapsulamento. Nada</text>
  <text x="54" y="896" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">impede montar uma Matricula com situacao inconsistente —</text>
  <text x="54" y="909" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">a garantia vem do CHECK no banco e do predicado chamado</text>
  <text x="54" y="922" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">pelo caso de uso, não do construtor.</text>
  <text x="54" y="935" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="54" y="948" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Em troca: toda regra é uma função pura, testável sem</text>
  <text x="54" y="961" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">montar objeto, sem mock e sem banco. Os 17 arquivos de</text>
  <text x="54" y="974" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">dominio/ não importam NADA além de constantes do próprio</text>
  <text x="54" y="987" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">módulo e do shared kernel.</text>
  <text x="54" y="1000" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="54" y="1013" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">É DDD tático em estilo funcional. Chamar de "modelo</text>
  <text x="54" y="1026" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">anêmico" só é crítica quando a regra vaza para o serviço</text>
  <text x="54" y="1039" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">— aqui ela não vaza: está em dominio/, verificada.</text>
  <rect x="480" y="748" width="420" height="370" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container" />
  <text x="494" y="772" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">Onde a falha sai — três canais, sem mistura</text>
  <text x="494" y="792" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">1. PREDICADO (dominio/) — devolve boolean.</text>
  <text x="494" y="805" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">   valorDeNotaValido(11) → false. Não lança, não formata</text>
  <text x="494" y="818" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">   mensagem, não sabe o que é um campo de formulário.</text>
  <text x="494" y="831" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="494" y="844" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">2. Resultado&lt;T&gt; (aplicacao/) — a falha ESPERADA vira valor.</text>
  <text x="494" y="857" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">   falhaDeCampo(campo, codigo, mensagem). 18 casos de uso.</text>
  <text x="494" y="870" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">   Nota fora da faixa, matrícula duplicada, bimestre já</text>
  <text x="494" y="883" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">   fechado: nada disso é exceção, é resposta.</text>
  <text x="494" y="896" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="494" y="909" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">3. throw (web/rotas/) — 4 classes em shared/http/erros.ts:</text>
  <text x="494" y="922" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">   NaoAutorizado (3 usos) · NaoEncontrado (12) ·</text>
  <text x="494" y="935" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">   RegraDeNegocio (3) · Proibido (0 usos, declarada e</text>
  <text x="494" y="948" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">   nunca lançada).</text>
  <text x="494" y="961" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="494" y="974" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">E duas exceções no próprio domínio: paraPapel() e</text>
  <text x="494" y="987" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">paraStatusDeRede(). Elas só disparam se o BANCO devolver</text>
  <text x="494" y="1000" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">um valor fora do conjunto — corrupção, não erro de usuário.</text>
  <text x="494" y="1013" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Para esse caso, travar alto é melhor que seguir com um</text>
  <text x="494" y="1026" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">papel que ninguém sabe interpretar.</text>
  <rect x="920" y="748" width="420" height="370" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container" />
  <text x="934" y="772" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">O que este domínio NÃO tem</text>
  <text x="934" y="792" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">RAIZ DE AGREGADO como objeto. Não existe classe que</text>
  <text x="934" y="805" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">guarde filhos e recuse alteração inválida. A fronteira do</text>
  <text x="934" y="818" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">agregado é o index.ts do módulo mais o repositório: quem</text>
  <text x="934" y="831" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">está fora só enxerga o que a fachada publica.</text>
  <text x="934" y="844" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="934" y="857" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">EVENTOS DE DOMÍNIO. Zero. Nenhum evento é criado,</text>
  <text x="934" y="870" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">publicado ou consumido em todo o src/. A unidadeDeTrabalho</text>
  <text x="934" y="883" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">foi escrita como o único ponto de commit justamente para</text>
  <text x="934" y="896" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">que a outbox, quando existir, entre ali e em nenhum outro</text>
  <text x="934" y="909" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">lugar — mas ela ainda não existe.</text>
  <text x="934" y="922" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="934" y="935" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">REPOSITÓRIO NA CAMADA DE DOMÍNIO. Não há interface de</text>
  <text x="934" y="948" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">repositório em dominio/. Os repositórios vivem em infra/ e</text>
  <text x="934" y="961" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">recebem o `sql` da transação como parâmetro. A inversão de</text>
  <text x="934" y="974" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">dependência existe só para Clock e IdGenerator.</text>
  <text x="934" y="987" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="934" y="1000" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">ESPECIFICAÇÃO, POLÍTICA, SAGA. Nenhum desses padrões</text>
  <text x="934" y="1013" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">aparece — e nada no código finge que aparecem.</text>
  <rect x="1360" y="748" width="400" height="370" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container" />
  <text x="1374" y="772" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">Contextos: quem depende de quem</text>
  <text x="1374" y="792" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">comunicacao ─┐</text>
  <text x="1374" y="805" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">avaliacao ───┼─▶ academico ─▶ identidade</text>
  <text x="1374" y="818" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">             └─▶ identidade</text>
  <text x="1374" y="831" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="1374" y="844" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">identidade é a folha: não conhece ninguém.</text>
  <text x="1374" y="857" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="1374" y="870" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">LINGUAGEM PUBLICADA — a travessia é sempre pelo index.ts.</text>
  <text x="1374" y="883" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">dominio/, aplicacao/ e infra/ são privados, e o depcruise</text>
  <text x="1374" y="896" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">recusa o atalho.</text>
  <text x="1374" y="909" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="1374" y="922" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">SEM CAMADA ANTICORRUPÇÃO. academico importa PAPEL de</text>
  <text x="1374" y="935" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">identidade e usa o tipo como está; avaliacao consome</text>
  <text x="1374" y="948" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Matricula e TurmaDisciplina de academico sem traduzir.</text>
  <text x="1374" y="961" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">É relação Conformista sobre linguagem publicada, não ACL.</text>
  <text x="1374" y="974" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Barato agora, e é a conta que o Estágio 14 vai pagar.</text>
  <text x="1374" y="987" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="1374" y="1000" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">A INVERSÃO QUE O BANCO IMPÕE: usuario.responsavel_id</text>
  <text x="1374" y="1013" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">aponta de identidade para academico — direção contrária à</text>
  <text x="1374" y="1026" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">do código. Ver o diagrama ER.</text>
  <text x="40" y="1150" font-size="9.5" fill="#111827" font-weight="600" text-anchor="start">Cor do marcador:</text>

  <text x="160" y="1150" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Entidade</text>
  <circle cx="238" cy="1146" r="4" fill="#0d9488" />

  <script>
  (() => {
    'use strict';
    const metadata = {"slug": "escolaviva-blocos-de-dominio"};
    const stage = document.getElementById('stage');
    const canvas = document.getElementById('canvas');
    const svg = canvas.querySelector('svg');
    const status = document.getElementById('status');
    const scaleSelect = document.getElementById('scale');
    const formatSelect = document.getElementById('format');
    let view = { x:0, y:0, scale:1 };
    let drag = null;
    const clamp = value => Math.max(.2, Math.min(8, value));
    const render = () => {
      canvas.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.scale})`;
      status.textContent = `${Math.round(view.scale * 100)}%`;
    };
    const zoom = (factor, originX=stage.clientWidth/2, originY=stage.clientHeight/2) => {
      const next = clamp(view.scale * factor);
      const ratio = next / view.scale;
      view.x = originX - (originX - view.x) * ratio;
      view.y = originY - (originY - view.y) * ratio;
      view.scale = next; render();
    };
    const reset = () => { view = {x:0,y:0,scale:1}; render(); };
    stage.addEventListener('wheel', event => { event.preventDefault(); const rect=stage.getBoundingClientRect(); zoom(event.deltaY < 0 ? 1.12 : .89, event.clientX-rect.left, event.clientY-rect.top); }, {passive:false});
    stage.addEventListener('pointerdown', event => { drag={id:event.pointerId,x:event.clientX,y:event.clientY,vx:view.x,vy:view.y}; stage.setPointerCapture(event.pointerId); stage.classList.add('dragging'); });
    stage.addEventListener('pointermove', event => { if(!drag||drag.id!==event.pointerId)return; view.x=drag.vx+event.clientX-drag.x; view.y=drag.vy+event.clientY-drag.y; render(); });
    const endDrag = () => { drag=null; stage.classList.remove('dragging'); };
    stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);
    const source = () => new XMLSerializer().serializeToString(svg);
    const saveBlob = (blob, extension) => { const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${(metadata.slug||'fireworks-tech-graph')}.${extension}`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); };
    const copySource = async () => {
      const value=source();
      try { await navigator.clipboard.writeText(value); status.textContent='Copied'; return; } catch {}
      const area=document.createElement('textarea'); area.value=value; area.setAttribute('readonly',''); area.style.position='fixed'; area.style.opacity='0'; document.body.appendChild(area); area.select();
      status.textContent=document.execCommand('copy')?'Copied':'Copy failed'; area.remove();
    };
    const exportDiagram = async () => {
      const format = formatSelect.value.toLowerCase();
      if(format==='svg') { saveBlob(new Blob([source()],{type:'image/svg+xml;charset=utf-8'}),'svg'); return; }
      const scale = Math.max(1,Math.min(4,Number(scaleSelect.value)||2));
      const box = svg.viewBox.baseVal; const width=box.width||svg.clientWidth; const height=box.height||svg.clientHeight;
      const image = new Image(); const url=URL.createObjectURL(new Blob([source()],{type:'image/svg+xml'}));
      await new Promise((resolve,reject)=>{ image.onload=resolve; image.onerror=reject; image.src=url; });
      const raster=document.createElement('canvas'); raster.width=Math.round(width*scale); raster.height=Math.round(height*scale);
      const ctx=raster.getContext('2d'); if(format==='jpeg'){ctx.fillStyle='#ffffff';ctx.fillRect(0,0,raster.width,raster.height);} ctx.drawImage(image,0,0,raster.width,raster.height); URL.revokeObjectURL(url);
      const mime=format==='jpeg'?'image/jpeg':format==='webp'?'image/webp':'image/png';
      const blob=await new Promise(resolve=>raster.toBlob(resolve,mime,.94)); if(blob) saveBlob(blob,format==='jpeg'?'jpg':format);
    };
    document.querySelector('.toolbar').addEventListener('click', async event => {
      const action=event.target.closest('[data-action]')?.dataset.action; if(!action)return;
      if(action==='zoom-in')zoom(1.2); else if(action==='zoom-out')zoom(.83); else if(action==='reset')reset();
      else if(action==='theme')document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';
      else if(action==='download')await exportDiagram();
      else if(action==='copy') await copySource();
    });
    document.addEventListener('keydown', event => {
      if(event.target.matches('select'))return;
      if(event.key==='+'||event.key==='=')zoom(1.2); else if(event.key==='-')zoom(.83); else if(event.key==='0'||event.key.toLowerCase()==='r')reset();
      else if(event.key.toLowerCase()==='t')document.querySelector('[data-action=theme]').click(); else if(event.key.toLowerCase()==='s'){event.preventDefault();exportDiagram();}
    });
    render();
  })();
  </script>
</body>
</html>
