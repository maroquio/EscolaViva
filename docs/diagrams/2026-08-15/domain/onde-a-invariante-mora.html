    #stage.dragging { cursor:grabbing; }
    /* Sem `will-change:transform` e sem `filter:` — as duas rasterizam o SVG antes do zoom.
       `will-change` promove #canvas a camada de composicao propria: o Chrome rasteriza a camada
       uma vez, no tamanho em que ela estava, e a GPU passa a escalar o bitmap em vez de reler o
       vetor. `filter:drop-shadow()` obriga o elemento a virar bitmap antes de o filtro rodar, e
       sozinha ja bastaria para pixelar. A sombra volta como `box-shadow`, que se aplica a CAIXA
       do elemento em vez do conteudo pintado e por isso nao força rasterizacao. */
    #canvas { width:100%; height:100%; display:grid; place-items:center; transform-origin:0 0; }
    #canvas svg { max-width:calc(100vw - 40px); max-height:calc(100vh - 92px); width:auto; height:auto; box-shadow:0 22px 60px rgba(0,0,0,.28); user-select:none; }
    #status { min-width:76px; color:var(--muted); font-size:12px; text-align:center; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

  <text x="56" y="1035" font-size="11.5" fill="#0f766e" font-weight="600" text-anchor="start">11 invariantes moram nos dois lugares  ·  5 só o banco garante  ·  4 só o domínio sabe  ·  1 é só forma de entrada, e por isso só a borda vê</text>
  <rect x="40" y="1076" width="540" height="250" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container" />
  <text x="54" y="1100" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">Por que escrever a mesma regra duas vezes</text>
  <text x="54" y="1120" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Os dois lados fazem trabalhos diferentes.</text>
  <text x="54" y="1133" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="54" y="1146" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">O predicado do domínio existe para dar MENSAGEM. Ele roda antes,</text>
  <text x="54" y="1159" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">sabe qual campo errou e devolve um Resultado que a tela consegue</text>
  <text x="54" y="1172" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">mostrar ao lado do input. Um CHECK violado devolve 23514 e um texto</text>
  <text x="54" y="1185" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">que ninguém quer ler.</text>
  <text x="54" y="1198" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="54" y="1211" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">O CHECK existe para dar GARANTIA. Ele vale para o seed, para a</text>
  <text x="54" y="1224" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">migração, para o SQL que alguém rodar no psql às duas da manhã e</text>
  <text x="54" y="1237" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">para a versão do código que ainda não subiu. O predicado só vale</text>
  <text x="54" y="1250" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">para quem passou por ele.</text>
  <text x="54" y="1263" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="54" y="1276" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Nenhum substitui o outro. Remover o predicado piora a tela; remover</text>
  <text x="54" y="1289" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">o CHECK apaga a garantia.</text>
  <rect x="600" y="1076" width="540" height="250" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container" />
  <text x="614" y="1100" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">O que SÓ o banco consegue garantir</text>
  <text x="614" y="1120" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">As cinco linhas sem marca na coluna do domínio têm algo em comum:</text>
  <text x="614" y="1133" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">todas são unicidade, e unicidade é a única invariante que não</text>
  <text x="614" y="1146" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">sobrevive à concorrência quando checada em código.</text>
  <text x="614" y="1159" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="614" y="1172" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Entre o SELECT que diz "não existe" e o INSERT que cria, cabe outra</text>
  <text x="614" y="1185" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">transação inteira. Duas matrículas simultâneas para o mesmo aluno</text>
  <text x="614" y="1198" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">passam pelas duas verificações e criam as duas linhas.</text>
  <text x="614" y="1211" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="614" y="1224" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Por isso matricula_ativa_unica_por_ano é índice, e o INSERT usa</text>
  <text x="614" y="1237" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">ON CONFLICT DO NOTHING: o choque não vira 500, vira zero linha.</text>
  <text x="614" y="1250" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="614" y="1263" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">O mesmo vale para o fechamento de bimestre, que reconsulta DENTRO</text>
  <text x="614" y="1276" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">da transação e ainda assim depende do UNIQUE por baixo.</text>
  <rect x="1160" y="1076" width="540" height="250" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container" />
  <text x="1174" y="1100" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">O que SÓ o domínio sabe</text>
  <text x="1174" y="1120" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">dataDentroDoAnoLetivo — o banco guarda a data da chamada e as datas</text>
  <text x="1174" y="1133" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">do ano letivo em tabelas diferentes; comparar as duas é regra, e</text>
  <text x="1174" y="1146" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">regra mora em função pura.</text>
  <text x="1174" y="1159" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="1174" y="1172" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">situacaoFinal — aprovado ou reprovado NUNCA vira coluna (I5). Média,</text>
  <text x="1174" y="1185" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">percentual de frequência e situação são calculados na consulta, a</text>
  <text x="1174" y="1198" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">partir das notas e das presenças. Gravar o resultado criaria uma</text>
  <text x="1174" y="1211" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">segunda verdade que envelhece na primeira retificação de nota.</text>
  <text x="1174" y="1224" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="1174" y="1237" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Título e corpo do comunicado, e o tamanho mínimo da senha: limites</text>
  <text x="1174" y="1250" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">de produto, que mudam por decisão e não por integridade. Migração</text>
  <text x="1174" y="1263" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">para afrouxar um limite de texto é custo sem contrapartida.</text>
  <text x="36" y="1380" font-size="9.5" fill="#9ca3af" font-weight="400" text-anchor="start" font-style="italic">Invariantes lidas de src/*/dominio/ e migrations/0001..0008. Estado do Estágio 01.</text>
</svg></div>
    <p class="sr-only">Keyboard shortcuts: plus and minus zoom, zero resets, T toggles theme, S exports.</p>
  </main>
  <script>
  (() => {
    'use strict';
    const metadata = {"slug": "escolaviva-onde-a-invariante-mora"};
    const stage = document.getElementById('stage');
    const canvas = document.getElementById('canvas');
    const svg = canvas.querySelector('svg');
    const status = document.getElementById('status');
    const scaleSelect = document.getElementById('scale');
    const formatSelect = document.getElementById('format');
    let view = { x:0, y:0, scale:1 };
    let drag = null;
    const clamp = value => Math.max(.2, Math.min(8, value));
    const render = () => {
      canvas.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.scale})`;
      status.textContent = `${Math.round(view.scale * 100)}%`;
    };
    const zoom = (factor, originX=stage.clientWidth/2, originY=stage.clientHeight/2) => {
      const next = clamp(view.scale * factor);
      const ratio = next / view.scale;
      view.x = originX - (originX - view.x) * ratio;
      view.y = originY - (originY - view.y) * ratio;
      view.scale = next; render();
    };
    const reset = () => { view = {x:0,y:0,scale:1}; render(); };
    stage.addEventListener('wheel', event => { event.preventDefault(); const rect=stage.getBoundingClientRect(); zoom(event.deltaY < 0 ? 1.12 : .89, event.clientX-rect.left, event.clientY-rect.top); }, {passive:false});
    stage.addEventListener('pointerdown', event => { drag={id:event.pointerId,x:event.clientX,y:event.clientY,vx:view.x,vy:view.y}; stage.setPointerCapture(event.pointerId); stage.classList.add('dragging'); });
    stage.addEventListener('pointermove', event => { if(!drag||drag.id!==event.pointerId)return; view.x=drag.vx+event.clientX-drag.x; view.y=drag.vy+event.clientY-drag.y; render(); });
    const endDrag = () => { drag=null; stage.classList.remove('dragging'); };
    stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);
    const source = () => new XMLSerializer().serializeToString(svg);
    const saveBlob = (blob, extension) => { const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${(metadata.slug||'fireworks-tech-graph')}.${extension}`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); };
    const copySource = async () => {
      const value=source();
      try { await navigator.clipboard.writeText(value); status.textContent='Copied'; return; } catch {}
      const area=document.createElement('textarea'); area.value=value; area.setAttribute('readonly',''); area.style.position='fixed'; area.style.opacity='0'; document.body.appendChild(area); area.select();
      status.textContent=document.execCommand('copy')?'Copied':'Copy failed'; area.remove();
    };
    const exportDiagram = async () => {
      const format = formatSelect.value.toLowerCase();
      if(format==='svg') { saveBlob(new Blob([source()],{type:'image/svg+xml;charset=utf-8'}),'svg'); return; }
      const scale = Math.max(1,Math.min(4,Number(scaleSelect.value)||2));
      const box = svg.viewBox.baseVal; const width=box.width||svg.clientWidth; const height=box.height||svg.clientHeight;
      const image = new Image(); const url=URL.createObjectURL(new Blob([source()],{type:'image/svg+xml'}));
      await new Promise((resolve,reject)=>{ image.onload=resolve; image.onerror=reject; image.src=url; });
      const raster=document.createElement('canvas'); raster.width=Math.round(width*scale); raster.height=Math.round(height*scale);
      const ctx=raster.getContext('2d'); if(format==='jpeg'){ctx.fillStyle='#ffffff';ctx.fillRect(0,0,raster.width,raster.height);} ctx.drawImage(image,0,0,raster.width,raster.height); URL.revokeObjectURL(url);
      const mime=format==='jpeg'?'image/jpeg':format==='webp'?'image/webp':'image/png';
      const blob=await new Promise(resolve=>raster.toBlob(resolve,mime,.94)); if(blob) saveBlob(blob,format==='jpeg'?'jpg':format);
    };
    document.querySelector('.toolbar').addEventListener('click', async event => {
      const action=event.target.closest('[data-action]')?.dataset.action; if(!action)return;
      if(action==='zoom-in')zoom(1.2); else if(action==='zoom-out')zoom(.83); else if(action==='reset')reset();
      else if(action==='theme')document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';
      else if(action==='download')await exportDiagram();
      else if(action==='copy') await copySource();
    });
    document.addEventListener('keydown', event => {
      if(event.target.matches('select'))return;
      if(event.key==='+'||event.key==='=')zoom(1.2); else if(event.key==='-')zoom(.83); else if(event.key==='0'||event.key.toLowerCase()==='r')reset();
      else if(event.key.toLowerCase()==='t')document.querySelector('[data-action=theme]').click(); else if(event.key.toLowerCase()==='s'){event.preventDefault();exportDiagram();}
    });
    render();
  })();
  </script>
