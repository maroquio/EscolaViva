  </defs>
  <rect x="0" y="0" width="1240" height="740" fill="#ffffff"/>
  <text x="36" y="44" font-size="21" fill="#111827" font-weight="600" text-anchor="start">EscolaViva — Ciclo de vida da matrícula</text>
  <text x="36" y="70" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start">src/academico/dominio/matricula.ts · aplicacao/matricular.ts · aplicacao/transferir.ts · CHECK situacao_valida em migrations/0002</text>
  <circle cx="305" cy="132" r="9" fill="#111827"/>
  <path d="M 305,141 L 305,193" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#p-475569)"/>
  <text x="322" y="152" font-size="9.5" fill="#475569" font-weight="600" text-anchor="start">matricular  ·  transferir (a nova, na turma destino)</text>
  <text x="322" y="165" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">[o índice único parcial recusa a segunda ativa no mesmo ano]</text>
  <rect x="190" y="195" width="230" height="96" rx="12" ry="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="206" y="221" font-size="13.5" fill="#2563eb" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ativa</text>
  <text x="206" y="241" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">a única situação com que nasce</text>
  <text x="206" y="255" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">podeTransferir() devolve true só aqui</text>
  <rect x="620" y="195" width="230" height="96" rx="12" ry="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
  <text x="636" y="221" font-size="13.5" fill="#ea580c" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">transferida</text>
  <text x="636" y="241" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">terminal no Estágio 01</text>
  <text x="636" y="255" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">nenhum caso de uso a lê como origem</text>
  <path d="M 420,243 L 618,243" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#p-475569)"/>
  <text x="432" y="218" font-size="9.5" fill="#475569" font-weight="600" text-anchor="start">transferir [situacao = ativa]</text>
  <text x="432" y="231" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">/ SET situacao = 'transferida'</text>
  <circle cx="960" cy="243" r="13" fill="#ffffff" stroke="#111827" stroke-width="1.8"/>
  <circle cx="960" cy="243" r="7.5" fill="#111827"/>
  <path d="M 850,243 L 945,243" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#p-475569)"/>
  <text x="862" y="272" font-size="9" fill="#475569" font-weight="600" text-anchor="start">sem transição de saída</text>
  <rect x="190" y="340" width="230" height="74" rx="12" ry="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="6,4"/>
  <text x="206" y="366" font-size="13.5" fill="#9ca3af" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">cancelada</text>
  <text x="206" y="386" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">nenhuma transição no código</text>
  <rect x="450" y="340" width="230" height="74" rx="12" ry="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="6,4"/>
  <text x="466" y="366" font-size="13.5" fill="#9ca3af" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">concluida</text>
  <text x="466" y="386" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">nenhuma transição no código</text>
  <text x="700" y="362" font-size="9.5" fill="#9ca3af" font-weight="600" text-anchor="start">Declarados, nunca escritos</text>
  <text x="700" y="375" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Estão em SITUACOES_DE_MATRICULA e no CHECK do banco.</text>
  <text x="700" y="388" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Nenhum caso de uso os grava: só SQL direto chega aqui.</text>
  <rect x="60" y="470" width="360" height="230" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container"/>
  <text x="74" y="494" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">Transferir é uma transição composta</text>
  <text x="74" y="514" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">transferir() abre uma unidadeDeTrabalho e faz duas</text>
  <text x="74" y="527" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">coisas na MESMA transação:</text>
  <text x="74" y="540" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start"></text>
  <text x="74" y="553" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">1. marcarComoTransferida(origem) — o UPDATE traz</text>
  <text x="74" y="566" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">   AND situacao = 'ativa' no WHERE, então duas</text>
  <text x="74" y="579" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">   transferências simultâneas: só a primeira acha</text>
  <text x="74" y="592" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">   a linha.</text>
  <text x="74" y="605" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">2. inserir(nova) na turma destino, nascendo ativa.</text>
  <text x="74" y="618" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start"></text>
  <text x="74" y="631" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Se a segunda falhar, a primeira volta atrás. Não</text>
  <text x="74" y="644" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">existe aluno sem matrícula no meio do caminho.</text>
  <rect x="440" y="470" width="360" height="230" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container"/>
  <text x="454" y="494" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">Quem garante que só há uma ativa</text>
  <text x="454" y="514" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Não é a aplicação — é o índice:</text>
  <text x="454" y="527" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start"></text>
  <text x="454" y="540" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">CREATE UNIQUE INDEX matricula_ativa_unica_por_ano</text>
  <text x="454" y="553" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">  ON matricula (aluno_id, ano_letivo_id)</text>
  <text x="454" y="566" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">  WHERE situacao = 'ativa';</text>
  <text x="454" y="579" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start"></text>
  <text x="454" y="592" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Por ser PARCIAL, ele deixa conviver quantas</text>
  <text x="454" y="605" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">transferidas existirem para o mesmo aluno e ano —</text>
  <text x="454" y="618" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">que é exatamente o histórico — e recusa a segunda</text>
  <text x="454" y="631" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">ativa. O INSERT usa ON CONFLICT DO NOTHING: o</text>
  <text x="454" y="644" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">choque não vira 500, vira zero linha inserida.</text>
  <rect x="820" y="470" width="360" height="230" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container"/>
  <text x="834" y="494" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">O que este diagrama não mostra</text>
  <text x="834" y="514" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">A matrícula não guarda aprovação nem média. O ciclo</text>
  <text x="834" y="527" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">de vida acadêmico do aluno — aprovado, retido —</text>
  <text x="834" y="540" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">não existe como estado gravado: boletim e situação</text>
  <text x="834" y="553" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">são calculados na consulta (I5), nunca em coluna.</text>
  <text x="834" y="566" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start"></text>
  <text x="834" y="579" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Por isso concluida segue sem transição: fechá-la</text>
  <text x="834" y="592" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">exigiria decidir onde mora o resultado do ano, e</text>
  <text x="834" y="605" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">essa decisão é de um estágio posterior.</text>
  <text x="36" y="720" font-size="9.5" fill="#9ca3af" font-weight="400" text-anchor="start" font-style="italic">Lido de src/academico/. Estado do Estágio 01.</text>
</svg>