  <rect x="0" y="0" width="1300" height="820" fill="#ffffff"/>
  <text x="36" y="44" font-size="21" fill="#111827" font-weight="600" text-anchor="start">EscolaViva — Ciclo de vida de uma submissão de formulário</text>
  <text x="36" y="70" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start">src/shared/http/idempotencia.ts · tabela requisicao_idempotente (migrations/0005) · a chave nasce no render e volta no campo oculto _chave</text>
  <circle cx="315" cy="132" r="9" fill="#111827"/>
  <path d="M 315,141 L 315,193" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#p-475569)"/>
  <text x="332" y="146" font-size="9.5" fill="#475569" font-weight="600" text-anchor="start">POST com _chave no formato esperado</text>
  <text x="332" y="159" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">INSERT ... ON CONFLICT (chave) DO NOTHING</text>
  <text x="332" y="172" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">RETURNING chave  →  inseriu uma linha</text>
  <rect x="190" y="195" width="250" height="105" rx="12" ry="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="206" y="221" font-size="13.5" fill="#7c3aed" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">reservada</text>
  <text x="206" y="241" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">resposta_local = '' — ainda vazia</text>
  <text x="206" y="255" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">a escrita está EM CURSO</text>
  <text x="206" y="269" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">a chave já está tomada</text>
  <rect x="650" y="195" width="250" height="105" rx="12" ry="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="666" y="221" font-size="13.5" fill="#16a34a" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">concluída</text>
  <text x="666" y="241" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">resposta_local = o Location da resposta</text>
  <text x="666" y="255" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">resposta_hash gravado</text>
  <text x="666" y="269" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">a linha fica: é o registro</text>
  <path d="M 440,247 L 648,247" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#p-16a34a)"/>
  <text x="452" y="216" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="start">resposta 3xx com Location</text>
  <text x="452" y="229" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">/ UPDATE resposta_local + hash</text>
  <circle cx="1010" cy="247" r="13" fill="#ffffff" stroke="#111827" stroke-width="1.8"/>
  <circle cx="1010" cy="247" r="7.5" fill="#111827"/>
  <path d="M 900,247 L 995,247" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#p-16a34a)"/>
  <rect x="190" y="400" width="250" height="100" rx="12" ry="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
  <text x="206" y="426" font-size="13.5" fill="#ea580c" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">liberada</text>
  <text x="206" y="446" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">DELETE: a linha some</text>
  <text x="206" y="460" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">a mesma chave volta a valer</text>
  <path d="M 315,300 L 315,398" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#p-dc2626)"/>
  <text x="332" y="330" font-size="9.5" fill="#dc2626" font-weight="600" text-anchor="start">exceção no handler,</text>
  <text x="332" y="343" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">ou resposta SEM redirecionamento</text>
  <text x="332" y="356" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">(a validação recusou o formulário)</text>
  <text x="332" y="369" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">/ DELETE FROM requisicao_idempotente</text>
  <circle cx="560" cy="450" r="13" fill="#ffffff" stroke="#111827" stroke-width="1.8"/>
  <circle cx="560" cy="450" r="7.5" fill="#111827"/>
  <path d="M 440,450 L 545,450" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#p-dc2626)"/>
  <text x="452" y="480" font-size="9.5" fill="#dc2626" font-weight="600" text-anchor="start">o usuário corrige e reenvia</text>
  <text x="452" y="493" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">o MESMO formulário, a mesma chave</text>
  <rect x="660" y="385" width="300" height="130" rx="10" ry="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.3" data-graph-role="container"/>
  <text x="674" y="409" font-size="11.5" fill="#92400e" font-weight="600" text-anchor="start">O que a repetição encontra</text>
  <text x="674" y="429" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">reservada → 303 para /painel.</text>
  <text x="674" y="442" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Não há destino gravado ainda: a</text>
  <text x="674" y="455" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">primeira requisição não terminou.</text>
  <text x="674" y="468" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start"></text>
  <text x="674" y="481" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">concluída → 303 para resposta_local:</text>
  <text x="674" y="494" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">o mesmo destino da primeira.</text>
  <rect x="60" y="560" width="380" height="230" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container"/>
  <text x="74" y="584" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">Por que a linha entra ANTES</text>
  <text x="74" y="604" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">O INSERT acontece antes de o handler rodar, e a</text>
  <text x="74" y="617" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">exclusividade é do banco (PRIMARY KEY chave), não</text>
  <text x="74" y="630" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">de um if. Duas requisições idênticas chegando ao</text>
  <text x="74" y="643" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">mesmo tempo: uma insere, a outra recebe conflito.</text>
  <text x="74" y="656" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start"></text>
  <text x="74" y="669" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Se a reserva fosse feita depois, a janela entre</text>
  <text x="74" y="682" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">verificar e escrever seria exatamente o intervalo</text>
  <text x="74" y="695" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">em que o toque duplo no 4G ruim cria a segunda</text>
  <text x="74" y="708" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">matrícula.</text>
  <text x="74" y="721" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start"></text>
  <text x="74" y="734" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">A liberação em caso de falha é o que impede que</text>
  <text x="74" y="747" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">um erro de validação queime a chave do formulário.</text>
  <rect x="460" y="560" width="380" height="230" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container"/>
  <text x="474" y="584" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">Quem nem entra nesta máquina</text>
  <text x="474" y="604" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">GET — o middleware devolve next() na primeira</text>
  <text x="474" y="617" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">linha.</text>
  <text x="474" y="630" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start"></text>
  <text x="474" y="643" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">POST anônimo — a tabela exige usuario_id, e a</text>
  <text x="474" y="656" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">única escrita sem sessão é o próprio login.</text>
  <text x="474" y="669" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Repetir um login apenas cria outra sessão, e não</text>
  <text x="474" y="682" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">há registro a proteger.</text>
  <text x="474" y="695" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start"></text>
  <text x="474" y="708" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">POST sem _chave, ou com chave fora do formato —</text>
  <text x="474" y="721" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">responde 400 e registra um warn. Não é</text>
  <text x="474" y="734" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">tolerado em silêncio: formulário sem chave é bug.</text>
  <text x="474" y="747" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start"></text>
  <text x="474" y="760" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">/logout — fica fora do grupo de escrita.</text>
  <rect x="860" y="560" width="380" height="230" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container"/>
  <text x="874" y="584" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">A garantia não é do HTML</text>
  <text x="874" y="604" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Nada aqui depende de o cliente ser um formulário</text>
  <text x="874" y="617" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">renderizado pelo próprio sistema. O contrato é:</text>
  <text x="874" y="630" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">traga uma chave única por intenção.</text>
  <text x="874" y="643" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start"></text>
  <text x="874" y="656" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Um webhook que envie a mesma chave recebe o mesmo</text>
  <text x="874" y="669" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">tratamento, sem uma linha de mudança — e é por</text>
  <text x="874" y="682" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">isso que a tabela é de plataforma, sem rede_id.</text>
  <text x="874" y="695" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start"></text>
  <text x="874" y="708" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">O hash da resposta é guardado junto do destino:</text>
  <text x="874" y="721" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">ele não é usado para decidir nada hoje, e existe</text>
  <text x="874" y="734" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">para que uma repetição possa, adiante, ser</text>
  <text x="874" y="747" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">comparada em vez de apenas redirecionada.</text>
  <text x="36" y="800" font-size="9.5" fill="#9ca3af" font-weight="400" text-anchor="start" font-style="italic">Lido de src/shared/http/idempotencia.ts. Estado do Estágio 01.</text>
</svg>