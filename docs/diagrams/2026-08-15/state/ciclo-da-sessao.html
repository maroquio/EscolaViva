<!doctype html>

  <title>EscolaViva — Ciclo da sessão</title>
  <style>
    :root { color-scheme: dark; --page:#0f0f1a; --panel:#0f172a; --border:#334155; --text:#e2e8f0; --muted:#94a3b8; --accent:#a855f7; }
    html[data-theme="light"] { color-scheme:light; --page:#f8fafc; --panel:#fff; --border:#cbd5e1; --text:#0f172a; --muted:#475569; --accent:#7c3aed; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:linear-gradient(135deg,var(--page),#1a1a2e); color:var(--text); font-family:'SF Mono','Fira Code',ui-monospace,monospace; }
    body { display:grid; grid-template-rows:auto 1fr; }
    .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 14px; background:color-mix(in srgb,var(--panel) 92%,transparent); border-bottom:1px solid var(--border); z-index:2; }
    .title { margin-right:auto; font-size:13px; font-weight:700; }
    button,select { min-height:34px; padding:6px 10px; color:var(--text); background:var(--panel); border:1px solid var(--border); border-radius:8px; font:inherit; cursor:pointer; }
    button:hover,button:focus-visible,select:focus-visible { border-color:var(--accent); outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent); outline-offset:1px; }
    #stage { position:relative; overflow:hidden; touch-action:none; cursor:grab; }
    #stage.dragging { cursor:grabbing; }
    /* Sem `will-change:transform` e sem `filter:` — as duas rasterizam o SVG antes do zoom.
       `will-change` promove #canvas a camada de composicao propria: o Chrome rasteriza a camada
       uma vez, no tamanho em que ela estava, e a GPU passa a escalar o bitmap em vez de reler o
       vetor. `filter:drop-shadow()` obriga o elemento a virar bitmap antes de o filtro rodar, e
       sozinha ja bastaria para pixelar. A sombra volta como `box-shadow`, que se aplica a CAIXA
       do elemento em vez do conteudo pintado e por isso nao força rasterizacao. */
    #canvas { width:100%; height:100%; display:grid; place-items:center; transform-origin:0 0; }
    #canvas svg { max-width:calc(100vw - 40px); max-height:calc(100vh - 92px); width:auto; height:auto; box-shadow:0 22px 60px rgba(0,0,0,.28); user-select:none; }
    #status { min-width:76px; color:var(--muted); font-size:12px; text-align:center; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; transition:none!important; } }
  </style>
</head>
<body>

  <rect x="0" y="0" width="1240" height="800" fill="#ffffff" />
  <text x="36" y="44" font-size="21" fill="#111827" font-weight="600" text-anchor="start">EscolaViva — Ciclo de vida da sessão</text>
  <text x="36" y="70" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start">src/identidade/dominio/sessao.ts · aplicacao/autenticar.ts · aplicacao/consultas.ts · aplicacao/expurgarSessoes.ts · ADR 0001</text>
  <circle cx="235" cy="132" r="9" fill="#111827" />
  <path d="M 235,141 L 235,193" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#p-475569)" />
  <text x="252" y="152" font-size="9.5" fill="#475569" font-weight="600" text-anchor="start">autenticar / INSERT sessao</text>
  <text x="252" y="165" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">expira_em = agora + duração configurada</text>
  <rect x="120" y="195" width="250" height="100" rx="12" ry="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" />
  <text x="136" y="221" font-size="13.5" fill="#2563eb" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">válida</text>
  <text x="136" y="241" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">a linha existe e expira_em &gt; now()</text>
  <text x="136" y="255" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">o cookie assinado aponta para ela</text>
  <rect x="600" y="195" width="250" height="100" rx="12" ry="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8" />
  <text x="616" y="221" font-size="13.5" fill="#ea580c" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">vencida</text>
  <text x="616" y="241" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">a linha CONTINUA no banco</text>
  <text x="616" y="255" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">nenhuma escrita marcou o vencimento</text>
  <path d="M 370,245 L 598,245" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#p-475569)" />
  <text x="384" y="214" font-size="9.5" fill="#475569" font-weight="600" text-anchor="start">expira_em &lt; now()</text>
  <text x="384" y="227" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">— só o tempo passa, ninguém escreve</text>
  <circle cx="1010" cy="245" r="13" fill="#ffffff" stroke="#111827" stroke-width="1.8" />
  <circle cx="1010" cy="245" r="7.5" fill="#111827" />
  <path d="M 850,245 L 995,245" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#p-475569)" />
  <text x="864" y="214" font-size="9.5" fill="#475569" font-weight="600" text-anchor="start">job expurgoDeSessoes</text>
  <text x="864" y="227" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">/ DELETE WHERE expira_em &lt; now()</text>
  <path d="M 245,295 L 245,390 L 1010,390 L 1010,260" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#p-475569)" />
  <text x="262" y="383" font-size="9.5" fill="#475569" font-weight="600" text-anchor="start">logout / DELETE FROM sessao WHERE id = ?  —  sair duas vezes é o mesmo estado, e por isso /logout fica fora da idempotência</text>
  <rect x="60" y="440" width="360" height="300" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container" />
  <text x="74" y="464" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">O portão que roda a cada requisição</text>
  <text x="74" y="484" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">sessaoValida() não olha só o vencimento. Ela</text>
  <text x="74" y="497" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">recusa por três motivos independentes:</text>
  <text x="74" y="510" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="74" y="523" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">1. sessaoExpirou(sessao, agora)</text>
  <text x="74" y="536" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">2. !redeAtiva(rede) — suspensa ou cancelada</text>
  <text x="74" y="549" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">3. !usuario.ativo</text>
  <text x="74" y="562" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="74" y="575" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Só o primeiro é estado da própria sessão. Os</text>
  <text x="74" y="588" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">outros dois são estado de OUTRA entidade, lidos</text>
  <text x="74" y="601" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">no mesmo SELECT que trouxe a sessão.</text>
  <text x="74" y="614" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="74" y="627" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Consequência: "válida" no banco não quer dizer</text>
  <text x="74" y="640" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">"aceita" na requisição. E como nada é escrito na</text>
  <text x="74" y="653" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">linha, reativar a rede faz as sessões voltarem a</text>
  <text x="74" y="666" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">valer sozinhas.</text>
  <rect x="440" y="440" width="360" height="300" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container" />
  <text x="454" y="464" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">Dois portões que ninguém abre nem fecha</text>
  <text x="454" y="484" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">rede.status aceita ativa | suspensa | cancelada.</text>
  <text x="454" y="497" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">usuario.ativo é boolean.</text>
  <text x="454" y="510" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="454" y="523" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Os dois são LIDOS para derrubar sessão. Nenhum é</text>
  <text x="454" y="536" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">ESCRITO por caso de uso do Estágio 01 — não há</text>
  <text x="454" y="549" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">UPDATE em rede.status nem em usuario.ativo em</text>
  <text x="454" y="562" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">lugar nenhum de src/.</text>
  <text x="454" y="575" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="454" y="588" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Quem os define é o seed, ou SQL direto. Suspender</text>
  <text x="454" y="601" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">uma rede inadimplente é funcionalidade de estágio</text>
  <text x="454" y="614" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">posterior; o gancho de leitura já está no lugar,</text>
  <text x="454" y="627" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">esperando quem escreva.</text>
  <rect x="820" y="440" width="360" height="300" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container" />
  <text x="834" y="464" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">Por que a sessão vive em tabela</text>
  <text x="834" y="484" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">ADR 0001. O processo não guarda estado próprio:</text>
  <text x="834" y="497" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">reiniciar o servidor não desloga ninguém, e seis</text>
  <text x="834" y="510" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">instâncias no Estágio 08 enxergam a mesma sessão</text>
  <text x="834" y="523" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">sem sticky session nem memória compartilhada.</text>
  <text x="834" y="536" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="834" y="549" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">O preço é um SELECT por requisição — pago em</text>
  <text x="834" y="562" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">leitura(), não em escrita().</text>
  <text x="834" y="575" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="834" y="588" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">O expurgo é um job com lock por chave: com uma</text>
  <text x="834" y="601" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">instância o lock é redundante; com seis, é o que</text>
  <text x="834" y="614" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">evita seis varreduras simultâneas na mesma tabela.</text>
  <text x="834" y="627" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">IX (expira_em) é o índice que essa varredura usa.</text>
  <text x="36" y="780" font-size="9.5" fill="#9ca3af" font-weight="400" text-anchor="start" font-style="italic">Lido de src/identidade/ e src/shared/jobs/. Estado do Estágio 01.</text>
</svg></div>
    <p class="sr-only">Keyboard shortcuts: plus and minus zoom, zero resets, T toggles theme, S exports.</p>
  </main>
  <script>
  (() => {
    'use strict';
    const metadata = {"slug": "escolaviva-ciclo-da-sessao"};
    const stage = document.getElementById('stage');
    const canvas = document.getElementById('canvas');
    const svg = canvas.querySelector('svg');
    const status = document.getElementById('status');
    const scaleSelect = document.getElementById('scale');
    const formatSelect = document.getElementById('format');
    let view = { x:0, y:0, scale:1 };
    let drag = null;
    const clamp = value => Math.max(.2, Math.min(8, value));
    const render = () => {
      canvas.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.scale})`;
      status.textContent = `${Math.round(view.scale * 100)}%`;
    };
    const zoom = (factor, originX=stage.clientWidth/2, originY=stage.clientHeight/2) => {
      const next = clamp(view.scale * factor);
      const ratio = next / view.scale;
      view.x = originX - (originX - view.x) * ratio;
      view.y = originY - (originY - view.y) * ratio;
      view.scale = next; render();
    };
    const reset = () => { view = {x:0,y:0,scale:1}; render(); };
    stage.addEventListener('wheel', event => { event.preventDefault(); const rect=stage.getBoundingClientRect(); zoom(event.deltaY < 0 ? 1.12 : .89, event.clientX-rect.left, event.clientY-rect.top); }, {passive:false});
    stage.addEventListener('pointerdown', event => { drag={id:event.pointerId,x:event.clientX,y:event.clientY,vx:view.x,vy:view.y}; stage.setPointerCapture(event.pointerId); stage.classList.add('dragging'); });
    stage.addEventListener('pointermove', event => { if(!drag||drag.id!==event.pointerId)return; view.x=drag.vx+event.clientX-drag.x; view.y=drag.vy+event.clientY-drag.y; render(); });
    const endDrag = () => { drag=null; stage.classList.remove('dragging'); };
    stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);
    const source = () => new XMLSerializer().serializeToString(svg);
    const saveBlob = (blob, extension) => { const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${(metadata.slug||'fireworks-tech-graph')}.${extension}`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); };
    const copySource = async () => {
      const value=source();
      try { await navigator.clipboard.writeText(value); status.textContent='Copied'; return; } catch {}
      const area=document.createElement('textarea'); area.value=value; area.setAttribute('readonly',''); area.style.position='fixed'; area.style.opacity='0'; document.body.appendChild(area); area.select();
      status.textContent=document.execCommand('copy')?'Copied':'Copy failed'; area.remove();
    };
    const exportDiagram = async () => {
      const format = formatSelect.value.toLowerCase();
      if(format==='svg') { saveBlob(new Blob([source()],{type:'image/svg+xml;charset=utf-8'}),'svg'); return; }
      const scale = Math.max(1,Math.min(4,Number(scaleSelect.value)||2));
      const box = svg.viewBox.baseVal; const width=box.width||svg.clientWidth; const height=box.height||svg.clientHeight;
      const image = new Image(); const url=URL.createObjectURL(new Blob([source()],{type:'image/svg+xml'}));
      await new Promise((resolve,reject)=>{ image.onload=resolve; image.onerror=reject; image.src=url; });
      const raster=document.createElement('canvas'); raster.width=Math.round(width*scale); raster.height=Math.round(height*scale);
      const ctx=raster.getContext('2d'); if(format==='jpeg'){ctx.fillStyle='#ffffff';ctx.fillRect(0,0,raster.width,raster.height);} ctx.drawImage(image,0,0,raster.width,raster.height); URL.revokeObjectURL(url);
      const mime=format==='jpeg'?'image/jpeg':format==='webp'?'image/webp':'image/png';
      const blob=await new Promise(resolve=>raster.toBlob(resolve,mime,.94)); if(blob) saveBlob(blob,format==='jpeg'?'jpg':format);
    };
    document.querySelector('.toolbar').addEventListener('click', async event => {
      const action=event.target.closest('[data-action]')?.dataset.action; if(!action)return;
      if(action==='zoom-in')zoom(1.2); else if(action==='zoom-out')zoom(.83); else if(action==='reset')reset();
      else if(action==='theme')document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';
      else if(action==='download')await exportDiagram();
      else if(action==='copy') await copySource();
    });
    document.addEventListener('keydown', event => {
      if(event.target.matches('select'))return;
      if(event.key==='+'||event.key==='=')zoom(1.2); else if(event.key==='-')zoom(.83); else if(event.key==='0'||event.key.toLowerCase()==='r')reset();
      else if(event.key.toLowerCase()==='t')document.querySelector('[data-action=theme]').click(); else if(event.key.toLowerCase()==='s'){event.preventDefault();exportDiagram();}
    });
    render();
  })();
  </script>
</body>
