  <style>
    :root { color-scheme: dark; --page:#0f0f1a; --panel:#0f172a; --border:#334155; --text:#e2e8f0; --muted:#94a3b8; --accent:#a855f7; }
    html[data-theme="light"] { color-scheme:light; --page:#f8fafc; --panel:#fff; --border:#cbd5e1; --text:#0f172a; --muted:#475569; --accent:#7c3aed; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:linear-gradient(135deg,var(--page),#1a1a2e); color:var(--text); font-family:'SF Mono','Fira Code',ui-monospace,monospace; }
    body { display:grid; grid-template-rows:auto 1fr; }
    .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 14px; background:color-mix(in srgb,var(--panel) 92%,transparent); border-bottom:1px solid var(--border); z-index:2; }
    .title { margin-right:auto; font-size:13px; font-weight:700; }
    button,select { min-height:34px; padding:6px 10px; color:var(--text); background:var(--panel); border:1px solid var(--border); border-radius:8px; font:inherit; cursor:pointer; }
    button:hover,button:focus-visible,select:focus-visible { border-color:var(--accent); outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent); outline-offset:1px; }
    #stage { position:relative; overflow:hidden; touch-action:none; cursor:grab; }
    #stage.dragging { cursor:grabbing; }
    /* Sem `will-change:transform` e sem `filter:` — as duas rasterizam o SVG antes do zoom.
       `will-change` promove #canvas a camada de composicao propria: o Chrome rasteriza a camada
       uma vez, no tamanho em que ela estava, e a GPU passa a escalar o bitmap em vez de reler o
       vetor. `filter:drop-shadow()` obriga o elemento a virar bitmap antes de o filtro rodar, e
       sozinha ja bastaria para pixelar. A sombra volta como `box-shadow`, que se aplica a CAIXA
       do elemento em vez do conteudo pintado e por isso nao força rasterizacao. */
    #canvas { width:100%; height:100%; display:grid; place-items:center; transform-origin:0 0; }
    #canvas svg { max-width:calc(100vw - 40px); max-height:calc(100vh - 92px); width:auto; height:auto; box-shadow:0 22px 60px rgba(0,0,0,.28); user-select:none; }
    #status { min-width:76px; color:var(--muted); font-size:12px; text-align:center; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; transition:none!important; } }
  </style>

  <text x="74" y="360" font-size="11.5" fill="#0d9488" font-weight="600" text-anchor="start">network_id did not become an arrow</text>
  <text x="74" y="380" font-size="9" fill="#0f766e" font-weight="400" text-anchor="start">16 of the 18 tables carry</text>
  <text x="74" y="393" font-size="9" fill="#0f766e" font-weight="400" text-anchor="start">network_id REFERENCES network(id).</text>
  <text x="74" y="406" font-size="9" fill="#0f766e" font-weight="400" text-anchor="start">Drawing 16 lines to the same target</text>
  <text x="74" y="419" font-size="9" fill="#0f766e" font-weight="400" text-anchor="start">would hide the rest of the graph,</text>
  <text x="74" y="432" font-size="9" fill="#0f766e" font-weight="400" text-anchor="start">so they became the label</text>
  <text x="74" y="445" font-size="9" fill="#0f766e" font-weight="400" text-anchor="start">FK · tenant on the column.</text>
  <text x="74" y="458" font-size="9" fill="#0f766e" font-weight="400" text-anchor="start" />
  <text x="74" y="471" font-size="9" fill="#0f766e" font-weight="400" text-anchor="start">The two exceptions:</text>
  <text x="74" y="484" font-size="9" fill="#0f766e" font-weight="400" text-anchor="start">· network — it is the tenant, it does</text>
  <text x="74" y="497" font-size="9" fill="#0f766e" font-weight="400" text-anchor="start">  not belong to one.</text>
  <text x="74" y="510" font-size="9" fill="#0f766e" font-weight="400" text-anchor="start">· idempotent_request — the comment</text>
  <text x="74" y="523" font-size="9" fill="#0f766e" font-weight="400" text-anchor="start">  in the migration says why:</text>
  <text x="74" y="536" font-size="9" fill="#0f766e" font-weight="400" text-anchor="start">  "it does not belong to a network".</text>
  <rect x="60" y="570" width="260" height="190" rx="10" ry="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5" data-graph-role="container" />
  <text x="74" y="594" font-size="11.5" fill="#0f766e" font-weight="600" text-anchor="start">The arrow that no longer contradicts</text>
  <text x="74" y="614" font-size="9" fill="#115e59" font-weight="400" text-anchor="start">app_user.guardian_id → guardian</text>
  <text x="74" y="627" font-size="9" fill="#115e59" font-weight="400" text-anchor="start">linked identity to academics, while</text>
  <text x="74" y="640" font-size="9" fill="#115e59" font-weight="400" text-anchor="start">the code pointed the other way.</text>
  <text x="74" y="653" font-size="9" fill="#115e59" font-weight="400" text-anchor="start" />
  <text x="74" y="666" font-size="9" fill="#115e59" font-weight="400" text-anchor="start">It is gone. The guardian became an</text>
  <text x="74" y="679" font-size="9" fill="#115e59" font-weight="400" text-anchor="start">app_user, and student_guardian.user_id</text>
  <text x="74" y="692" font-size="9" fill="#115e59" font-weight="400" text-anchor="start">points from academics to identity —</text>
  <text x="74" y="705" font-size="9" fill="#115e59" font-weight="400" text-anchor="start">the same direction as the teacher's.</text>
  <text x="74" y="718" font-size="9" fill="#115e59" font-weight="400" text-anchor="start" />
  <text x="74" y="731" font-size="9" fill="#115e59" font-weight="400" text-anchor="start">identity is a leaf in the database too:</text>
  <text x="74" y="744" font-size="9" fill="#115e59" font-weight="400" text-anchor="start">no foreign key leaves it any more.</text>

  <text x="182" y="869" font-size="8.5" fill="#6b7280" font-weight="400" text-anchor="start">many → zero or one</text>
  <text x="80" y="884" font-size="8" fill="#9ca3af" font-weight="400" text-anchor="start">The crow's foot touches the child table,</text>
  <text x="80" y="896" font-size="8" fill="#9ca3af" font-weight="400" text-anchor="start">the one that holds the foreign key.</text>
  <text x="74" y="920" font-size="9.5" fill="#111827" font-weight="600" text-anchor="start">Colour = module that owns the table</text>
  <rect x="80" y="930" width="12" height="11" rx="3" ry="3" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.3" />
  <text x="100" y="938" font-size="8.5" fill="#6b7280" font-weight="400" text-anchor="start">identity</text>
  <rect x="80" y="948" width="12" height="11" rx="3" ry="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3" />
  <text x="100" y="956" font-size="8.5" fill="#6b7280" font-weight="400" text-anchor="start">academics</text>
  <rect x="80" y="966" width="12" height="11" rx="3" ry="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3" />
  <text x="100" y="974" font-size="8.5" fill="#6b7280" font-weight="400" text-anchor="start">assessment</text>
  <rect x="80" y="984" width="12" height="11" rx="3" ry="3" fill="#fff7ed" stroke="#ea580c" stroke-width="1.3" />
  <text x="100" y="992" font-size="8.5" fill="#6b7280" font-weight="400" text-anchor="start">communication</text>
  <rect x="80" y="1002" width="12" height="11" rx="3" ry="3" fill="#f8fafc" stroke="#475569" stroke-width="1.3" />
  <text x="100" y="1010" font-size="8.5" fill="#6b7280" font-weight="400" text-anchor="start">platform</text>
  <text x="80" y="1040" font-size="8" fill="#9ca3af" font-weight="400" text-anchor="start">The line inherits the CHILD table's colour:</text>
  <text x="80" y="1052" font-size="8" fill="#9ca3af" font-weight="400" text-anchor="start">an arrow coloured unlike the target box</text>
  <text x="80" y="1064" font-size="8" fill="#9ca3af" font-weight="400" text-anchor="start">is a key that crosses modules.</text>
  <rect x="60" y="1096" width="260" height="118" rx="10" ry="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" data-graph-role="container" />
  <text x="74" y="1118" font-size="10.5" fill="#475569" font-weight="600" text-anchor="start">What was omitted from every box</text>
  <text x="74" y="1136" font-size="8.5" fill="#6b7280" font-weight="400" text-anchor="start">created_at and updated_at, both</text>
  <text x="74" y="1149" font-size="8.5" fill="#6b7280" font-weight="400" text-anchor="start">timestamptz NOT NULL DEFAULT now().</text>
  <text x="74" y="1162" font-size="8.5" fill="#6b7280" font-weight="400" text-anchor="start">updated_at is kept by the trigger</text>
  <text x="74" y="1175" font-size="8.5" fill="#6b7280" font-weight="400" text-anchor="start">set_updated_at(), created in 0001.</text>
  <text x="74" y="1188" font-size="8.5" fill="#6b7280" font-weight="400" text-anchor="start">session and idempotent_request have only</text>
  <text x="74" y="1201" font-size="8.5" fill="#6b7280" font-weight="400" text-anchor="start">created_at — they are never UPDATEd.</text>
  <text x="36" y="1390" font-size="10" fill="#9ca3af" font-weight="400" text-anchor="start" font-style="italic">Source: migrations/0001_initial_schema.sql. The diagram shows the schema exactly as the consolidated baseline creates it — every column, key and constraint read from that file.</text>
  <rect x="380" y="1155" width="680" height="215" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.2" data-graph-role="container" />
  <text x="394" y="1179" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">Three guarantees that live half in this file and half in the code</text>
  <text x="394" y="1201" font-size="9" fill="#475569" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">idempotent_request</text>
  <text x="394" y="1219" font-size="8.5" fill="#6b7280" font-weight="400" text-anchor="start">claimPendingWriteInTransaction() runs this INSERT as the FIRST</text>
  <text x="394" y="1232" font-size="8.5" fill="#6b7280" font-weight="400" text-anchor="start">statement of unitOfWork(): the claim and the rows it protects</text>
  <text x="394" y="1245" font-size="8.5" fill="#6b7280" font-weight="400" text-anchor="start">commit together, and a ROLLBACK takes both. There is no</text>
  <text x="394" y="1258" font-size="8.5" fill="#6b7280" font-weight="400" text-anchor="start">compensating DELETE anywhere in the code — the row you see</text>
  <text x="394" y="1271" font-size="8.5" fill="#6b7280" font-weight="400" text-anchor="start">here is a write that actually happened.</text>
  <text x="730" y="1201" font-size="9" fill="#475569" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">enrollment</text>
  <text x="730" y="1219" font-size="8.5" fill="#6b7280" font-weight="400" text-anchor="start">Both partial indexes carry WHERE status = 'active'. One refuses</text>
  <text x="730" y="1232" font-size="8.5" fill="#6b7280" font-weight="400" text-anchor="start">a second active row per student and year; the other serves every</text>
  <text x="730" y="1245" font-size="8.5" fill="#6b7280" font-weight="400" text-anchor="start">read that starts from a class group's active students.</text>
  <text x="730" y="1258" font-size="8.5" fill="#6b7280" font-weight="400" text-anchor="start">The literal has to stay a literal: parameterised, the planner</text>
  <text x="730" y="1271" font-size="8.5" fill="#6b7280" font-weight="400" text-anchor="start">stops choosing them and the lookup turns into a scan.</text>
  <text x="394" y="1305" font-size="8.5" fill="#9ca3af" font-weight="400" text-anchor="start">One guarantee is not in this file at all: the order between closing a term and posting into it is an advisory lock on</text>
  <text x="394" y="1318" font-size="8.5" fill="#9ca3af" font-weight="400" text-anchor="start">(class_group_id, term), taken by closeTerm() and postGrades() inside their own transactions. UQ (class_group_id, term)</text>
  <text x="394" y="1331" font-size="8.5" fill="#9ca3af" font-weight="400" text-anchor="start">is what remains if that lock is ever removed.</text>
</svg></div>
    <p class="sr-only">Keyboard shortcuts: plus and minus zoom, zero resets, T toggles theme, S exports.</p>
  </main>
  <script>
  (() => {
    'use strict';
    const metadata = {"slug": "data-model"};
    const stage = document.getElementById('stage');
    const canvas = document.getElementById('canvas');
    const svg = canvas.querySelector('svg');
    const status = document.getElementById('status');
    const scaleSelect = document.getElementById('scale');
    const formatSelect = document.getElementById('format');
    let view = { x:0, y:0, scale:1 };
    let drag = null;
    const clamp = value => Math.max(.2, Math.min(8, value));
    const render = () => {
      canvas.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.scale})`;
      status.textContent = `${Math.round(view.scale * 100)}%`;
    };
    const zoom = (factor, originX=stage.clientWidth/2, originY=stage.clientHeight/2) => {
      const next = clamp(view.scale * factor);
      const ratio = next / view.scale;
      view.x = originX - (originX - view.x) * ratio;
      view.y = originY - (originY - view.y) * ratio;
      view.scale = next; render();
    };
    const reset = () => { view = {x:0,y:0,scale:1}; render(); };
    stage.addEventListener('wheel', event => { event.preventDefault(); const rect=stage.getBoundingClientRect(); zoom(event.deltaY < 0 ? 1.12 : .89, event.clientX-rect.left, event.clientY-rect.top); }, {passive:false});
    stage.addEventListener('pointerdown', event => { drag={id:event.pointerId,x:event.clientX,y:event.clientY,vx:view.x,vy:view.y}; stage.setPointerCapture(event.pointerId); stage.classList.add('dragging'); });
    stage.addEventListener('pointermove', event => { if(!drag||drag.id!==event.pointerId)return; view.x=drag.vx+event.clientX-drag.x; view.y=drag.vy+event.clientY-drag.y; render(); });
    const endDrag = () => { drag=null; stage.classList.remove('dragging'); };
    stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);
    const source = () => new XMLSerializer().serializeToString(svg);
    const saveBlob = (blob, extension) => { const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${(metadata.slug||'fireworks-tech-graph')}.${extension}`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); };
    const copySource = async () => {
      const value=source();
      try { await navigator.clipboard.writeText(value); status.textContent='Copied'; return; } catch {}
      const area=document.createElement('textarea'); area.value=value; area.setAttribute('readonly',''); area.style.position='fixed'; area.style.opacity='0'; document.body.appendChild(area); area.select();
      status.textContent=document.execCommand('copy')?'Copied':'Copy failed'; area.remove();
    };
    const exportDiagram = async () => {
      const format = formatSelect.value.toLowerCase();
      if(format==='svg') { saveBlob(new Blob([source()],{type:'image/svg+xml;charset=utf-8'}),'svg'); return; }
      const scale = Math.max(1,Math.min(4,Number(scaleSelect.value)||2));
      const box = svg.viewBox.baseVal; const width=box.width||svg.clientWidth; const height=box.height||svg.clientHeight;
      const image = new Image(); const url=URL.createObjectURL(new Blob([source()],{type:'image/svg+xml'}));
      await new Promise((resolve,reject)=>{ image.onload=resolve; image.onerror=reject; image.src=url; });
      const raster=document.createElement('canvas'); raster.width=Math.round(width*scale); raster.height=Math.round(height*scale);
      const ctx=raster.getContext('2d'); if(format==='jpeg'){ctx.fillStyle='#ffffff';ctx.fillRect(0,0,raster.width,raster.height);} ctx.drawImage(image,0,0,raster.width,raster.height); URL.revokeObjectURL(url);
      const mime=format==='jpeg'?'image/jpeg':format==='webp'?'image/webp':'image/png';
      const blob=await new Promise(resolve=>raster.toBlob(resolve,mime,.94)); if(blob) saveBlob(blob,format==='jpeg'?'jpg':format);
    };
    document.querySelector('.toolbar').addEventListener('click', async event => {
      const action=event.target.closest('[data-action]')?.dataset.action; if(!action)return;
      if(action==='zoom-in')zoom(1.2); else if(action==='zoom-out')zoom(.83); else if(action==='reset')reset();
      else if(action==='theme')document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';
      else if(action==='download')await exportDiagram();
      else if(action==='copy') await copySource();
    });
    document.addEventListener('keydown', event => {
      if(event.target.matches('select'))return;
      if(event.key==='+'||event.key==='=')zoom(1.2); else if(event.key==='-')zoom(.83); else if(event.key==='0'||event.key.toLowerCase()==='r')reset();
      else if(event.key.toLowerCase()==='t')document.querySelector('[data-action=theme]').click(); else if(event.key.toLowerCase()==='s'){event.preventDefault();exportDiagram();}
    });
    render();
  })();
  </script>
</body>
