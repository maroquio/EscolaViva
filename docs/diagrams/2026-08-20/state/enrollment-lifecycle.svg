<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 800" width="1300" height="800">
  <defs>
    <style>text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }</style>
    <marker id="p-475569" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="p-ea580c" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1300" height="800" fill="#ffffff"/>
  <text x="36" y="44" font-size="22" fill="#111827" font-weight="600" text-anchor="start">EscolaViva — Enrollment lifecycle</text>
  <text x="36" y="70" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start">apps/api/src/academics/domain/enrollment.ts · application/enroll.ts · application/transfer.ts · CHECK status_valid in the migration</text>
  <circle cx="315" cy="132" r="9" fill="#111827"/>
  <path d="M 315,141 L 315,193" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#p-475569)"/>
  <text x="332" y="146" font-size="9.5" fill="#475569" font-weight="600" text-anchor="start">enroll  ·  transfer (the new one, into the target class group)</text>
  <text x="332" y="159" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">[the partial unique index refuses a second active one in the same year]</text>
  <rect x="190" y="195" width="250" height="110" rx="12" ry="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="206" y="221" font-size="13.5" fill="#16a34a" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">active</text>
  <text x="206" y="241" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">the only status it is born with</text>
  <text x="206" y="255" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">canTransfer() returns true only here</text>
  <text x="206" y="269" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">ACTIVE_ENROLLMENT_STATUS is the</text>
  <text x="206" y="283" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">constant every writer spells it with</text>
  <rect x="700" y="195" width="250" height="110" rx="12" ry="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
  <text x="716" y="221" font-size="13.5" fill="#ea580c" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">transferred</text>
  <text x="716" y="241" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">terminal at Stage 01</text>
  <text x="716" y="255" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">no use case reads it as a source</text>
  <text x="716" y="269" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">as many rows as the student has</text>
  <text x="716" y="283" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">moves: this is the history</text>
  <path d="M 440,250 L 698,250" fill="none" stroke="#ea580c" stroke-width="1.6" marker-end="url(#p-ea580c)"/>
  <text x="452" y="208" font-size="9.5" fill="#ea580c" font-weight="600" text-anchor="start">transfer [canTransfer]</text>
  <text x="452" y="221" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">/ SET status = 'transferred'</text>
  <text x="452" y="234" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">WHERE id = ? AND status = 'active'</text>
  <text x="452" y="247" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">zero rows updated → the race was lost</text>
  <rect x="190" y="360" width="250" height="62" rx="12" ry="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="206" y="386" font-size="13.5" fill="#9ca3af" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">cancelled</text>
  <text x="206" y="406" font-size="9.5" fill="#9ca3af" font-weight="400" text-anchor="start">no transition in the code</text>
  <rect x="700" y="360" width="250" height="62" rx="12" ry="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="716" y="386" font-size="13.5" fill="#9ca3af" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">completed</text>
  <text x="716" y="406" font-size="9.5" fill="#9ca3af" font-weight="400" text-anchor="start">no transition in the code</text>
  <rect x="990" y="195" width="280" height="227" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container"/>
  <text x="1004" y="219" font-size="11.5" fill="#9ca3af" font-weight="600" text-anchor="start">Declared, never written</text>
  <text x="1004" y="239" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">cancelled and completed live in</text>
  <text x="1004" y="252" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">ENROLLMENT_STATUSES and in the</text>
  <text x="1004" y="265" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">database CHECK. No use case writes</text>
  <text x="1004" y="278" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">either: only SQL run by hand gets</text>
  <text x="1004" y="291" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">there.</text>
  <text x="1004" y="317" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">completed has no transition because</text>
  <text x="1004" y="330" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">closing it would mean deciding where</text>
  <text x="1004" y="343" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">the year's outcome lives — and the</text>
  <text x="1004" y="356" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">enrollment stores neither outcome nor</text>
  <text x="1004" y="369" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">average. Report card and status are</text>
  <text x="1004" y="382" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">computed on read (I5), never in a</text>
  <text x="1004" y="395" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">column.</text>
  <rect x="60" y="470" width="380" height="245" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container"/>
  <text x="74" y="494" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">Transferring is a compound transition</text>
  <text x="74" y="514" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">transfer() opens a unitOfWork and does two things in the</text>
  <text x="74" y="527" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">SAME transaction:</text>
  <text x="74" y="553" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">1. markAsTransferred(origin) — the UPDATE carries</text>
  <text x="74" y="566" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">AND status = 'active' in the WHERE, so with two</text>
  <text x="74" y="579" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">simultaneous transfers only the first one finds the row.</text>
  <text x="74" y="592" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">The loser is told (lostTheRace), not thrown at.</text>
  <text x="74" y="618" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">2. insert(new) into the target class group, born active.</text>
  <text x="74" y="644" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">If the second fails, the first is rolled back. There is no</text>
  <text x="74" y="657" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">student without an enrollment in between — and no window</text>
  <text x="74" y="670" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">in which the same student holds two active rows.</text>
  <rect x="460" y="470" width="380" height="245" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container"/>
  <text x="474" y="494" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">What guarantees there is only one active</text>
  <text x="474" y="514" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Not the application — the index:</text>
  <text x="474" y="540" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">CREATE UNIQUE INDEX active_enrollment_unique_per_year</text>
  <text x="474" y="553" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">  ON enrollment (student_id, academic_year_id)</text>
  <text x="474" y="566" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">  WHERE status = 'active';</text>
  <text x="474" y="592" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Being PARTIAL, it lets as many transferred rows coexist</text>
  <text x="474" y="605" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">for the same student and year as needed, and refuses a</text>
  <text x="474" y="618" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">second active one. The INSERT says ON CONFLICT ... WHERE</text>
  <text x="474" y="631" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">status = 'active' DO NOTHING: the clash is zero rows, not</text>
  <text x="474" y="644" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">a 500.</text>
  <text x="474" y="670" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">The literal 'active' has to stay a literal. Parameterised,</text>
  <text x="474" y="683" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">the planner stops matching the partial index and the</text>
  <text x="474" y="696" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">lookup turns into a sequential scan.</text>
  <rect x="860" y="470" width="380" height="245" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container"/>
  <text x="874" y="494" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">A refusal is a value, and it still rolls back</text>
  <text x="874" y="514" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Every branch above that returns fieldFailure(...) returns</text>
  <text x="874" y="527" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">it from INSIDE unitOfWork(). The unit of work inspects what</text>
  <text x="874" y="540" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">the callback gave back: isRefusal(result) throws an</text>
  <text x="874" y="553" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">internal RolledBackRefusal, Postgres rolls the transaction</text>
  <text x="874" y="566" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">back, and the refusal is handed to the caller as a value.</text>
  <text x="874" y="592" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">That is what keeps a duplicate enrollment from spending</text>
  <text x="874" y="605" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">the client's Idempotency-Key: the key is claimed by the</text>
  <text x="874" y="618" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">first statement of that same transaction, so the rollback</text>
  <text x="874" y="631" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">takes the claim with it and the browser may send the very</text>
  <text x="874" y="644" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">same key again once the person fixes the form.</text>
  <text x="874" y="670" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">A refusal that had merely been returned would have left</text>
  <text x="874" y="683" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">the claim committed and the second attempt answered with</text>
  <text x="874" y="696" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">a repeat of a write that never happened.</text>
  <text x="36" y="780" font-size="9.5" fill="#9ca3af" font-weight="400" text-anchor="start" font-style="italic">Read from apps/api/src/academics/ and migrations/0001_initial_schema.sql. State of Stage 01.</text>
</svg>
