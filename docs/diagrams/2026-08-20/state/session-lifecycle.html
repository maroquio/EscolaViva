<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: blob:">
  <title>EscolaViva — Session lifecycle</title>
  <style>
    :root { color-scheme: dark; --page:#0f0f1a; --panel:#0f172a; --border:#334155; --text:#e2e8f0; --muted:#94a3b8; --accent:#a855f7; }
    html[data-theme="light"] { color-scheme:light; --page:#f8fafc; --panel:#fff; --border:#cbd5e1; --text:#0f172a; --muted:#475569; --accent:#7c3aed; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:linear-gradient(135deg,var(--page),#1a1a2e); color:var(--text); font-family:'SF Mono','Fira Code',ui-monospace,monospace; }
    body { display:grid; grid-template-rows:auto 1fr; }
    .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 14px; background:color-mix(in srgb,var(--panel) 92%,transparent); border-bottom:1px solid var(--border); z-index:2; }
    .title { margin-right:auto; font-size:13px; font-weight:700; }
    button,select { min-height:34px; padding:6px 10px; color:var(--text); background:var(--panel); border:1px solid var(--border); border-radius:8px; font:inherit; cursor:pointer; }
    button:hover,button:focus-visible,select:focus-visible { border-color:var(--accent); outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent); outline-offset:1px; }
    #stage { position:relative; overflow:hidden; touch-action:none; cursor:grab; }
    #stage.dragging { cursor:grabbing; }
    /* Sem `will-change:transform` e sem `filter:` — as duas rasterizam o SVG antes do zoom.
       `will-change` promove #canvas a camada de composicao propria: o Chrome rasteriza a camada
       uma vez, no tamanho em que ela estava, e a GPU passa a escalar o bitmap em vez de reler o
       vetor. `filter:drop-shadow()` obriga o elemento a virar bitmap antes de o filtro rodar, e
       sozinha ja bastaria para pixelar. A sombra volta como `box-shadow`, que se aplica a CAIXA
       do elemento em vez do conteudo pintado e por isso nao força rasterizacao. */
    #canvas { width:100%; height:100%; display:grid; place-items:center; transform-origin:0 0; }
    #canvas svg { max-width:calc(100vw - 40px); max-height:calc(100vh - 92px); width:auto; height:auto; box-shadow:0 22px 60px rgba(0,0,0,.28); user-select:none; }
    #status { min-width:76px; color:var(--muted); font-size:12px; text-align:center; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; transition:none!important; } }
  </style>
</head>
<body>
  <header class="toolbar" aria-label="Diagram controls">
    <span class="title">EscolaViva — Session lifecycle</span>
    <button type="button" data-action="zoom-out" aria-label="Zoom out">−</button>
    <button type="button" data-action="reset" aria-label="Reset view">Reset</button>
    <button type="button" data-action="zoom-in" aria-label="Zoom in">+</button>
    <span id="status" aria-live="polite">100%</span>
    <button type="button" data-action="theme" aria-label="Toggle theme">Theme</button>
    <button type="button" data-action="copy" aria-label="Copy SVG source">Copy SVG</button>
    <select id="scale" aria-label="Raster export scale"><option value="1">1×</option><option value="2" selected>2×</option><option value="3">3×</option><option value="4">4×</option></select>
    <select id="format" aria-label="Export format"><option>SVG</option><option>PNG</option><option>JPEG</option><option>WebP</option></select>
    <button type="button" data-action="download">Export</button>
  </header>
  <main id="stage" tabindex="0" aria-label="Interactive diagram. Drag to pan; use plus and minus to zoom.">
    <div id="canvas"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 820" width="1300" height="820" role="img" focusable="false">
  <defs>
    <style>text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }</style>
    <marker id="p-475569" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569" />
    </marker>
    <marker id="p-ea580c" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c" />
    </marker>
    <marker id="p-dc2626" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1300" height="820" fill="#ffffff" />
  <text x="36" y="44" font-size="22" fill="#111827" font-weight="600" text-anchor="start">EscolaViva — Session lifecycle</text>
  <text x="36" y="70" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start">apps/api/src/identity/domain/session.ts · application/authenticate.ts · application/queries.ts · application/purgeSessions.ts</text>
  <circle cx="315" cy="132" r="9" fill="#111827" />
  <path d="M 315,141 L 315,193" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#p-475569)" />
  <text x="332" y="146" font-size="9.5" fill="#475569" font-weight="600" text-anchor="start">authenticate / INSERT INTO session</text>
  <text x="332" y="159" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">expires_at = sessionExpiration(now, config.sessionDurationHours)</text>
  <text x="332" y="172" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">the signed cookie carries the id, never the user</text>
  <rect x="190" y="195" width="250" height="108" rx="12" ry="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" />
  <text x="206" y="221" font-size="13.5" fill="#16a34a" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">valid</text>
  <text x="206" y="241" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">the row exists and expires_at &gt; now()</text>
  <text x="206" y="255" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">readerFresh() reads it on every request,</text>
  <text x="206" y="269" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">joined to network and app_user</text>
  <rect x="650" y="195" width="250" height="108" rx="12" ry="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8" />
  <text x="666" y="221" font-size="13.5" fill="#ea580c" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">expired</text>
  <text x="666" y="241" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">the row IS STILL in the database</text>
  <text x="666" y="255" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">no write recorded the expiry —</text>
  <text x="666" y="269" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">the clock moved, nobody did</text>
  <path d="M 440,249 L 648,249" fill="none" stroke="#ea580c" stroke-width="1.6" marker-end="url(#p-ea580c)" />
  <text x="452" y="222" font-size="9.5" fill="#ea580c" font-weight="600" text-anchor="start">expires_at &lt; now()</text>
  <text x="452" y="235" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">— only time passes,</text>
  <text x="452" y="248" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">nobody writes</text>
  <circle cx="1215" cy="249" r="13" fill="#ffffff" stroke="#111827" stroke-width="1.8" />
  <circle cx="1215" cy="249" r="7.5" fill="#111827" />
  <path d="M 900,249 L 1200,249" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#p-475569)" />
  <text x="912" y="212" font-size="9.5" fill="#475569" font-weight="600" text-anchor="start">job expurgo-de-sessoes</text>
  <text x="912" y="225" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">/ DELETE WHERE expires_at &lt; now()</text>
  <text x="912" y="238" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">every 15 min, under an advisory lock</text>
  <circle cx="315" cy="400" r="13" fill="#ffffff" stroke="#111827" stroke-width="1.8" />
  <circle cx="315" cy="400" r="7.5" fill="#111827" />
  <path d="M 315,303 L 315,385" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#p-dc2626)" />
  <text x="332" y="330" font-size="9.5" fill="#dc2626" font-weight="600" text-anchor="start">logout / DELETE FROM session WHERE id = ?</text>
  <text x="332" y="343" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">signing out twice is the same state, so DELETE /session</text>
  <text x="332" y="356" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">is a write the idempotency middleware never reserves</text>
  <rect x="650" y="345" width="590" height="132" rx="10" ry="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4" data-graph-role="container" />
  <text x="666" y="369" font-size="11.5" fill="#2563eb" font-weight="600" text-anchor="start">valid in the table ≠ accepted in the request</text>
  <text x="666" y="389" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">validSession() refuses for four independent reasons, and only the first is state of the session itself:</text>
  <text x="666" y="406" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">1. !isUuid(sessionId) — before the database is touched</text>
  <text x="666" y="419" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">2. hasSessionExpired(session, now)</text>
  <text x="960" y="406" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">3. !isNetworkActive(network) — suspended or cancelled</text>
  <text x="960" y="419" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">4. !user.active</text>
  <text x="666" y="445" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Reasons 3 and 4 are state of ANOTHER entity, read in the same SELECT that fetched the session: the answer to</text>
  <text x="666" y="458" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">“is this session usable?” changes without one write to the session row.</text>
  <rect x="60" y="545" width="380" height="200" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container" />
  <text x="74" y="569" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">The refusal drops the cookie, not the row</text>
  <text x="74" y="589" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">When the loader answers null, the session middleware calls</text>
  <text x="74" y="602" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">closeSession(c): the cookie is deleted on the way out.</text>
  <text x="74" y="628" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">So the two halves come apart. The row survives — nothing</text>
  <text x="74" y="641" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">in Stage 01 writes to it on a refusal — but the browser has</text>
  <text x="74" y="654" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">already thrown away the pointer to it.</text>
  <text x="74" y="680" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Reactivating a suspended network therefore signs nobody</text>
  <text x="74" y="693" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">back in: the rows are valid again and unreachable, and the</text>
  <text x="74" y="706" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">purge collects them once they expire.</text>
  <rect x="460" y="545" width="380" height="200" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container" />
  <text x="474" y="569" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">Two gates nobody opens or closes</text>
  <text x="474" y="589" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">network.status accepts active | suspended | cancelled.</text>
  <text x="474" y="602" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">app_user.active is a boolean.</text>
  <text x="474" y="628" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Both are READ to drop a session. Neither is WRITTEN by any</text>
  <text x="474" y="641" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Stage 01 use case — there is no UPDATE on network.status or</text>
  <text x="474" y="654" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">on app_user.active anywhere under apps/api/src.</text>
  <text x="474" y="680" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">They are set by the seed, or by SQL run by hand. Suspending</text>
  <text x="474" y="693" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">a delinquent network is a later stage; the read hook is</text>
  <text x="474" y="706" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">already there, waiting for someone to write.</text>
  <rect x="860" y="545" width="380" height="200" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container" />
  <text x="874" y="569" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">Why the session lives in a table</text>
  <text x="874" y="589" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">The process keeps no state of its own: restarting the server</text>
  <text x="874" y="602" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">signs nobody out, and six instances see the same session with</text>
  <text x="874" y="615" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">no sticky routing and no shared memory.</text>
  <text x="874" y="641" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">The price is one SELECT per request. It goes through</text>
  <text x="874" y="654" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">readerFresh(), the same pool as reader() today and the</text>
  <text x="874" y="667" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">declared place the replica must not answer (I15).</text>
  <text x="874" y="693" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">The purge runs under pg_try_advisory_lock: with one instance</text>
  <text x="874" y="706" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">the lock is redundant; with six it is what stops six</text>
  <text x="874" y="719" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">simultaneous scans. IX (expires_at) is the index it uses.</text>
  <text x="36" y="800" font-size="9.5" fill="#9ca3af" font-weight="400" text-anchor="start" font-style="italic">Read from apps/api/src/identity/ and apps/api/src/shared/jobs/. State of Stage 01.</text>
</svg></div>
    <p class="sr-only">Keyboard shortcuts: plus and minus zoom, zero resets, T toggles theme, S exports.</p>
  </main>
  <script>
  (() => {
    'use strict';
    const metadata = {"slug": "session-lifecycle"};
    const stage = document.getElementById('stage');
    const canvas = document.getElementById('canvas');
    const svg = canvas.querySelector('svg');
    const status = document.getElementById('status');
    const scaleSelect = document.getElementById('scale');
    const formatSelect = document.getElementById('format');
    let view = { x:0, y:0, scale:1 };
    let drag = null;
    const clamp = value => Math.max(.2, Math.min(8, value));
    const render = () => {
      canvas.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.scale})`;
      status.textContent = `${Math.round(view.scale * 100)}%`;
    };
    const zoom = (factor, originX=stage.clientWidth/2, originY=stage.clientHeight/2) => {
      const next = clamp(view.scale * factor);
      const ratio = next / view.scale;
      view.x = originX - (originX - view.x) * ratio;
      view.y = originY - (originY - view.y) * ratio;
      view.scale = next; render();
    };
    const reset = () => { view = {x:0,y:0,scale:1}; render(); };
    stage.addEventListener('wheel', event => { event.preventDefault(); const rect=stage.getBoundingClientRect(); zoom(event.deltaY < 0 ? 1.12 : .89, event.clientX-rect.left, event.clientY-rect.top); }, {passive:false});
    stage.addEventListener('pointerdown', event => { drag={id:event.pointerId,x:event.clientX,y:event.clientY,vx:view.x,vy:view.y}; stage.setPointerCapture(event.pointerId); stage.classList.add('dragging'); });
    stage.addEventListener('pointermove', event => { if(!drag||drag.id!==event.pointerId)return; view.x=drag.vx+event.clientX-drag.x; view.y=drag.vy+event.clientY-drag.y; render(); });
    const endDrag = () => { drag=null; stage.classList.remove('dragging'); };
    stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);
    const source = () => new XMLSerializer().serializeToString(svg);
    const saveBlob = (blob, extension) => { const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${(metadata.slug||'fireworks-tech-graph')}.${extension}`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); };
    const copySource = async () => {
      const value=source();
      try { await navigator.clipboard.writeText(value); status.textContent='Copied'; return; } catch {}
      const area=document.createElement('textarea'); area.value=value; area.setAttribute('readonly',''); area.style.position='fixed'; area.style.opacity='0'; document.body.appendChild(area); area.select();
      status.textContent=document.execCommand('copy')?'Copied':'Copy failed'; area.remove();
    };
    const exportDiagram = async () => {
      const format = formatSelect.value.toLowerCase();
      if(format==='svg') { saveBlob(new Blob([source()],{type:'image/svg+xml;charset=utf-8'}),'svg'); return; }
      const scale = Math.max(1,Math.min(4,Number(scaleSelect.value)||2));
      const box = svg.viewBox.baseVal; const width=box.width||svg.clientWidth; const height=box.height||svg.clientHeight;
      const image = new Image(); const url=URL.createObjectURL(new Blob([source()],{type:'image/svg+xml'}));
      await new Promise((resolve,reject)=>{ image.onload=resolve; image.onerror=reject; image.src=url; });
      const raster=document.createElement('canvas'); raster.width=Math.round(width*scale); raster.height=Math.round(height*scale);
      const ctx=raster.getContext('2d'); if(format==='jpeg'){ctx.fillStyle='#ffffff';ctx.fillRect(0,0,raster.width,raster.height);} ctx.drawImage(image,0,0,raster.width,raster.height); URL.revokeObjectURL(url);
      const mime=format==='jpeg'?'image/jpeg':format==='webp'?'image/webp':'image/png';
      const blob=await new Promise(resolve=>raster.toBlob(resolve,mime,.94)); if(blob) saveBlob(blob,format==='jpeg'?'jpg':format);
    };
    document.querySelector('.toolbar').addEventListener('click', async event => {
      const action=event.target.closest('[data-action]')?.dataset.action; if(!action)return;
      if(action==='zoom-in')zoom(1.2); else if(action==='zoom-out')zoom(.83); else if(action==='reset')reset();
      else if(action==='theme')document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';
      else if(action==='download')await exportDiagram();
      else if(action==='copy') await copySource();
    });
    document.addEventListener('keydown', event => {
      if(event.target.matches('select'))return;
      if(event.key==='+'||event.key==='=')zoom(1.2); else if(event.key==='-')zoom(.83); else if(event.key==='0'||event.key.toLowerCase()==='r')reset();
      else if(event.key.toLowerCase()==='t')document.querySelector('[data-action=theme]').click(); else if(event.key.toLowerCase()==='s'){event.preventDefault();exportDiagram();}
    });
    render();
  })();
  </script>
</body>
</html>
