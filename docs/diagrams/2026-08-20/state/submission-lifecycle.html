  <text x="36" y="70" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start">apps/api/src/shared/http/idempotency.ts · apps/api/src/shared/db/pendingWrite.ts · idempotent_request table · the client mints the key</text>

  <text x="297" y="146" font-size="9.5" fill="#475569" font-weight="600" text-anchor="start">POST with a well-formed Idempotency-Key</text>
  <text x="297" y="159" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">the middleware reserves nothing here: it puts a PendingWrite in an AsyncLocalStorage scope and calls next()</text>
  <text x="297" y="172" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">/ claimPendingWriteInTransaction(sql) — INSERT ... ON CONFLICT DO NOTHING, the FIRST statement of unitOfWork()</text>

  <text x="166" y="241" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">the row exists inside an OPEN</text>
  <text x="166" y="255" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">transaction, invisible to everyone else</text>
  <text x="166" y="269" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">response_hash = ''</text>

  <text x="166" y="297" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">transaction, a few statements below</text>
  <rect x="560" y="195" width="260" height="120" rx="12" ry="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" />

  <text x="166" y="466" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">ROLLBACK took the claim with the write</text>

  <text x="297" y="340" font-size="9.5" fill="#ea580c" font-weight="600" text-anchor="start">a refusal (Result.ok === false), an exception,</text>

  <text x="297" y="366" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">/ ROLLBACK — one statement, not two</text>
  <path d="M 280,527 L 280,552 L 100,552 L 100,132 L 265,132" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#p-ea580c)" />

  <text x="574" y="424" font-size="11.5" fill="#92400e" font-weight="600" text-anchor="start">What a second request with the same key finds</text>
  <text x="574" y="444" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">The INSERT returns zero rows, RepeatedWrite is thrown, that transaction rolls back, and the middleware answers</text>
  <text x="574" y="457" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">from the row that is already there — read with readerFresh(), scoped to the same key, user and route:</text>
  <circle cx="582" cy="477.5" r="3.5" fill="#2563eb" />
  <text x="594" y="481" font-size="9.5" fill="#2563eb" font-weight="600" text-anchor="start">409 · idempotency key still finishing</text>
  <text x="830" y="481" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">the stored response_hash is '' — the first one has not answered yet</text>
  <circle cx="582" cy="495.5" r="3.5" fill="#16a34a" />
  <text x="594" y="499" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="start">200 { repeated: true, location }</text>
  <text x="830" y="499" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">the same destination the first request returned</text>
  <circle cx="582" cy="513.5" r="3.5" fill="#dc2626" />
  <text x="594" y="517" font-size="9.5" fill="#dc2626" font-weight="600" text-anchor="start">409 · key belongs to another request</text>
  <text x="830" y="517" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">no row for this key AND this user AND this route: the key was minted elsewhere</text>
  <rect x="60" y="580" width="380" height="280" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container" />
  <text x="74" y="604" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">Why the claim moved into the transaction</text>
  <text x="74" y="624" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">It used to be the middleware's job: INSERT before the</text>
  <text x="74" y="637" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">handler, DELETE on failure. Two writes, and the second one</text>
  <text x="74" y="650" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">was compensation — the pattern that fails when the process</text>
  <text x="74" y="663" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">dies between them, leaving a key burnt over a write that</text>
  <text x="74" y="676" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">never happened.</text>
  <text x="74" y="702" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Now the claim is the first statement of the very</text>
  <text x="74" y="715" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">transaction that performs the write. Exclusivity is still</text>
  <text x="74" y="728" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">the database's (PRIMARY KEY), and atomicity comes for free:</text>
  <text x="74" y="741" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">the claim commits with the rows it refers to, or it goes</text>
  <text x="74" y="754" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">away with them.</text>
  <text x="74" y="780" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">That is also why a business refusal has to roll back rather</text>
  <text x="74" y="793" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">than merely return — see unitOfWork() and isRefusal().</text>
  <rect x="460" y="580" width="380" height="280" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container" />
  <text x="474" y="604" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">What never reaches the claim</text>
  <text x="474" y="624" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">GET — the middleware returns next() on its first line: no</text>
  <text x="474" y="637" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">body to parse, no key to take.</text>
  <text x="474" y="663" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">PUT, PATCH and DELETE — the body is parsed for the handler</text>
  <text x="474" y="676" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">and the machine stops there. They already say what the</text>
  <text x="474" y="689" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">state should BE, not what to add to it: posting the same</text>
  <text x="474" y="702" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">grades twice leaves the same grades.</text>
  <text x="474" y="728" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Anonymous POST — the table requires user_id, and the only</text>
  <text x="474" y="741" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">write without a session is signing in. Repeating it only</text>
  <text x="474" y="754" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">creates another session.</text>
  <text x="474" y="780" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">POST with no key, or a malformed one — 400 and a warning in</text>
  <text x="474" y="793" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">the log. Never tolerated in silence.</text>
  <rect x="860" y="580" width="380" height="280" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container" />
  <text x="874" y="604" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">The guarantee does not come from the browser</text>
  <text x="874" y="624" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Nothing here depends on the client being a screen this</text>
  <text x="874" y="637" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">system rendered. The contract is: bring one unique key per</text>
  <text x="874" y="650" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">intent, and prove the request came from the application</text>
  <text x="874" y="663" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">(X-Requested-By, checked one middleware earlier).</text>
  <text x="874" y="689" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">A webhook sending the same key gets the same treatment,</text>
  <text x="874" y="702" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">without one line of change — and that is why the table is</text>
  <text x="874" y="715" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">a platform one, with no network_id. It is also why the key</text>
  <text x="874" y="728" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">is scoped by user and route on the way out: a key minted</text>
  <text x="874" y="741" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">for one person cannot replay another person's write.</text>
  <text x="874" y="767" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">The response hash is stored beside the destination. It</text>
  <text x="874" y="780" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">decides nothing today, and exists so that a repeat can</text>
  <text x="874" y="793" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">later be compared instead of merely redirected.</text>
  <text x="36" y="880" font-size="9.5" fill="#9ca3af" font-weight="400" text-anchor="start" font-style="italic">Read from apps/api/src/shared/http/idempotency.ts and apps/api/src/shared/db/. State of Stage 01.</text>

  <script>
  (() => {
    'use strict';
    const metadata = {"slug": "submission-lifecycle"};
    const stage = document.getElementById('stage');
    const canvas = document.getElementById('canvas');
    const svg = canvas.querySelector('svg');
    const status = document.getElementById('status');
    const scaleSelect = document.getElementById('scale');
    const formatSelect = document.getElementById('format');
    let view = { x:0, y:0, scale:1 };
    let drag = null;
    const clamp = value => Math.max(.2, Math.min(8, value));
    const render = () => {
      canvas.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.scale})`;
      status.textContent = `${Math.round(view.scale * 100)}%`;
    };
    const zoom = (factor, originX=stage.clientWidth/2, originY=stage.clientHeight/2) => {
      const next = clamp(view.scale * factor);
      const ratio = next / view.scale;
      view.x = originX - (originX - view.x) * ratio;
      view.y = originY - (originY - view.y) * ratio;
      view.scale = next; render();
    };
    const reset = () => { view = {x:0,y:0,scale:1}; render(); };
    stage.addEventListener('wheel', event => { event.preventDefault(); const rect=stage.getBoundingClientRect(); zoom(event.deltaY < 0 ? 1.12 : .89, event.clientX-rect.left, event.clientY-rect.top); }, {passive:false});
    stage.addEventListener('pointerdown', event => { drag={id:event.pointerId,x:event.clientX,y:event.clientY,vx:view.x,vy:view.y}; stage.setPointerCapture(event.pointerId); stage.classList.add('dragging'); });
    stage.addEventListener('pointermove', event => { if(!drag||drag.id!==event.pointerId)return; view.x=drag.vx+event.clientX-drag.x; view.y=drag.vy+event.clientY-drag.y; render(); });
    const endDrag = () => { drag=null; stage.classList.remove('dragging'); };
    stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);
    const source = () => new XMLSerializer().serializeToString(svg);
    const saveBlob = (blob, extension) => { const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${(metadata.slug||'fireworks-tech-graph')}.${extension}`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); };
    const copySource = async () => {
      const value=source();
      try { await navigator.clipboard.writeText(value); status.textContent='Copied'; return; } catch {}
      const area=document.createElement('textarea'); area.value=value; area.setAttribute('readonly',''); area.style.position='fixed'; area.style.opacity='0'; document.body.appendChild(area); area.select();
      status.textContent=document.execCommand('copy')?'Copied':'Copy failed'; area.remove();
    };
    const exportDiagram = async () => {
      const format = formatSelect.value.toLowerCase();
      if(format==='svg') { saveBlob(new Blob([source()],{type:'image/svg+xml;charset=utf-8'}),'svg'); return; }
      const scale = Math.max(1,Math.min(4,Number(scaleSelect.value)||2));
      const box = svg.viewBox.baseVal; const width=box.width||svg.clientWidth; const height=box.height||svg.clientHeight;
      const image = new Image(); const url=URL.createObjectURL(new Blob([source()],{type:'image/svg+xml'}));
      await new Promise((resolve,reject)=>{ image.onload=resolve; image.onerror=reject; image.src=url; });
      const raster=document.createElement('canvas'); raster.width=Math.round(width*scale); raster.height=Math.round(height*scale);
      const ctx=raster.getContext('2d'); if(format==='jpeg'){ctx.fillStyle='#ffffff';ctx.fillRect(0,0,raster.width,raster.height);} ctx.drawImage(image,0,0,raster.width,raster.height); URL.revokeObjectURL(url);
      const mime=format==='jpeg'?'image/jpeg':format==='webp'?'image/webp':'image/png';
      const blob=await new Promise(resolve=>raster.toBlob(resolve,mime,.94)); if(blob) saveBlob(blob,format==='jpeg'?'jpg':format);
    };
    document.querySelector('.toolbar').addEventListener('click', async event => {
      const action=event.target.closest('[data-action]')?.dataset.action; if(!action)return;
      if(action==='zoom-in')zoom(1.2); else if(action==='zoom-out')zoom(.83); else if(action==='reset')reset();
      else if(action==='theme')document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';
      else if(action==='download')await exportDiagram();
      else if(action==='copy') await copySource();
    });
    document.addEventListener('keydown', event => {
      if(event.target.matches('select'))return;
      if(event.key==='+'||event.key==='=')zoom(1.2); else if(event.key==='-')zoom(.83); else if(event.key==='0'||event.key.toLowerCase()==='r')reset();
      else if(event.key.toLowerCase()==='t')document.querySelector('[data-action=theme]').click(); else if(event.key.toLowerCase()==='s'){event.preventDefault();exportDiagram();}
    });
    render();
  })();
  </script>
</body>
</html>
