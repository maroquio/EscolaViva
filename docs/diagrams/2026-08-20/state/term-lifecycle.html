  <style>
    :root { color-scheme: dark; --page:#0f0f1a; --panel:#0f172a; --border:#334155; --text:#e2e8f0; --muted:#94a3b8; --accent:#a855f7; }
    html[data-theme="light"] { color-scheme:light; --page:#f8fafc; --panel:#fff; --border:#cbd5e1; --text:#0f172a; --muted:#475569; --accent:#7c3aed; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:linear-gradient(135deg,var(--page),#1a1a2e); color:var(--text); font-family:'SF Mono','Fira Code',ui-monospace,monospace; }
    body { display:grid; grid-template-rows:auto 1fr; }
    .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 14px; background:color-mix(in srgb,var(--panel) 92%,transparent); border-bottom:1px solid var(--border); z-index:2; }
    .title { margin-right:auto; font-size:13px; font-weight:700; }
    button,select { min-height:34px; padding:6px 10px; color:var(--text); background:var(--panel); border:1px solid var(--border); border-radius:8px; font:inherit; cursor:pointer; }
    button:hover,button:focus-visible,select:focus-visible { border-color:var(--accent); outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent); outline-offset:1px; }
    #stage { position:relative; overflow:hidden; touch-action:none; cursor:grab; }
    #stage.dragging { cursor:grabbing; }
    /* Sem `will-change:transform` e sem `filter:` — as duas rasterizam o SVG antes do zoom.
       `will-change` promove #canvas a camada de composicao propria: o Chrome rasteriza a camada
       uma vez, no tamanho em que ela estava, e a GPU passa a escalar o bitmap em vez de reler o
       vetor. `filter:drop-shadow()` obriga o elemento a virar bitmap antes de o filtro rodar, e
       sozinha ja bastaria para pixelar. A sombra volta como `box-shadow`, que se aplica a CAIXA
       do elemento em vez do conteudo pintado e por isso nao força rasterizacao. */
    #canvas { width:100%; height:100%; display:grid; place-items:center; transform-origin:0 0; }
    #canvas svg { max-width:calc(100vw - 40px); max-height:calc(100vh - 92px); width:auto; height:auto; box-shadow:0 22px 60px rgba(0,0,0,.28); user-select:none; }
    #status { min-width:76px; color:var(--muted); font-size:12px; text-align:center; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; transition:none!important; } }

  <text x="36" y="44" font-size="22" fill="#111827" font-weight="600" text-anchor="start">EscolaViva — Lifecycle of a class group's term</text>
  <text x="36" y="70" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start">apps/api/src/assessment/application/closeTerm.ts · application/postGrades.ts · domain/termClosing.ts · term_closing table</text>
  <circle cx="315" cy="132" r="9" fill="#111827" />
  <path d="M 315,141 L 315,193" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#p-475569)" />
  <text x="332" y="150" font-size="9.5" fill="#475569" font-weight="600" text-anchor="start">the class group comes into existence</text>
  <rect x="190" y="195" width="250" height="110" rx="12" ry="12" fill="#f8fafc" stroke="#475569" stroke-width="1.8" />
  <text x="206" y="221" font-size="13.5" fill="#475569" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">open</text>
  <text x="206" y="241" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">there is NO row in term_closing</text>
  <text x="206" y="255" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">the state is the absence of the record</text>
  <text x="206" y="269" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">grades and roll call are still accepted</text>
  <rect x="700" y="195" width="250" height="110" rx="12" ry="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" />
  <text x="716" y="221" font-size="13.5" fill="#16a34a" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">closed</text>
  <text x="716" y="241" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">one row: class group + term</text>
  <text x="716" y="255" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">closed_by, closed_at</text>
  <text x="716" y="269" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">no DELETE exists in the repository —</text>
  <text x="716" y="283" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">there is no reopening at Stage 01</text>
  <path d="M 440,250 L 698,250" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#p-16a34a)" />
  <text x="452" y="214" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="start">close / closeTerm(classGroup, term)</text>
  <text x="452" y="227" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">[the five guards pass, the last two</text>
  <text x="452" y="240" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">of them behind the advisory lock]</text>
  <path d="M 250,305 L 250,352 L 380,352 L 380,309" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#p-dc2626)" />
  <text x="200" y="378" font-size="9.5" fill="#dc2626" font-weight="600" text-anchor="start">[any guard fails] / nothing is written, and the screen receives the error code</text>
  <rect x="990" y="195" width="280" height="250" rx="10" ry="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.3" data-graph-role="container" />
  <text x="1004" y="219" font-size="11.5" fill="#2563eb" font-weight="600" text-anchor="start">One rule, three mechanisms</text>
  <text x="1004" y="239" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">1. isClosed() inside the transaction —</text>
  <text x="1004" y="252" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">exists to produce a good message.</text>
  <text x="1004" y="278" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">2. pg_advisory_xact_lock on the pair</text>
  <text x="1004" y="291" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">(class group, term) — serialises the</text>
  <text x="1004" y="304" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">writers that touch that term, and is</text>
  <text x="1004" y="317" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">released by the commit, not by code.</text>
  <text x="1004" y="343" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">3. UQ (class_group_id, term) — the</text>
  <text x="1004" y="356" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">guarantee that survives a bug in the</text>
  <text x="1004" y="369" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">two above.</text>
  <text x="1004" y="395" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">None replaces the others: the check</text>
  <text x="1004" y="408" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">gives the message, the lock gives the</text>
  <text x="1004" y="421" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">order, the index gives the guarantee.</text>
  <rect x="60" y="465" width="380" height="245" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container" />
  <text x="74" y="489" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">The five guards, in the order they run</text>
  <text x="74" y="509" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">OUTSIDE the transaction — reads through the academics</text>
  <text x="74" y="522" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">facade:</text>
  <text x="74" y="535" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">1. classGroupNotFound</text>
  <text x="74" y="548" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">2. noSubject — nothing assigned, so nothing to close</text>
  <text x="74" y="561" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">3. noActiveEnrollment — no active student in it</text>
  <text x="74" y="587" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">INSIDE the unitOfWork, after lockTermForWriting():</text>
  <text x="74" y="600" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">4. alreadyClosed — re-queried here, not earlier: another</text>
  <text x="74" y="613" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">closing fits between the read and the write</text>
  <text x="74" y="626" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">5. incompleteClosing — closingPendingItems() compares,</text>
  <text x="74" y="639" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">subject by subject, how many grades were posted against</text>
  <text x="74" y="652" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">the number of active enrollments. The message says what</text>
  <text x="74" y="665" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">is missing, per subject, not a bare “you cannot”.</text>
  <rect x="460" y="465" width="380" height="245" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container" />
  <text x="474" y="489" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">The open state does not exist in the database</text>
  <text x="474" y="509" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">There is no column, flag or row saying “open”. There are</text>
  <text x="474" y="522" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">rows saying “closed”; the rest is inferred:</text>
  <text x="474" y="548" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">closingStates() takes the stored rows and expands the FOUR</text>
  <text x="474" y="561" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">terms, marking closed: false wherever it found no record.</text>
  <text x="474" y="587" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">The choice has a practical consequence: closing one term</text>
  <text x="474" y="600" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">never has to create rows for the other three, and a term</text>
  <text x="474" y="613" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">nobody touched takes up no space and needs no migration</text>
  <text x="474" y="626" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">to come into being.</text>
  <text x="474" y="652" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">It is the same idea as the enrollment's partial index:</text>
  <text x="474" y="665" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">absence is information.</text>
  <rect x="860" y="465" width="380" height="245" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container" />
  <text x="874" y="489" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">Closing and posting stopped interleaving</text>
  <text x="874" y="509" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">postGrades() takes the SAME advisory lock, on the same</text>
  <text x="874" y="522" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">pair, as the first statement of its own transaction, and</text>
  <text x="874" y="535" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">only then re-reads isClosed().</text>
  <text x="874" y="561" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Without it the two transactions overlapped: a posting that</text>
  <text x="874" y="574" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">had already read “open” could commit its grades after the</text>
  <text x="874" y="587" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">closing committed, and the term ended up closed over a</text>
  <text x="874" y="600" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">set of grades nobody had checked.</text>
  <text x="874" y="626" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Roll call answers the same question one level up:</text>
  <text x="874" y="639" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">recordRollCall() refuses when allTermsClosed() holds for</text>
  <text x="874" y="652" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">the class group — a year that is finished stops accepting</text>
  <text x="874" y="665" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">attendance that would move the report card.</text>
  <text x="36" y="800" font-size="9.5" fill="#9ca3af" font-weight="400" text-anchor="start" font-style="italic">Read from apps/api/src/assessment/ and migrations/0001_initial_schema.sql. State of Stage 01.</text>
</svg></div>

  </main>
  <script>
  (() => {
    'use strict';
    const metadata = {"slug": "term-lifecycle"};
    const stage = document.getElementById('stage');
    const canvas = document.getElementById('canvas');
    const svg = canvas.querySelector('svg');
    const status = document.getElementById('status');
    const scaleSelect = document.getElementById('scale');
    const formatSelect = document.getElementById('format');
    let view = { x:0, y:0, scale:1 };
    let drag = null;
    const clamp = value => Math.max(.2, Math.min(8, value));
    const render = () => {
      canvas.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.scale})`;
      status.textContent = `${Math.round(view.scale * 100)}%`;
    };
    const zoom = (factor, originX=stage.clientWidth/2, originY=stage.clientHeight/2) => {
      const next = clamp(view.scale * factor);
      const ratio = next / view.scale;
      view.x = originX - (originX - view.x) * ratio;
      view.y = originY - (originY - view.y) * ratio;
      view.scale = next; render();
    };
    const reset = () => { view = {x:0,y:0,scale:1}; render(); };
    stage.addEventListener('wheel', event => { event.preventDefault(); const rect=stage.getBoundingClientRect(); zoom(event.deltaY < 0 ? 1.12 : .89, event.clientX-rect.left, event.clientY-rect.top); }, {passive:false});
    stage.addEventListener('pointerdown', event => { drag={id:event.pointerId,x:event.clientX,y:event.clientY,vx:view.x,vy:view.y}; stage.setPointerCapture(event.pointerId); stage.classList.add('dragging'); });
    stage.addEventListener('pointermove', event => { if(!drag||drag.id!==event.pointerId)return; view.x=drag.vx+event.clientX-drag.x; view.y=drag.vy+event.clientY-drag.y; render(); });
    const endDrag = () => { drag=null; stage.classList.remove('dragging'); };
    stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);
    const source = () => new XMLSerializer().serializeToString(svg);
    const saveBlob = (blob, extension) => { const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${(metadata.slug||'fireworks-tech-graph')}.${extension}`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); };
    const copySource = async () => {
      const value=source();
      try { await navigator.clipboard.writeText(value); status.textContent='Copied'; return; } catch {}
      const area=document.createElement('textarea'); area.value=value; area.setAttribute('readonly',''); area.style.position='fixed'; area.style.opacity='0'; document.body.appendChild(area); area.select();
      status.textContent=document.execCommand('copy')?'Copied':'Copy failed'; area.remove();
    };
    const exportDiagram = async () => {
      const format = formatSelect.value.toLowerCase();
      if(format==='svg') { saveBlob(new Blob([source()],{type:'image/svg+xml;charset=utf-8'}),'svg'); return; }
      const scale = Math.max(1,Math.min(4,Number(scaleSelect.value)||2));
      const box = svg.viewBox.baseVal; const width=box.width||svg.clientWidth; const height=box.height||svg.clientHeight;
      const image = new Image(); const url=URL.createObjectURL(new Blob([source()],{type:'image/svg+xml'}));
      await new Promise((resolve,reject)=>{ image.onload=resolve; image.onerror=reject; image.src=url; });
      const raster=document.createElement('canvas'); raster.width=Math.round(width*scale); raster.height=Math.round(height*scale);
      const ctx=raster.getContext('2d'); if(format==='jpeg'){ctx.fillStyle='#ffffff';ctx.fillRect(0,0,raster.width,raster.height);} ctx.drawImage(image,0,0,raster.width,raster.height); URL.revokeObjectURL(url);
      const mime=format==='jpeg'?'image/jpeg':format==='webp'?'image/webp':'image/png';
      const blob=await new Promise(resolve=>raster.toBlob(resolve,mime,.94)); if(blob) saveBlob(blob,format==='jpeg'?'jpg':format);
    };
    document.querySelector('.toolbar').addEventListener('click', async event => {
      const action=event.target.closest('[data-action]')?.dataset.action; if(!action)return;
      if(action==='zoom-in')zoom(1.2); else if(action==='zoom-out')zoom(.83); else if(action==='reset')reset();
      else if(action==='theme')document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';
      else if(action==='download')await exportDiagram();
      else if(action==='copy') await copySource();
    });
    document.addEventListener('keydown', event => {
      if(event.target.matches('select'))return;
      if(event.key==='+'||event.key==='=')zoom(1.2); else if(event.key==='-')zoom(.83); else if(event.key==='0'||event.key.toLowerCase()==='r')reset();
      else if(event.key.toLowerCase()==='t')document.querySelector('[data-action=theme]').click(); else if(event.key.toLowerCase()==='s'){event.preventDefault();exportDiagram();}
    });
    render();
  })();
  </script>
</body>
