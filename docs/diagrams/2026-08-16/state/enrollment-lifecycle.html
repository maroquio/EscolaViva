<!doctype html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>EscolaViva — enrollment lifecycle</title>
  <style>
    :root { color-scheme: dark; --page:#0f0f1a; --panel:#0f172a; --border:#334155; --text:#e2e8f0; --muted:#94a3b8; --accent:#a855f7; }
    html[data-theme="light"] { color-scheme:light; --page:#f8fafc; --panel:#fff; --border:#cbd5e1; --text:#0f172a; --muted:#475569; --accent:#7c3aed; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:linear-gradient(135deg,var(--page),#1a1a2e); color:var(--text); font-family:'SF Mono','Fira Code',ui-monospace,monospace; }
    body { display:grid; grid-template-rows:auto 1fr; }
    .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 14px; background:color-mix(in srgb,var(--panel) 92%,transparent); border-bottom:1px solid var(--border); z-index:2; }
    .title { margin-right:auto; font-size:13px; font-weight:700; }
    button,select { min-height:34px; padding:6px 10px; color:var(--text); background:var(--panel); border:1px solid var(--border); border-radius:8px; font:inherit; cursor:pointer; }
    button:hover,button:focus-visible,select:focus-visible { border-color:var(--accent); outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent); outline-offset:1px; }
    #stage { position:relative; overflow:hidden; touch-action:none; cursor:grab; }
    #stage.dragging { cursor:grabbing; }
    /* Sem `will-change:transform` e sem `filter:` — as duas rasterizam o SVG antes do zoom.
       `will-change` promove #canvas a camada de composicao propria: o Chrome rasteriza a camada
       uma vez, no tamanho em que ela estava, e a GPU passa a escalar o bitmap em vez de reler o
       vetor. `filter:drop-shadow()` obriga o elemento a virar bitmap antes de o filtro rodar, e
       sozinha ja bastaria para pixelar. A sombra volta como `box-shadow`, que se aplica a CAIXA
       do elemento em vez do conteudo pintado e por isso nao força rasterizacao. */
    #canvas { width:100%; height:100%; display:grid; place-items:center; transform-origin:0 0; }
    #canvas svg { max-width:calc(100vw - 40px); max-height:calc(100vh - 92px); width:auto; height:auto; box-shadow:0 22px 60px rgba(0,0,0,.28); user-select:none; }
    #status { min-width:76px; color:var(--muted); font-size:12px; text-align:center; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; transition:none!important; } }
  </style>
</head>
<body>

    <button type="button" data-action="zoom-in" aria-label="Zoom in">+</button>
    <span id="status" aria-live="polite">100%</span>
    <button type="button" data-action="theme" aria-label="Toggle theme">Theme</button>
    <button type="button" data-action="copy" aria-label="Copy SVG source">Copy SVG</button>
    <select id="scale" aria-label="Raster export scale"><option value="1">1×</option><option value="2" selected>2×</option><option value="3">3×</option><option value="4">4×</option></select>
    <select id="format" aria-label="Export format"><option>SVG</option><option>PNG</option><option>JPEG</option><option>WebP</option></select>
    <button type="button" data-action="download">Export</button>
  </header>

  <rect x="0" y="0" width="1240" height="740" fill="#ffffff" />
  <text x="36" y="44" font-size="21" fill="#111827" font-weight="600" text-anchor="start">EscolaViva — Enrollment lifecycle</text>
  <text x="36" y="70" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start">src/academics/domain/enrollment.ts · application/enroll.ts · application/transfer.ts · CHECK status_valid in the migration</text>
  <circle cx="305" cy="132" r="9" fill="#111827" />
  <path d="M 305,141 L 305,193" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#p-475569)" />
  <text x="322" y="152" font-size="9.5" fill="#475569" font-weight="600" text-anchor="start">enroll  ·  transfer (the new one, into the target class group)</text>
  <text x="322" y="165" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">[the partial unique index refuses a second active one in the same year]</text>
  <rect x="190" y="195" width="230" height="96" rx="12" ry="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" />
  <text x="206" y="221" font-size="13.5" fill="#2563eb" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">active</text>
  <text x="206" y="241" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">the only status it is born with</text>
  <text x="206" y="255" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">canTransfer() returns true only here</text>
  <rect x="620" y="195" width="230" height="96" rx="12" ry="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8" />

  <text x="636" y="241" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">terminal at Stage 01</text>
  <text x="636" y="255" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">no use case reads it as a source</text>
  <path d="M 420,243 L 618,243" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#p-475569)" />
  <text x="432" y="218" font-size="9.5" fill="#475569" font-weight="600" text-anchor="start">transfer [status = active]</text>

  <text x="862" y="272" font-size="9" fill="#475569" font-weight="600" text-anchor="start">no outgoing transition</text>
  <rect x="190" y="340" width="230" height="74" rx="12" ry="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="6,4" />
  <text x="206" y="366" font-size="13.5" fill="#9ca3af" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">cancelled</text>
  <text x="206" y="386" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">no transition in the code</text>
  <rect x="450" y="340" width="230" height="74" rx="12" ry="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="6,4" />
  <text x="466" y="366" font-size="13.5" fill="#9ca3af" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">completed</text>
  <text x="466" y="386" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">no transition in the code</text>
  <text x="700" y="362" font-size="9.5" fill="#9ca3af" font-weight="600" text-anchor="start">Declared, never written</text>
  <text x="700" y="375" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">They live in ENROLLMENT_STATUSES and in the database CHECK.</text>
  <text x="700" y="388" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">No use case writes them: only direct SQL gets here.</text>
  <rect x="60" y="470" width="360" height="230" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container" />
  <text x="74" y="494" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">Transferring is a compound transition</text>
  <text x="74" y="514" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">transfer() opens a unitOfWork and does two</text>
  <text x="74" y="527" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">things in the SAME transaction:</text>
  <text x="74" y="540" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="74" y="553" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">1. markAsTransferred(source) — the UPDATE carries</text>
  <text x="74" y="566" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">   AND status = 'active' in the WHERE, so with two</text>
  <text x="74" y="579" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">   simultaneous transfers only the first one finds</text>
  <text x="74" y="592" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">   the row.</text>
  <text x="74" y="605" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">2. insert(new) into the target class group, born active.</text>
  <text x="74" y="618" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="74" y="631" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">If the second fails, the first is rolled back. There</text>
  <text x="74" y="644" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">is no student without an enrollment in between.</text>
  <rect x="440" y="470" width="360" height="230" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container" />
  <text x="454" y="494" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">What guarantees there is only one active</text>
  <text x="454" y="514" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Not the application — the index:</text>
  <text x="454" y="527" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="454" y="540" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">CREATE UNIQUE INDEX active_enrollment_unique_per_year</text>
  <text x="454" y="553" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">  ON enrollment (student_id, academic_year_id)</text>
  <text x="454" y="566" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">  WHERE status = 'active';</text>
  <text x="454" y="579" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="454" y="592" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Being PARTIAL, it lets as many transferred rows</text>
  <text x="454" y="605" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">coexist for the same student and year as needed —</text>
  <text x="454" y="618" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">which is exactly the history — and refuses a second</text>
  <text x="454" y="631" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">active one. The INSERT uses ON CONFLICT DO NOTHING:</text>
  <text x="454" y="644" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">the clash is not a 500, it is zero rows inserted.</text>
  <rect x="820" y="470" width="360" height="230" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container" />
  <text x="834" y="494" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">What this diagram does not show</text>
  <text x="834" y="514" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">The enrollment stores neither outcome nor average. The</text>
  <text x="834" y="527" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">student's academic lifecycle — passed, held back —</text>
  <text x="834" y="540" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">is not a stored state: report card and status are</text>
  <text x="834" y="553" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">computed on read (I5), never in a column.</text>
  <text x="834" y="566" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="834" y="579" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">That is why completed has no transition: closing it</text>
  <text x="834" y="592" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">would require deciding where the year's outcome lives,</text>
  <text x="834" y="605" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">and that decision belongs to a later stage.</text>
  <text x="36" y="720" font-size="9.5" fill="#9ca3af" font-weight="400" text-anchor="start" font-style="italic">Read from src/academics/. State of Stage 01.</text>
</svg></div>
    <p class="sr-only">Keyboard shortcuts: plus and minus zoom, zero resets, T toggles theme, S exports.</p>
  </main>
  <script>
  (() => {
    'use strict';
    const metadata = {"slug": "enrollment-lifecycle"};
    const stage = document.getElementById('stage');
    const canvas = document.getElementById('canvas');
    const svg = canvas.querySelector('svg');
    const status = document.getElementById('status');
    const scaleSelect = document.getElementById('scale');
    const formatSelect = document.getElementById('format');
    let view = { x:0, y:0, scale:1 };
    let drag = null;
    const clamp = value => Math.max(.2, Math.min(8, value));
    const render = () => {
      canvas.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.scale})`;
      status.textContent = `${Math.round(view.scale * 100)}%`;
    };
    const zoom = (factor, originX=stage.clientWidth/2, originY=stage.clientHeight/2) => {
      const next = clamp(view.scale * factor);
      const ratio = next / view.scale;
      view.x = originX - (originX - view.x) * ratio;
      view.y = originY - (originY - view.y) * ratio;
      view.scale = next; render();
    };
    const reset = () => { view = {x:0,y:0,scale:1}; render(); };
    stage.addEventListener('wheel', event => { event.preventDefault(); const rect=stage.getBoundingClientRect(); zoom(event.deltaY < 0 ? 1.12 : .89, event.clientX-rect.left, event.clientY-rect.top); }, {passive:false});
    stage.addEventListener('pointerdown', event => { drag={id:event.pointerId,x:event.clientX,y:event.clientY,vx:view.x,vy:view.y}; stage.setPointerCapture(event.pointerId); stage.classList.add('dragging'); });
    stage.addEventListener('pointermove', event => { if(!drag||drag.id!==event.pointerId)return; view.x=drag.vx+event.clientX-drag.x; view.y=drag.vy+event.clientY-drag.y; render(); });
    const endDrag = () => { drag=null; stage.classList.remove('dragging'); };
    stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);
    const source = () => new XMLSerializer().serializeToString(svg);
    const saveBlob = (blob, extension) => { const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${(metadata.slug||'fireworks-tech-graph')}.${extension}`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); };
    const copySource = async () => {
      const value=source();
      try { await navigator.clipboard.writeText(value); status.textContent='Copied'; return; } catch {}
      const area=document.createElement('textarea'); area.value=value; area.setAttribute('readonly',''); area.style.position='fixed'; area.style.opacity='0'; document.body.appendChild(area); area.select();
      status.textContent=document.execCommand('copy')?'Copied':'Copy failed'; area.remove();
    };
    const exportDiagram = async () => {
      const format = formatSelect.value.toLowerCase();
      if(format==='svg') { saveBlob(new Blob([source()],{type:'image/svg+xml;charset=utf-8'}),'svg'); return; }
      const scale = Math.max(1,Math.min(4,Number(scaleSelect.value)||2));
      const box = svg.viewBox.baseVal; const width=box.width||svg.clientWidth; const height=box.height||svg.clientHeight;
      const image = new Image(); const url=URL.createObjectURL(new Blob([source()],{type:'image/svg+xml'}));
      await new Promise((resolve,reject)=>{ image.onload=resolve; image.onerror=reject; image.src=url; });
      const raster=document.createElement('canvas'); raster.width=Math.round(width*scale); raster.height=Math.round(height*scale);
      const ctx=raster.getContext('2d'); if(format==='jpeg'){ctx.fillStyle='#ffffff';ctx.fillRect(0,0,raster.width,raster.height);} ctx.drawImage(image,0,0,raster.width,raster.height); URL.revokeObjectURL(url);
      const mime=format==='jpeg'?'image/jpeg':format==='webp'?'image/webp':'image/png';
      const blob=await new Promise(resolve=>raster.toBlob(resolve,mime,.94)); if(blob) saveBlob(blob,format==='jpeg'?'jpg':format);
    };
    document.querySelector('.toolbar').addEventListener('click', async event => {
      const action=event.target.closest('[data-action]')?.dataset.action; if(!action)return;
      if(action==='zoom-in')zoom(1.2); else if(action==='zoom-out')zoom(.83); else if(action==='reset')reset();
      else if(action==='theme')document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';
      else if(action==='download')await exportDiagram();
      else if(action==='copy') await copySource();
    });
    document.addEventListener('keydown', event => {
      if(event.target.matches('select'))return;
      if(event.key==='+'||event.key==='=')zoom(1.2); else if(event.key==='-')zoom(.83); else if(event.key==='0'||event.key.toLowerCase()==='r')reset();
      else if(event.key.toLowerCase()==='t')document.querySelector('[data-action=theme]').click(); else if(event.key.toLowerCase()==='s'){event.preventDefault();exportDiagram();}
    });
    render();
  })();
  </script>
