  <rect x="0" y="0" width="1240" height="780" fill="#ffffff"/>
  <text x="36" y="44" font-size="21" fill="#111827" font-weight="600" text-anchor="start">EscolaViva — Lifecycle of a class group's term</text>
  <text x="36" y="70" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start">src/assessment/application/closeTerm.ts · domain/termClosing.ts · term_closing table</text>
  <circle cx="255" cy="132" r="9" fill="#111827"/>
  <path d="M 255,141 L 255,193" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#p-475569)"/>
  <text x="272" y="158" font-size="9.5" fill="#475569" font-weight="600" text-anchor="start">the class group comes into existence</text>
  <rect x="140" y="195" width="250" height="105" rx="12" ry="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="156" y="221" font-size="13.5" fill="#2563eb" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">open</text>
  <text x="156" y="241" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">there is NO row in term_closing</text>
  <text x="156" y="255" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">the state is the absence of the record</text>
  <text x="156" y="269" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">grades and roll call are still accepted</text>
  <path d="M 560,221 L 586,247 L 560,273 L 534,247 Z" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="560" y="251" font-size="9.5" fill="#92400e" font-weight="600" text-anchor="middle">close</text>
  <path d="M 390,247 L 532,247" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#p-475569)"/>
  <text x="402" y="226" font-size="9.5" fill="#475569" font-weight="600" text-anchor="start">closeTerm(classGroup, term)</text>
  <rect x="700" y="195" width="250" height="105" rx="12" ry="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="716" y="221" font-size="13.5" fill="#16a34a" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">closed</text>
  <text x="716" y="241" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">row written: class group + term</text>
  <text x="716" y="255" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">closed_by, closed_at</text>
  <text x="716" y="269" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">no DELETE exists in the repository</text>
  <path d="M 586,247 L 698,247" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#p-16a34a)"/>
  <text x="560" y="200" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">[the five guards pass]</text>
  <circle cx="1060" cy="247" r="13" fill="#ffffff" stroke="#111827" stroke-width="1.8"/>
  <circle cx="1060" cy="247" r="7.5" fill="#111827"/>
  <path d="M 950,247 L 1045,247" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#p-16a34a)"/>
  <text x="962" y="288" font-size="9" fill="#16a34a" font-weight="600" text-anchor="start">no reopening</text>
  <text x="962" y="301" font-size="9" fill="#6b7280" font-weight="400" text-anchor="start">at Stage 01</text>
  <path d="M 560,273 L 560,340 L 265,340 L 265,302" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#p-dc2626)"/>
  <text x="300" y="362" font-size="9.5" fill="#dc2626" font-weight="600" text-anchor="start">[any guard fails] / nothing is written, and the screen receives the error code</text>
  <rect x="60" y="400" width="400" height="300" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container"/>
  <text x="74" y="424" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">The five guards, in the order they run</text>
  <text x="74" y="444" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">OUTSIDE the transaction — reads:</text>
  <text x="74" y="457" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">  1. classGroupNotFound</text>
  <text x="74" y="470" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">  2. noSubject — the class group has no subject</text>
  <text x="74" y="483" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">     assigned, so there is nothing to close</text>
  <text x="74" y="496" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">  3. noActiveEnrollment — no active student in it</text>
  <text x="74" y="509" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start"></text>
  <text x="74" y="522" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">INSIDE the unitOfWork:</text>
  <text x="74" y="535" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">  4. alreadyClosed — re-queried here, not earlier:</text>
  <text x="74" y="548" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">     another closing fits between the read and the</text>
  <text x="74" y="561" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">     write</text>
  <text x="74" y="574" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">  5. incompleteClosing — closingPendingItems()</text>
  <text x="74" y="587" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">     compares, subject by subject, how many grades</text>
  <text x="74" y="600" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">     were posted against the number of active</text>
  <text x="74" y="613" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">     enrollments. The message says what is missing, per</text>
  <text x="74" y="626" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">     subject — not a bare "you cannot".</text>
  <rect x="480" y="400" width="380" height="300" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container"/>
  <text x="494" y="424" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">The open state does not exist in the database</text>
  <text x="494" y="444" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">There is no column, flag or row saying "open".</text>
  <text x="494" y="457" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">There are rows saying "closed"; the rest is inferred:</text>
  <text x="494" y="470" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start"></text>
  <text x="494" y="483" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">closingStates() takes the stored rows and expands</text>
  <text x="494" y="496" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">the FOUR terms, marking closed: false wherever it</text>
  <text x="494" y="509" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">found no record.</text>
  <text x="494" y="522" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start"></text>
  <text x="494" y="535" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">The choice has a practical consequence: closing one</text>
  <text x="494" y="548" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">term never has to create rows for the other three,</text>
  <text x="494" y="561" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">and a term nobody touched takes up no space and</text>
  <text x="494" y="574" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">needs no migration to come into being.</text>
  <text x="494" y="587" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start"></text>
  <text x="494" y="600" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">It is the same idea as the enrollment's partial index:</text>
  <text x="494" y="613" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">absence is information.</text>
  <rect x="880" y="400" width="300" height="300" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container"/>
  <text x="894" y="424" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">The second lock</text>
  <text x="894" y="444" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Guard 4 runs inside the transaction, but it is</text>
  <text x="894" y="457" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">still code.</text>
  <text x="894" y="470" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start"></text>
  <text x="894" y="483" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">UQ (class_group_id, term) is the guarantee that does</text>
  <text x="894" y="496" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">not depend on anyone remembering: two simultaneous</text>
  <text x="894" y="509" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">closings of the same class group and term do not</text>
  <text x="894" y="522" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">get through, even if both read "open" before</text>
  <text x="894" y="535" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">writing.</text>
  <text x="894" y="548" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start"></text>
  <text x="894" y="561" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">The check in code exists to give a good message;</text>
  <text x="894" y="574" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">the index exists to give a guarantee. The two do</text>
  <text x="894" y="587" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">different jobs and neither replaces</text>
  <text x="894" y="600" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">the other.</text>
  <text x="36" y="760" font-size="9.5" fill="#9ca3af" font-weight="400" text-anchor="start" font-style="italic">Read from src/assessment/. State of Stage 01.</text>
</svg>