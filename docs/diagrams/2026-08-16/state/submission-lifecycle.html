  <style>
    :root { color-scheme: dark; --page:#0f0f1a; --panel:#0f172a; --border:#334155; --text:#e2e8f0; --muted:#94a3b8; --accent:#a855f7; }
    html[data-theme="light"] { color-scheme:light; --page:#f8fafc; --panel:#fff; --border:#cbd5e1; --text:#0f172a; --muted:#475569; --accent:#7c3aed; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:linear-gradient(135deg,var(--page),#1a1a2e); color:var(--text); font-family:'SF Mono','Fira Code',ui-monospace,monospace; }
    body { display:grid; grid-template-rows:auto 1fr; }
    .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 14px; background:color-mix(in srgb,var(--panel) 92%,transparent); border-bottom:1px solid var(--border); z-index:2; }
    .title { margin-right:auto; font-size:13px; font-weight:700; }
    button,select { min-height:34px; padding:6px 10px; color:var(--text); background:var(--panel); border:1px solid var(--border); border-radius:8px; font:inherit; cursor:pointer; }
    button:hover,button:focus-visible,select:focus-visible { border-color:var(--accent); outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent); outline-offset:1px; }
    #stage { position:relative; overflow:hidden; touch-action:none; cursor:grab; }
    #stage.dragging { cursor:grabbing; }
    /* Sem `will-change:transform` e sem `filter:` — as duas rasterizam o SVG antes do zoom.
       `will-change` promove #canvas a camada de composicao propria: o Chrome rasteriza a camada
       uma vez, no tamanho em que ela estava, e a GPU passa a escalar o bitmap em vez de reler o
       vetor. `filter:drop-shadow()` obriga o elemento a virar bitmap antes de o filtro rodar, e
       sozinha ja bastaria para pixelar. A sombra volta como `box-shadow`, que se aplica a CAIXA
       do elemento em vez do conteudo pintado e por isso nao força rasterizacao. */
    #canvas { width:100%; height:100%; display:grid; place-items:center; transform-origin:0 0; }
    #canvas svg { max-width:calc(100vw - 40px); max-height:calc(100vh - 92px); width:auto; height:auto; box-shadow:0 22px 60px rgba(0,0,0,.28); user-select:none; }
    #status { min-width:76px; color:var(--muted); font-size:12px; text-align:center; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; transition:none!important; } }
  </style>

  <text x="36" y="70" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start">src/shared/http/idempotency.ts · idempotent_request table · the key is born at render time and comes back in the hidden field _key</text>
  <circle cx="315" cy="132" r="9" fill="#111827" />
  <path d="M 315,141 L 315,193" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#p-475569)" />
  <text x="332" y="146" font-size="9.5" fill="#475569" font-weight="600" text-anchor="start">POST with _key in the expected format</text>
  <text x="332" y="159" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">INSERT ... ON CONFLICT (idempotency_key) DO NOTHING</text>
  <text x="332" y="172" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">RETURNING idempotency_key  →  one row inserted</text>
  <rect x="190" y="195" width="250" height="105" rx="12" ry="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.8" />

  <text x="206" y="255" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">the write is IN PROGRESS</text>

  <text x="206" y="426" font-size="13.5" fill="#ea580c" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">released</text>
  <text x="206" y="446" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">DELETE: the row disappears</text>

  <text x="332" y="330" font-size="9.5" fill="#dc2626" font-weight="600" text-anchor="start">exception in the handler,</text>
  <text x="332" y="343" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">or a response WITHOUT a redirect</text>
  <text x="332" y="356" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">(validation rejected the form)</text>
  <text x="332" y="369" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">/ DELETE FROM idempotent_request</text>

  <text x="452" y="480" font-size="9.5" fill="#dc2626" font-weight="600" text-anchor="start">the user corrects it and resubmits</text>
  <text x="452" y="493" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">the SAME form, the same key</text>
  <rect x="660" y="385" width="300" height="130" rx="10" ry="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.3" data-graph-role="container" />
  <text x="674" y="409" font-size="11.5" fill="#92400e" font-weight="600" text-anchor="start">What the repeat finds</text>
  <text x="674" y="429" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">reserved → 303 to /dashboard.</text>
  <text x="674" y="442" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">There is no target stored yet: the</text>
  <text x="674" y="455" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">first request has not finished.</text>
  <text x="674" y="468" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="674" y="481" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">completed → 303 to response_location:</text>
  <text x="674" y="494" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">the same target as the first one.</text>
  <rect x="60" y="560" width="380" height="230" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container" />
  <text x="74" y="584" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">Why the row goes in BEFORE</text>
  <text x="74" y="604" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">The INSERT happens before the handler runs, and</text>
  <text x="74" y="617" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">exclusivity belongs to the database (PRIMARY KEY),</text>
  <text x="74" y="630" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">not to an if. Two identical requests arriving at the</text>
  <text x="74" y="643" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">same time: one inserts, the other gets a conflict.</text>
  <text x="74" y="656" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="74" y="669" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">If the reservation came later, the window between</text>
  <text x="74" y="682" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">checking and writing would be exactly the interval</text>
  <text x="74" y="695" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">in which the double tap on bad 4G creates the second</text>
  <text x="74" y="708" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">enrollment.</text>
  <text x="74" y="721" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="74" y="734" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Releasing on failure is what keeps a validation</text>
  <text x="74" y="747" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">error from burning the form's key.</text>
  <rect x="460" y="560" width="380" height="230" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container" />
  <text x="474" y="584" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">What never enters this machine</text>
  <text x="474" y="604" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">GET — the middleware returns next() on its first</text>
  <text x="474" y="617" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">line.</text>
  <text x="474" y="630" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="474" y="643" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Anonymous POST — the table requires user_id, and the</text>
  <text x="474" y="656" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">only write without a session is login itself.</text>
  <text x="474" y="669" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Repeating a login only creates another session, and</text>
  <text x="474" y="682" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">there is no record to protect.</text>
  <text x="474" y="695" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="474" y="708" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">POST without _key, or with a malformed key —</text>
  <text x="474" y="721" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">answers 400 and logs a warning. It is not</text>
  <text x="474" y="734" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">tolerated silently: a form with no key is a bug.</text>
  <text x="474" y="747" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="474" y="760" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">/logout — stays out of the write group.</text>
  <rect x="860" y="560" width="380" height="230" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container" />
  <text x="874" y="584" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">The guarantee does not come from HTML</text>
  <text x="874" y="604" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Nothing here depends on the client being a form</text>
  <text x="874" y="617" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">rendered by the system itself. The contract is:</text>
  <text x="874" y="630" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">bring one unique key per intent.</text>
  <text x="874" y="643" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="874" y="656" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">A webhook sending the same key gets the same</text>
  <text x="874" y="669" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">treatment, without one line of change — and that is</text>
  <text x="874" y="682" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">why the table is a platform one, with no network_id.</text>
  <text x="874" y="695" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="874" y="708" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">The response hash is stored next to the target:</text>
  <text x="874" y="721" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">it decides nothing today, and exists so that a</text>
  <text x="874" y="734" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">repeat can later be compared instead of merely</text>
  <text x="874" y="747" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">redirected.</text>
  <text x="36" y="800" font-size="9.5" fill="#9ca3af" font-weight="400" text-anchor="start" font-style="italic">Read from src/shared/http/idempotency.ts. State of Stage 01.</text>
</svg></div>

  <script>
  (() => {
    'use strict';
    const metadata = {"slug": "submission-lifecycle"};
    const stage = document.getElementById('stage');
    const canvas = document.getElementById('canvas');
    const svg = canvas.querySelector('svg');
    const status = document.getElementById('status');
    const scaleSelect = document.getElementById('scale');
    const formatSelect = document.getElementById('format');
    let view = { x:0, y:0, scale:1 };
    let drag = null;
    const clamp = value => Math.max(.2, Math.min(8, value));
    const render = () => {
      canvas.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.scale})`;
      status.textContent = `${Math.round(view.scale * 100)}%`;
    };
    const zoom = (factor, originX=stage.clientWidth/2, originY=stage.clientHeight/2) => {
      const next = clamp(view.scale * factor);
      const ratio = next / view.scale;
      view.x = originX - (originX - view.x) * ratio;
      view.y = originY - (originY - view.y) * ratio;
      view.scale = next; render();
    };
    const reset = () => { view = {x:0,y:0,scale:1}; render(); };
    stage.addEventListener('wheel', event => { event.preventDefault(); const rect=stage.getBoundingClientRect(); zoom(event.deltaY < 0 ? 1.12 : .89, event.clientX-rect.left, event.clientY-rect.top); }, {passive:false});
    stage.addEventListener('pointerdown', event => { drag={id:event.pointerId,x:event.clientX,y:event.clientY,vx:view.x,vy:view.y}; stage.setPointerCapture(event.pointerId); stage.classList.add('dragging'); });
    stage.addEventListener('pointermove', event => { if(!drag||drag.id!==event.pointerId)return; view.x=drag.vx+event.clientX-drag.x; view.y=drag.vy+event.clientY-drag.y; render(); });
    const endDrag = () => { drag=null; stage.classList.remove('dragging'); };
    stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);
    const source = () => new XMLSerializer().serializeToString(svg);
    const saveBlob = (blob, extension) => { const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${(metadata.slug||'fireworks-tech-graph')}.${extension}`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); };
    const copySource = async () => {
      const value=source();
      try { await navigator.clipboard.writeText(value); status.textContent='Copied'; return; } catch {}
      const area=document.createElement('textarea'); area.value=value; area.setAttribute('readonly',''); area.style.position='fixed'; area.style.opacity='0'; document.body.appendChild(area); area.select();
      status.textContent=document.execCommand('copy')?'Copied':'Copy failed'; area.remove();
    };
    const exportDiagram = async () => {
      const format = formatSelect.value.toLowerCase();
      if(format==='svg') { saveBlob(new Blob([source()],{type:'image/svg+xml;charset=utf-8'}),'svg'); return; }
      const scale = Math.max(1,Math.min(4,Number(scaleSelect.value)||2));
      const box = svg.viewBox.baseVal; const width=box.width||svg.clientWidth; const height=box.height||svg.clientHeight;
      const image = new Image(); const url=URL.createObjectURL(new Blob([source()],{type:'image/svg+xml'}));
      await new Promise((resolve,reject)=>{ image.onload=resolve; image.onerror=reject; image.src=url; });
      const raster=document.createElement('canvas'); raster.width=Math.round(width*scale); raster.height=Math.round(height*scale);
      const ctx=raster.getContext('2d'); if(format==='jpeg'){ctx.fillStyle='#ffffff';ctx.fillRect(0,0,raster.width,raster.height);} ctx.drawImage(image,0,0,raster.width,raster.height); URL.revokeObjectURL(url);
      const mime=format==='jpeg'?'image/jpeg':format==='webp'?'image/webp':'image/png';
      const blob=await new Promise(resolve=>raster.toBlob(resolve,mime,.94)); if(blob) saveBlob(blob,format==='jpeg'?'jpg':format);
    };
    document.querySelector('.toolbar').addEventListener('click', async event => {
      const action=event.target.closest('[data-action]')?.dataset.action; if(!action)return;
      if(action==='zoom-in')zoom(1.2); else if(action==='zoom-out')zoom(.83); else if(action==='reset')reset();
      else if(action==='theme')document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';
      else if(action==='download')await exportDiagram();
      else if(action==='copy') await copySource();
    });
    document.addEventListener('keydown', event => {
      if(event.target.matches('select'))return;
      if(event.key==='+'||event.key==='=')zoom(1.2); else if(event.key==='-')zoom(.83); else if(event.key==='0'||event.key.toLowerCase()==='r')reset();
      else if(event.key.toLowerCase()==='t')document.querySelector('[data-action=theme]').click(); else if(event.key.toLowerCase()==='s'){event.preventDefault();exportDiagram();}
    });
    render();
  })();
