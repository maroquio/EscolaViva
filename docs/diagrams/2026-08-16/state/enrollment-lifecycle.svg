  <rect x="0" y="0" width="1240" height="740" fill="#ffffff"/>
  <text x="36" y="44" font-size="21" fill="#111827" font-weight="600" text-anchor="start">EscolaViva — Enrollment lifecycle</text>
  <text x="36" y="70" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start">src/academics/domain/enrollment.ts · application/enroll.ts · application/transfer.ts · CHECK status_valid in the migration</text>
  <circle cx="305" cy="132" r="9" fill="#111827"/>
  <path d="M 305,141 L 305,193" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#p-475569)"/>
  <text x="322" y="152" font-size="9.5" fill="#475569" font-weight="600" text-anchor="start">enroll  ·  transfer (the new one, into the target class group)</text>
  <text x="322" y="165" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">[the partial unique index refuses a second active one in the same year]</text>
  <rect x="190" y="195" width="230" height="96" rx="12" ry="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="206" y="221" font-size="13.5" fill="#2563eb" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">active</text>
  <text x="206" y="241" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">the only status it is born with</text>
  <text x="206" y="255" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">canTransfer() returns true only here</text>
  <rect x="620" y="195" width="230" height="96" rx="12" ry="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
  <text x="636" y="221" font-size="13.5" fill="#ea580c" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">transferred</text>
  <text x="636" y="241" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">terminal at Stage 01</text>
  <text x="636" y="255" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">no use case reads it as a source</text>
  <path d="M 420,243 L 618,243" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#p-475569)"/>
  <text x="432" y="218" font-size="9.5" fill="#475569" font-weight="600" text-anchor="start">transfer [status = active]</text>
  <text x="432" y="231" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">/ SET status = 'transferred'</text>
  <circle cx="960" cy="243" r="13" fill="#ffffff" stroke="#111827" stroke-width="1.8"/>
  <circle cx="960" cy="243" r="7.5" fill="#111827"/>
  <path d="M 850,243 L 945,243" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#p-475569)"/>
  <text x="862" y="272" font-size="9" fill="#475569" font-weight="600" text-anchor="start">no outgoing transition</text>
  <rect x="190" y="340" width="230" height="74" rx="12" ry="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="6,4"/>
  <text x="206" y="366" font-size="13.5" fill="#9ca3af" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">cancelled</text>
  <text x="206" y="386" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">no transition in the code</text>
  <rect x="450" y="340" width="230" height="74" rx="12" ry="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="6,4"/>
  <text x="466" y="366" font-size="13.5" fill="#9ca3af" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">completed</text>
  <text x="466" y="386" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">no transition in the code</text>
  <text x="700" y="362" font-size="9.5" fill="#9ca3af" font-weight="600" text-anchor="start">Declared, never written</text>
  <text x="700" y="375" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">They live in ENROLLMENT_STATUSES and in the database CHECK.</text>
  <text x="700" y="388" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">No use case writes them: only direct SQL gets here.</text>
  <rect x="60" y="470" width="360" height="230" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container"/>
  <text x="74" y="494" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">Transferring is a compound transition</text>
  <text x="74" y="514" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">transfer() opens a unitOfWork and does two</text>
  <text x="74" y="527" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">things in the SAME transaction:</text>
  <text x="74" y="540" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start"></text>
  <text x="74" y="553" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">1. markAsTransferred(source) — the UPDATE carries</text>
  <text x="74" y="566" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">   AND status = 'active' in the WHERE, so with two</text>
  <text x="74" y="579" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">   simultaneous transfers only the first one finds</text>
  <text x="74" y="592" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">   the row.</text>
  <text x="74" y="605" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">2. insert(new) into the target class group, born active.</text>
  <text x="74" y="618" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start"></text>
  <text x="74" y="631" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">If the second fails, the first is rolled back. There</text>
  <text x="74" y="644" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">is no student without an enrollment in between.</text>
  <rect x="440" y="470" width="360" height="230" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container"/>
  <text x="454" y="494" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">What guarantees there is only one active</text>
  <text x="454" y="514" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Not the application — the index:</text>
  <text x="454" y="527" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start"></text>
  <text x="454" y="540" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">CREATE UNIQUE INDEX active_enrollment_unique_per_year</text>
  <text x="454" y="553" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">  ON enrollment (student_id, academic_year_id)</text>
  <text x="454" y="566" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">  WHERE status = 'active';</text>
  <text x="454" y="579" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start"></text>
  <text x="454" y="592" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Being PARTIAL, it lets as many transferred rows</text>
  <text x="454" y="605" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">coexist for the same student and year as needed —</text>
  <text x="454" y="618" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">which is exactly the history — and refuses a second</text>
  <text x="454" y="631" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">active one. The INSERT uses ON CONFLICT DO NOTHING:</text>
  <text x="454" y="644" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">the clash is not a 500, it is zero rows inserted.</text>
  <rect x="820" y="470" width="360" height="230" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container"/>
  <text x="834" y="494" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">What this diagram does not show</text>
  <text x="834" y="514" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">The enrollment stores neither outcome nor average. The</text>
  <text x="834" y="527" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">student's academic lifecycle — passed, held back —</text>
  <text x="834" y="540" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">is not a stored state: report card and status are</text>
  <text x="834" y="553" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">computed on read (I5), never in a column.</text>
  <text x="834" y="566" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start"></text>
  <text x="834" y="579" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">That is why completed has no transition: closing it</text>
  <text x="834" y="592" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">would require deciding where the year's outcome lives,</text>
  <text x="834" y="605" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">and that decision belongs to a later stage.</text>
  <text x="36" y="720" font-size="9.5" fill="#9ca3af" font-weight="400" text-anchor="start" font-style="italic">Read from src/academics/. State of Stage 01.</text>
</svg>