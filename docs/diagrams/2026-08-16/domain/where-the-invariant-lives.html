  <style>
    :root { color-scheme: dark; --page:#0f0f1a; --panel:#0f172a; --border:#334155; --text:#e2e8f0; --muted:#94a3b8; --accent:#a855f7; }
    html[data-theme="light"] { color-scheme:light; --page:#f8fafc; --panel:#fff; --border:#cbd5e1; --text:#0f172a; --muted:#475569; --accent:#7c3aed; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:linear-gradient(135deg,var(--page),#1a1a2e); color:var(--text); font-family:'SF Mono','Fira Code',ui-monospace,monospace; }
    body { display:grid; grid-template-rows:auto 1fr; }
    .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 14px; background:color-mix(in srgb,var(--panel) 92%,transparent); border-bottom:1px solid var(--border); z-index:2; }
    .title { margin-right:auto; font-size:13px; font-weight:700; }
    button,select { min-height:34px; padding:6px 10px; color:var(--text); background:var(--panel); border:1px solid var(--border); border-radius:8px; font:inherit; cursor:pointer; }
    button:hover,button:focus-visible,select:focus-visible { border-color:var(--accent); outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent); outline-offset:1px; }
    #stage { position:relative; overflow:hidden; touch-action:none; cursor:grab; }
    #stage.dragging { cursor:grabbing; }
    /* Sem `will-change:transform` e sem `filter:` — as duas rasterizam o SVG antes do zoom.
       `will-change` promove #canvas a camada de composicao propria: o Chrome rasteriza a camada
       uma vez, no tamanho em que ela estava, e a GPU passa a escalar o bitmap em vez de reler o
       vetor. `filter:drop-shadow()` obriga o elemento a virar bitmap antes de o filtro rodar, e
       sozinha ja bastaria para pixelar. A sombra volta como `box-shadow`, que se aplica a CAIXA
       do elemento em vez do conteudo pintado e por isso nao força rasterizacao. */
    #canvas { width:100%; height:100%; display:grid; place-items:center; transform-origin:0 0; }
    #canvas svg { max-width:calc(100vw - 40px); max-height:calc(100vh - 92px); width:auto; height:auto; box-shadow:0 22px 60px rgba(0,0,0,.28); user-select:none; }
    #status { min-width:76px; color:var(--muted); font-size:12px; text-align:center; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; transition:none!important; } }
  </style>

  <text x="56" y="948" font-size="10" fill="#111827" font-weight="400" text-anchor="start">Shape and type of every external input</text>

  <path d="M 40,964 H 1700" stroke="#f1f5f9" stroke-width="1" />
  <rect x="40" y="1006" width="1660" height="46" rx="8" ry="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.4" data-graph-role="container" />
  <text x="56" y="1035" font-size="11.5" fill="#0f766e" font-weight="600" text-anchor="start">11 invariants live in both places  ·  5 only the database guarantees  ·  4 only the domain knows  ·  1 is input shape alone, so only the edge sees it</text>
  <rect x="40" y="1076" width="540" height="250" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container" />
  <text x="54" y="1100" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">Why write the same rule twice</text>
  <text x="54" y="1120" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">The two sides do different jobs.</text>
  <text x="54" y="1133" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="54" y="1146" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">The domain predicate exists to give a MESSAGE. It runs first, knows</text>
  <text x="54" y="1159" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">which field was wrong and returns a Result the screen can show next</text>
  <text x="54" y="1172" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">to the input. A violated CHECK returns 23514 and a string nobody</text>
  <text x="54" y="1185" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">wants to read.</text>
  <text x="54" y="1198" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="54" y="1211" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">The CHECK exists to give a GUARANTEE. It holds for the seed, for the</text>
  <text x="54" y="1224" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">migration, for the SQL someone runs in psql at two in the morning and</text>
  <text x="54" y="1237" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">for the version of the code not deployed yet. The predicate only</text>
  <text x="54" y="1250" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">holds for whoever went through it.</text>
  <text x="54" y="1263" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="54" y="1276" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Neither replaces the other. Removing the predicate makes the screen</text>
  <text x="54" y="1289" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">worse; removing the CHECK erases the guarantee.</text>
  <rect x="600" y="1076" width="540" height="250" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container" />
  <text x="614" y="1100" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">What ONLY the database can guarantee</text>
  <text x="614" y="1120" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">The five rows with nothing in the domain column have one thing in</text>
  <text x="614" y="1133" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">common: they are all uniqueness, and uniqueness is the only invariant</text>
  <text x="614" y="1146" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">that does not survive concurrency when checked in code.</text>
  <text x="614" y="1159" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="614" y="1172" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Between the SELECT that says "it does not exist" and the INSERT that</text>
  <text x="614" y="1185" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">creates it, a whole other transaction fits. Two simultaneous</text>
  <text x="614" y="1198" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">enrollments for one student pass both checks and create both rows.</text>
  <text x="614" y="1211" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="614" y="1224" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">That is why active_enrollment_unique_per_year is an index, and the</text>
  <text x="614" y="1237" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">INSERT uses ON CONFLICT DO NOTHING: the clash is zero rows, not a 500.</text>
  <text x="614" y="1250" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="614" y="1263" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">The same goes for term closing, which re-queries INSIDE the</text>
  <text x="614" y="1276" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">transaction and still relies on the UNIQUE underneath.</text>
  <rect x="1160" y="1076" width="540" height="250" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container" />
  <text x="1174" y="1100" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">What ONLY the domain knows</text>
  <text x="1174" y="1120" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">isDateWithinAcademicYear — the database keeps the roll-call date and</text>
  <text x="1174" y="1133" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">the academic year dates in different tables; comparing them is a rule,</text>
  <text x="1174" y="1146" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">and a rule lives in a pure function.</text>
  <text x="1174" y="1159" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="1174" y="1172" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">finalStatus — passed or failed NEVER becomes a column (I5). Average,</text>
  <text x="1174" y="1185" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">attendance percentage and status are computed on read, from the</text>
  <text x="1174" y="1198" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">grades and the attendance. Storing the result would create a second</text>
  <text x="1174" y="1211" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">truth that goes stale on the first grade correction.</text>
  <text x="1174" y="1224" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start" />
  <text x="1174" y="1237" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Announcement title and body, and the minimum password length: product</text>
  <text x="1174" y="1250" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">limits, which change by decision and not by integrity. A migration to</text>
  <text x="1174" y="1263" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">loosen a text limit is cost with nothing in return.</text>
  <text x="36" y="1380" font-size="9.5" fill="#9ca3af" font-weight="400" text-anchor="start" font-style="italic">Invariants read from src/*/domain/ and migrations/0001_initial_schema.sql. State of Stage 01.</text>
</svg></div>
    <p class="sr-only">Keyboard shortcuts: plus and minus zoom, zero resets, T toggles theme, S exports.</p>
  </main>
  <script>
  (() => {
    'use strict';
    const metadata = {"slug": "where-the-invariant-lives"};
    const stage = document.getElementById('stage');
    const canvas = document.getElementById('canvas');
    const svg = canvas.querySelector('svg');
    const status = document.getElementById('status');
    const scaleSelect = document.getElementById('scale');
    const formatSelect = document.getElementById('format');
    let view = { x:0, y:0, scale:1 };
    let drag = null;
    const clamp = value => Math.max(.2, Math.min(8, value));
    const render = () => {
      canvas.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.scale})`;
      status.textContent = `${Math.round(view.scale * 100)}%`;
    };
    const zoom = (factor, originX=stage.clientWidth/2, originY=stage.clientHeight/2) => {
      const next = clamp(view.scale * factor);
      const ratio = next / view.scale;
      view.x = originX - (originX - view.x) * ratio;
      view.y = originY - (originY - view.y) * ratio;
      view.scale = next; render();
    };
    const reset = () => { view = {x:0,y:0,scale:1}; render(); };
    stage.addEventListener('wheel', event => { event.preventDefault(); const rect=stage.getBoundingClientRect(); zoom(event.deltaY < 0 ? 1.12 : .89, event.clientX-rect.left, event.clientY-rect.top); }, {passive:false});
    stage.addEventListener('pointerdown', event => { drag={id:event.pointerId,x:event.clientX,y:event.clientY,vx:view.x,vy:view.y}; stage.setPointerCapture(event.pointerId); stage.classList.add('dragging'); });
    stage.addEventListener('pointermove', event => { if(!drag||drag.id!==event.pointerId)return; view.x=drag.vx+event.clientX-drag.x; view.y=drag.vy+event.clientY-drag.y; render(); });
    const endDrag = () => { drag=null; stage.classList.remove('dragging'); };
    stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);
    const source = () => new XMLSerializer().serializeToString(svg);
    const saveBlob = (blob, extension) => { const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${(metadata.slug||'fireworks-tech-graph')}.${extension}`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); };
    const copySource = async () => {
      const value=source();
      try { await navigator.clipboard.writeText(value); status.textContent='Copied'; return; } catch {}
      const area=document.createElement('textarea'); area.value=value; area.setAttribute('readonly',''); area.style.position='fixed'; area.style.opacity='0'; document.body.appendChild(area); area.select();
      status.textContent=document.execCommand('copy')?'Copied':'Copy failed'; area.remove();
    };
    const exportDiagram = async () => {
      const format = formatSelect.value.toLowerCase();
      if(format==='svg') { saveBlob(new Blob([source()],{type:'image/svg+xml;charset=utf-8'}),'svg'); return; }
      const scale = Math.max(1,Math.min(4,Number(scaleSelect.value)||2));
      const box = svg.viewBox.baseVal; const width=box.width||svg.clientWidth; const height=box.height||svg.clientHeight;
      const image = new Image(); const url=URL.createObjectURL(new Blob([source()],{type:'image/svg+xml'}));
      await new Promise((resolve,reject)=>{ image.onload=resolve; image.onerror=reject; image.src=url; });
      const raster=document.createElement('canvas'); raster.width=Math.round(width*scale); raster.height=Math.round(height*scale);
      const ctx=raster.getContext('2d'); if(format==='jpeg'){ctx.fillStyle='#ffffff';ctx.fillRect(0,0,raster.width,raster.height);} ctx.drawImage(image,0,0,raster.width,raster.height); URL.revokeObjectURL(url);
      const mime=format==='jpeg'?'image/jpeg':format==='webp'?'image/webp':'image/png';
      const blob=await new Promise(resolve=>raster.toBlob(resolve,mime,.94)); if(blob) saveBlob(blob,format==='jpeg'?'jpg':format);
    };
    document.querySelector('.toolbar').addEventListener('click', async event => {
      const action=event.target.closest('[data-action]')?.dataset.action; if(!action)return;
      if(action==='zoom-in')zoom(1.2); else if(action==='zoom-out')zoom(.83); else if(action==='reset')reset();
      else if(action==='theme')document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';
      else if(action==='download')await exportDiagram();
      else if(action==='copy') await copySource();
    });
    document.addEventListener('keydown', event => {
      if(event.target.matches('select'))return;
      if(event.key==='+'||event.key==='=')zoom(1.2); else if(event.key==='-')zoom(.83); else if(event.key==='0'||event.key.toLowerCase()==='r')reset();
      else if(event.key.toLowerCase()==='t')document.querySelector('[data-action=theme]').click(); else if(event.key.toLowerCase()==='s'){event.preventDefault();exportDiagram();}
    });
    render();
  })();
  </script>
