  <style>
    :root { color-scheme: dark; --page:#0f0f1a; --panel:#0f172a; --border:#334155; --text:#e2e8f0; --muted:#94a3b8; --accent:#a855f7; }
    html[data-theme="light"] { color-scheme:light; --page:#f8fafc; --panel:#fff; --border:#cbd5e1; --text:#0f172a; --muted:#475569; --accent:#7c3aed; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:linear-gradient(135deg,var(--page),#1a1a2e); color:var(--text); font-family:'SF Mono','Fira Code',ui-monospace,monospace; }
    body { display:grid; grid-template-rows:auto 1fr; }
    .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 14px; background:color-mix(in srgb,var(--panel) 92%,transparent); border-bottom:1px solid var(--border); z-index:2; }
    .title { margin-right:auto; font-size:13px; font-weight:700; }
    button,select { min-height:34px; padding:6px 10px; color:var(--text); background:var(--panel); border:1px solid var(--border); border-radius:8px; font:inherit; cursor:pointer; }
    button:hover,button:focus-visible,select:focus-visible { border-color:var(--accent); outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent); outline-offset:1px; }
    #stage { position:relative; overflow:hidden; touch-action:none; cursor:grab; }
    #stage.dragging { cursor:grabbing; }
    /* Sem `will-change:transform` e sem `filter:` — as duas rasterizam o SVG antes do zoom.
       `will-change` promove #canvas a camada de composicao propria: o Chrome rasteriza a camada
       uma vez, no tamanho em que ela estava, e a GPU passa a escalar o bitmap em vez de reler o
       vetor. `filter:drop-shadow()` obriga o elemento a virar bitmap antes de o filtro rodar, e
       sozinha ja bastaria para pixelar. A sombra volta como `box-shadow`, que se aplica a CAIXA
       do elemento em vez do conteudo pintado e por isso nao força rasterizacao. */
    #canvas { width:100%; height:100%; display:grid; place-items:center; transform-origin:0 0; }
    #canvas svg { max-width:calc(100vw - 40px); max-height:calc(100vh - 92px); width:auto; height:auto; box-shadow:0 22px 60px rgba(0,0,0,.28); user-select:none; }
    #status { min-width:76px; color:var(--muted); font-size:12px; text-align:center; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; transition:none!important; } }

  <text x="36" y="44" font-size="22" fill="#111827" font-weight="600" text-anchor="start">EscolaViva — Application architecture</text>
  <text x="36" y="70" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">Modular monolith · four bounded contexts · dependency always pointing inward · boundaries checked by tooling, not by agreement</text>
  <rect x="68" y="104" width="1096" height="92" rx="8" ry="8" fill="#111827" stroke="#374151" stroke-width="1.4" />
  <text x="90" y="132" font-size="14" fill="#f9fafb" font-weight="600" text-anchor="start">src/main.ts — composition root</text>
  <text x="90" y="154" font-size="11" fill="#cbd5e1" font-weight="400" text-anchor="start">The first import is config: it validates the environment and throws. A process that starts without DATABASE_URL finds out in the middle of an enrollment.</text>
  <text x="90" y="172" font-size="11" fill="#cbd5e1" font-weight="400" text-anchor="start">Bun.serve({ fetch: app.fetch })   ·   startScheduler([sessionPurge]) — the only point outside web that calls a module directly</text>
  <text x="90" y="188" font-size="11" fill="#94a3b8" font-weight="400" text-anchor="start">SIGTERM/SIGINT: stop accepting → drain what is in flight → close the pool. In that order, so the queue does not grow while draining.</text>
  <rect x="52" y="212" width="1128" height="188" rx="12" ry="12" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,5" data-graph-role="container" />
  <text x="68" y="236" font-size="12.5" fill="#475569" font-weight="600" text-anchor="start">Interface (delivery) — src/web/ : HTTP in, HTML out. No business rule lives here.</text>
  <rect x="68" y="258" width="344" height="124" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.4" />
  <text x="84" y="280" font-size="12.5" fill="#2563eb" font-weight="600" text-anchor="start">src/web/app.ts</text>
  <text x="84" y="300" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start">Hono. The chain order is the semantics:</text>
  <text x="84" y="316" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start">errors → correlation → cache → session → routes</text>
  <text x="84" y="332" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="start">onError repeats the error middleware because</text>
  <text x="84" y="348" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="start">Hono will not let the exception reach next().</text>
  <text x="84" y="364" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="start">Serves /public with a filename allowlist.</text>
  <rect x="444" y="258" width="344" height="124" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.4" />
  <text x="460" y="280" font-size="12.5" fill="#2563eb" font-weight="600" text-anchor="start">src/web/routes/</text>
  <text x="460" y="300" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start">7 routers mounted by prefix: login, account,</text>
  <text x="460" y="316" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start">network, registrar, teacher, guardian,</text>
  <text x="460" y="332" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="start">announcements. routeMap.ts gives typed ROUTES —</text>
  <text x="460" y="348" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="start">the compiler enforces :params, the .eta does not.</text>
  <text x="460" y="364" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="start">Idempotency only on the groups that write.</text>
  <rect x="820" y="258" width="344" height="124" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.4" />
  <text x="836" y="280" font-size="12.5" fill="#2563eb" font-weight="600" text-anchor="start">src/web/render.ts + templates/</text>
  <text x="836" y="300" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start">Eta with autoEscape: interpolating user data is</text>
  <text x="836" y="316" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start">safe by default, and "~" becomes a visible decision.</text>
  <text x="836" y="332" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="start">45 .eta files. One function builds every page and</text>
  <text x="836" y="348" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="start">injects session, idempotency key, ROUTES and the</text>
  <text x="836" y="364" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="start">versioned CSS name. POST-Redirect-GET.</text>

  <text x="1226" y="272" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="start">identity is the leaf: it knows nobody — and that is why</text>
  <text x="1226" y="288" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="start">the other three are allowed to point at it.</text>
  <text x="1226" y="310" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start">Every arrow crosses through index.ts. domain/, application/ and infra/ are private.</text>
  <rect x="1210" y="346" width="452" height="300" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.2" data-graph-role="container" />
  <text x="1226" y="370" font-size="12.5" fill="#475569" font-weight="600" text-anchor="start">Three rules that `bun run check` rejects — config/.dependency-cruiser.js</text>
  <rect x="1226" y="378" width="4" height="91" rx="2" fill="#7c3aed" />
  <text x="1240" y="390" font-size="11" fill="#7c3aed" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">no-cross-module-shortcut</text>
  <text x="1240" y="408" font-size="10" fill="#6b7280" font-weight="400" text-anchor="start">A module only sees another through index.ts. An internal path</text>
  <text x="1240" y="423" font-size="10" fill="#6b7280" font-weight="400" text-anchor="start">is private. It is what gives "what else touches this?" an</text>
  <text x="1240" y="438" font-size="10" fill="#6b7280" font-weight="400" text-anchor="start">answer: when billing/ is extracted at S14, the list of</text>
  <text x="1240" y="453" font-size="10" fill="#6b7280" font-weight="400" text-anchor="start">dependents is exactly whoever imports the index — without it,</text>
  <text x="1240" y="468" font-size="10" fill="#6b7280" font-weight="400" text-anchor="start">the extraction turns into a rewrite.</text>
  <rect x="1226" y="487" width="4" height="61" rx="2" fill="#16a34a" />
  <text x="1240" y="499" font-size="11" fill="#16a34a" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">pure-domain</text>
  <text x="1240" y="517" font-size="10" fill="#6b7280" font-weight="400" text-anchor="start">The domain does not know a database, HTTP, log, scheduler or</text>
  <text x="1240" y="532" font-size="10" fill="#6b7280" font-weight="400" text-anchor="start">third-party library exists. It only reaches ports/, result.ts</text>
  <text x="1240" y="547" font-size="10" fill="#6b7280" font-weight="400" text-anchor="start">and document/. That is what makes a rule test a pure test.</text>
  <rect x="1226" y="566" width="4" height="61" rx="2" fill="#475569" />
  <text x="1240" y="578" font-size="11" fill="#475569" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">shared-knows-no-domain</text>
  <text x="1240" y="596" font-size="10" fill="#6b7280" font-weight="400" text-anchor="start">Dependency always points inward: shared/ imports no context at</text>
  <text x="1240" y="611" font-size="10" fill="#6b7280" font-weight="400" text-anchor="start">all. That is why shared/http/session.ts declares the shape of</text>
  <text x="1240" y="626" font-size="10" fill="#6b7280" font-weight="400" text-anchor="start">the user instead of importing it from identity.</text>
  <rect x="1210" y="662" width="452" height="238" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.2" data-graph-role="container" />
  <text x="1226" y="686" font-size="12.5" fill="#475569" font-weight="600" text-anchor="start">Decisions the blueprint does not show on its own</text>
  <text x="1226" y="708" font-size="10.5" fill="#111827" font-weight="600" text-anchor="start">Unit of Work</text>
  <text x="1226" y="722" font-size="10" fill="#6b7280" font-weight="400" text-anchor="start">unitOfWork() is the application's only commit point. The outbox INSERT,</text>
  <text x="1226" y="735" font-size="10" fill="#6b7280" font-weight="400" text-anchor="start">when it exists, goes in there and nowhere else.</text>
  <text x="1226" y="753" font-size="10.5" fill="#111827" font-weight="600" text-anchor="start">Replica before the replica</text>
  <text x="1226" y="767" font-size="10" fill="#6b7280" font-weight="400" text-anchor="start">reader() and writer() are already distinct functions over a single pool.</text>
  <text x="1226" y="780" font-size="10" fill="#6b7280" font-weight="400" text-anchor="start">Switching to the replica at S08 touches no repository.</text>
  <text x="1226" y="798" font-size="10.5" fill="#111827" font-weight="600" text-anchor="start">The key comes from the application</text>

    <p class="sr-only">Keyboard shortcuts: plus and minus zoom, zero resets, T toggles theme, S exports.</p>
  </main>
  <script>
  (() => {
    'use strict';
    const metadata = {"slug": "architecture"};
    const stage = document.getElementById('stage');
    const canvas = document.getElementById('canvas');
    const svg = canvas.querySelector('svg');
    const status = document.getElementById('status');
    const scaleSelect = document.getElementById('scale');
    const formatSelect = document.getElementById('format');
    let view = { x:0, y:0, scale:1 };
    let drag = null;
    const clamp = value => Math.max(.2, Math.min(8, value));
    const render = () => {
      canvas.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.scale})`;
      status.textContent = `${Math.round(view.scale * 100)}%`;
    };
    const zoom = (factor, originX=stage.clientWidth/2, originY=stage.clientHeight/2) => {
      const next = clamp(view.scale * factor);
      const ratio = next / view.scale;
      view.x = originX - (originX - view.x) * ratio;
      view.y = originY - (originY - view.y) * ratio;
      view.scale = next; render();
    };
    const reset = () => { view = {x:0,y:0,scale:1}; render(); };
    stage.addEventListener('wheel', event => { event.preventDefault(); const rect=stage.getBoundingClientRect(); zoom(event.deltaY < 0 ? 1.12 : .89, event.clientX-rect.left, event.clientY-rect.top); }, {passive:false});
    stage.addEventListener('pointerdown', event => { drag={id:event.pointerId,x:event.clientX,y:event.clientY,vx:view.x,vy:view.y}; stage.setPointerCapture(event.pointerId); stage.classList.add('dragging'); });
    stage.addEventListener('pointermove', event => { if(!drag||drag.id!==event.pointerId)return; view.x=drag.vx+event.clientX-drag.x; view.y=drag.vy+event.clientY-drag.y; render(); });
    const endDrag = () => { drag=null; stage.classList.remove('dragging'); };
    stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);
    const source = () => new XMLSerializer().serializeToString(svg);
    const saveBlob = (blob, extension) => { const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${(metadata.slug||'fireworks-tech-graph')}.${extension}`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); };
    const copySource = async () => {
      const value=source();
      try { await navigator.clipboard.writeText(value); status.textContent='Copied'; return; } catch {}
      const area=document.createElement('textarea'); area.value=value; area.setAttribute('readonly',''); area.style.position='fixed'; area.style.opacity='0'; document.body.appendChild(area); area.select();
      status.textContent=document.execCommand('copy')?'Copied':'Copy failed'; area.remove();
    };
    const exportDiagram = async () => {
      const format = formatSelect.value.toLowerCase();
      if(format==='svg') { saveBlob(new Blob([source()],{type:'image/svg+xml;charset=utf-8'}),'svg'); return; }
      const scale = Math.max(1,Math.min(4,Number(scaleSelect.value)||2));
      const box = svg.viewBox.baseVal; const width=box.width||svg.clientWidth; const height=box.height||svg.clientHeight;
      const image = new Image(); const url=URL.createObjectURL(new Blob([source()],{type:'image/svg+xml'}));
      await new Promise((resolve,reject)=>{ image.onload=resolve; image.onerror=reject; image.src=url; });
      const raster=document.createElement('canvas'); raster.width=Math.round(width*scale); raster.height=Math.round(height*scale);
      const ctx=raster.getContext('2d'); if(format==='jpeg'){ctx.fillStyle='#ffffff';ctx.fillRect(0,0,raster.width,raster.height);} ctx.drawImage(image,0,0,raster.width,raster.height); URL.revokeObjectURL(url);
      const mime=format==='jpeg'?'image/jpeg':format==='webp'?'image/webp':'image/png';
      const blob=await new Promise(resolve=>raster.toBlob(resolve,mime,.94)); if(blob) saveBlob(blob,format==='jpeg'?'jpg':format);
    };
    document.querySelector('.toolbar').addEventListener('click', async event => {
      const action=event.target.closest('[data-action]')?.dataset.action; if(!action)return;
      if(action==='zoom-in')zoom(1.2); else if(action==='zoom-out')zoom(.83); else if(action==='reset')reset();
      else if(action==='theme')document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';
      else if(action==='download')await exportDiagram();
      else if(action==='copy') await copySource();
    });
    document.addEventListener('keydown', event => {
      if(event.target.matches('select'))return;
      if(event.key==='+'||event.key==='=')zoom(1.2); else if(event.key==='-')zoom(.83); else if(event.key==='0'||event.key.toLowerCase()==='r')reset();
      else if(event.key.toLowerCase()==='t')document.querySelector('[data-action=theme]').click(); else if(event.key.toLowerCase()==='s'){event.preventDefault();exportDiagram();}
    });
    render();
  })();
  </script>
</body>
