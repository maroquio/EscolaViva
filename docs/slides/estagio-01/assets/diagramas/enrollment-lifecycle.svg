<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 800" width="1300" height="800">
  <defs>
    <style>text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }</style>
    <marker id="p-475569" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="p-ea580c" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1300" height="800" fill="#ffffff"/>
  <text x="36" y="44" font-size="22" fill="#111827" font-weight="600" text-anchor="start">EscolaViva — Ciclo da matrícula</text>
  <text x="36" y="70" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start">apps/api/src/academics/domain/enrollment.ts · application/enroll.ts · application/transfer.ts · CHECK status_valid na migração</text>
  <circle cx="315" cy="132" r="9" fill="#111827"/>
  <path d="M 315,141 L 315,193" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#p-475569)"/>
  <text x="332" y="146" font-size="9.5" fill="#475569" font-weight="600" text-anchor="start">enroll  ·  transfer (a nova, na turma de destino)</text>
  <text x="332" y="159" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">[o índice parcial único recusa uma segunda ativa no mesmo ano]</text>
  <rect x="190" y="195" width="250" height="110" rx="12" ry="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="206" y="221" font-size="13.5" fill="#16a34a" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">active</text>
  <text x="206" y="241" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">o único status com que ela nasce</text>
  <text x="206" y="255" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">canTransfer() só retorna true aqui</text>
  <text x="206" y="269" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">ACTIVE_ENROLLMENT_STATUS é a</text>
  <text x="206" y="283" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">constante que toda escrita usa</text>
  <rect x="700" y="195" width="250" height="110" rx="12" ry="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
  <text x="716" y="221" font-size="13.5" fill="#ea580c" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">transferred</text>
  <text x="716" y="241" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">terminal no Estágio 01</text>
  <text x="716" y="255" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">nenhum caso de uso parte dela</text>
  <text x="716" y="269" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">uma linha por mudança do aluno:</text>
  <text x="716" y="283" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">este é o histórico</text>
  <path d="M 440,250 L 698,250" fill="none" stroke="#ea580c" stroke-width="1.6" marker-end="url(#p-ea580c)"/>
  <text x="452" y="208" font-size="9.5" fill="#ea580c" font-weight="600" text-anchor="start">transfer [canTransfer]</text>
  <text x="452" y="221" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">/ SET status = 'transferred'</text>
  <text x="452" y="234" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">WHERE id = ? AND status = 'active'</text>
  <text x="452" y="247" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">zero linhas no UPDATE → corrida perdida</text>
  <rect x="190" y="360" width="250" height="62" rx="12" ry="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="206" y="386" font-size="13.5" fill="#9ca3af" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">cancelled</text>
  <text x="206" y="406" font-size="9.5" fill="#9ca3af" font-weight="400" text-anchor="start">sem transição no código</text>
  <rect x="700" y="360" width="250" height="62" rx="12" ry="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="716" y="386" font-size="13.5" fill="#9ca3af" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">completed</text>
  <text x="716" y="406" font-size="9.5" fill="#9ca3af" font-weight="400" text-anchor="start">sem transição no código</text>
  <rect x="990" y="195" width="280" height="227" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container"/>
  <text x="1004" y="219" font-size="11.5" fill="#9ca3af" font-weight="600" text-anchor="start">Declarados, nunca escritos</text>
  <text x="1004" y="239" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">cancelled e completed vivem em</text>
  <text x="1004" y="252" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">ENROLLMENT_STATUSES e no CHECK do</text>
  <text x="1004" y="265" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">banco. Nenhum caso de uso escreve</text>
  <text x="1004" y="278" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">neles: só SQL rodado na mão chega</text>
  <text x="1004" y="291" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">lá.</text>
  <text x="1004" y="317" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">completed não tem transição porque</text>
  <text x="1004" y="330" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">fechá-lo exigiria decidir onde mora</text>
  <text x="1004" y="343" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">o resultado do ano — e a matrícula</text>
  <text x="1004" y="356" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">não guarda resultado nem média.</text>
  <text x="1004" y="369" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Boletim e situação são calculados</text>
  <text x="1004" y="382" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">na leitura (I5), nunca em uma</text>
  <text x="1004" y="395" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">coluna.</text>
  <rect x="60" y="470" width="380" height="245" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container"/>
  <text x="74" y="494" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">Transferir é uma transição composta</text>
  <text x="74" y="514" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">transfer() abre um unitOfWork e faz duas coisas na</text>
  <text x="74" y="527" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">MESMA transação:</text>
  <text x="74" y="553" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">1. markAsTransferred(origin) — o UPDATE leva</text>
  <text x="74" y="566" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">AND status = 'active' no WHERE, então com dois</text>
  <text x="74" y="579" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">transfers simultâneos só o primeiro acha a linha.</text>
  <text x="74" y="592" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">O perdedor é avisado (lostTheRace), sem exceção.</text>
  <text x="74" y="618" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">2. insert(new) na turma de destino, nasce active.</text>
  <text x="74" y="644" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Se o segundo falha, o primeiro sofre rollback. Não há</text>
  <text x="74" y="657" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">aluno sem matrícula no meio do caminho — nem janela</text>
  <text x="74" y="670" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">em que o mesmo aluno tenha duas linhas active.</text>
  <rect x="460" y="470" width="380" height="245" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container"/>
  <text x="474" y="494" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">O que garante uma só matrícula active</text>
  <text x="474" y="514" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Não é a aplicação — é o índice:</text>
  <text x="474" y="540" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">CREATE UNIQUE INDEX active_enrollment_unique_per_year</text>
  <text x="474" y="553" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">  ON enrollment (student_id, academic_year_id)</text>
  <text x="474" y="566" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">  WHERE status = 'active';</text>
  <text x="474" y="592" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Por ser PARCIAL, ele aceita quantas linhas transferred</text>
  <text x="474" y="605" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">existirem para o mesmo aluno e ano, e recusa a segunda</text>
  <text x="474" y="618" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">active. O INSERT diz ON CONFLICT ... WHERE status =</text>
  <text x="474" y="631" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">'active' DO NOTHING: o choque vira zero linhas, não</text>
  <text x="474" y="644" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">um 500.</text>
  <text x="474" y="670" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">O literal 'active' precisa seguir literal. Parametrizado,</text>
  <text x="474" y="683" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">o planner deixa de casar com o índice parcial e a</text>
  <text x="474" y="696" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">busca vira varredura sequencial.</text>
  <rect x="860" y="470" width="380" height="245" rx="10" ry="10" fill="#fcfcfd" stroke="#e5e7eb" stroke-width="1.3" data-graph-role="container"/>
  <text x="874" y="494" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">A recusa é um valor, e ainda faz rollback</text>
  <text x="874" y="514" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Todo ramo acima que devolve fieldFailure(...) devolve</text>
  <text x="874" y="527" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">de DENTRO de unitOfWork(). A unidade de trabalho olha o</text>
  <text x="874" y="540" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">que o callback devolveu: isRefusal(result) lança um</text>
  <text x="874" y="553" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">RolledBackRefusal interno, o Postgres desfaz a transação,</text>
  <text x="874" y="566" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">e a recusa chega a quem chamou como valor.</text>
  <text x="874" y="592" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">É isso que impede uma matrícula duplicada de gastar o</text>
  <text x="874" y="605" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Idempotency-Key do cliente: a reserva sai no primeiro</text>
  <text x="874" y="618" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">comando dessa mesma transação, então o rollback leva a</text>
  <text x="874" y="631" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">reserva junto e o navegador pode mandar a mesma chave de</text>
  <text x="874" y="644" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">novo assim que a pessoa corrigir o formulário.</text>
  <text x="874" y="670" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">Uma recusa apenas devolvida teria deixado a reserva</text>
  <text x="874" y="683" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">comitada e a segunda tentativa seria respondida com</text>
  <text x="874" y="696" font-size="9.5" fill="#6b7280" font-weight="400" text-anchor="start">a repetição de uma escrita que não houve.</text>
  <text x="36" y="780" font-size="9.5" fill="#9ca3af" font-weight="400" text-anchor="start" font-style="italic">Lido de apps/api/src/academics/ e migrations/0001_initial_schema.sql. Estado do Estágio 01.</text>
</svg>
